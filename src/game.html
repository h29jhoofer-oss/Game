<title>Bibi Clicker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;600&display=swap">
<style>
  /* Layout: flag-striped arena on the left, upgrade ledger on the right; stacks on phones. */
  :root {
    --blue: #0038b8;
    --blue-deep: #00267d;
    --blue-soft: #dfe8ff;
    --white: #ffffff;
    --ground: #f3f6fd;
    --ink: #0b1d52;
    --ink-soft: #52618f;
    --display: "Rubik", "Arial Black", system-ui, sans-serif;
    --body: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* drifting flags in the background */
  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .drift {
    position: absolute; bottom: -80px; width: 54px; opacity: .22;
    animation: drift linear forwards;
  }
  @keyframes drift {
    to { transform: translateY(calc(-100vh - 160px)) rotate(var(--spin, 20deg)); }
  }

  .band { position: relative; z-index: 1; flex: none; height: 10px; background: var(--blue); }
  .wrap {
    position: relative; z-index: 1;
    flex: 1; min-height: 0; width: 100%;
    max-width: 1040px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding-block: clamp(8px, 2vh, 18px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  header { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; }
  header h1 {
    margin: 0;
    font-family: var(--display); font-weight: 900;
    font-size: clamp(1.5rem, min(6vw, 5.5vh), 2.8rem);
    letter-spacing: -.5px; text-wrap: balance;
    color: var(--blue-deep);
  }
  .flag { display: block; width: clamp(38px, min(9vw, 8vh), 72px); height: auto; filter: drop-shadow(0 3px 5px rgba(0,38,125,.25)); }
  header .flag { transform-origin: left center; animation: wave 2.6s ease-in-out infinite; }
  header .flag.r { transform-origin: right center; animation-delay: -1.3s; }
  @keyframes wave {
    0%,100% { transform: perspective(200px) rotateY(0) skewY(0); }
    50% { transform: perspective(200px) rotateY(-18deg) skewY(-3deg); }
  }

  .scoreline { flex: none; text-align: center; margin: clamp(2px, 1vh, 8px) 0 clamp(6px, 1.8vh, 16px); }
  #score {
    display: inline-block;
    font-family: var(--display); font-weight: 900;
    font-size: clamp(2rem, min(10vw, 7vh), 3.6rem); line-height: 1.1;
    color: var(--blue); font-variant-numeric: tabular-nums;
  }
  #score.bump { animation: bump .18s ease-out; }
  @keyframes bump { 50% { transform: scale(1.12); } }
  #rate { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #whisper {
    max-width: 640px; margin: 2px auto 0;
    color: var(--blue); font-style: italic; font-size: .88rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; transition: opacity .4s;
  }
  #whisper:hover { text-decoration: underline; }
  #whisper.fade { opacity: 0; }

  /* the lore book */
  #lore {
    position: fixed; inset: 0; z-index: 8;
    display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(0, 20, 70, .55);
    animation: fadein .2s ease-out;
  }
  @keyframes fadein { from { opacity: 0; } }
  .book {
    width: min(680px, 100%); max-height: 100%;
    display: flex; flex-direction: column;
    background: var(--white); color: var(--ink);
    border: 4px solid var(--blue); border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,20,70,.45);
    overflow: hidden;
    animation: open .3s cubic-bezier(.2,1.3,.4,1);
    user-select: text; -webkit-user-select: text;
  }
  @keyframes open { from { transform: translateY(30px) scale(.95); opacity: 0; } }
  .book-head {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; background: var(--blue); color: var(--white);
  }
  .book-head h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 1.3rem; text-wrap: balance; }
  .book-head .meta { font-size: .82rem; opacity: .85; }
  #loreclose {
    margin-left: auto; flex: none; width: 36px; height: 36px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,.5); background: transparent; color: var(--white);
    font-size: 1.3rem; line-height: 1; cursor: pointer;
  }
  #loreclose:hover { background: rgba(255,255,255,.15); }
  #loreclose:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
  .tabs { flex: none; display: flex; gap: 6px; padding: 10px 16px 0; border-bottom: 2px solid var(--blue-soft); }
  .tab {
    padding: 8px 14px; border: 2px solid var(--blue-soft); border-bottom: none;
    border-radius: 10px 10px 0 0; background: var(--ground); color: var(--ink-soft);
    font: inherit; font-weight: 600; cursor: pointer; margin-bottom: -2px;
  }
  .tab[aria-selected="true"] { background: var(--white); color: var(--blue); border-color: var(--blue-soft); border-bottom: 2px solid var(--white); }
  .tab:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }
  .pages { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .entry { border-left: 4px solid var(--blue); padding: 2px 0 2px 14px; }
  .entry h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--blue-deep); }
  .entry p { margin: 0 0 8px; line-height: 1.55; max-width: 62ch; }
  .entry p:last-child { margin-bottom: 0; }
  .entry .note { font-size: .82rem; color: var(--ink-soft); }
  .entry.locked { border-left-color: var(--blue-soft); color: var(--ink-soft); }
  .entry.locked h3 { color: var(--ink-soft); letter-spacing: 2px; }
  .entry.fresh { animation: fresh 1.6s ease-out; }
  @keyframes fresh { 0%, 40% { background: var(--blue-soft); } }
  .bar { height: 6px; max-width: 280px; border-radius: 999px; background: var(--blue-soft); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--blue); }

  main {
    flex: 1; min-height: 0;
    display: flex; gap: clamp(12px, 2.5vw, 24px); justify-content: center; align-items: stretch;
  }

  /* arena: white field with the flag's two stripes */
  #stage {
    position: relative;
    height: 100%; max-height: 560px; max-width: 100%;
    aspect-ratio: 3 / 4;
    flex: none;
    border: 5px solid var(--blue); border-radius: 20px;
    background:
      linear-gradient(transparent 7%, var(--blue) 7%, var(--blue) 13%, transparent 13%,
                      transparent 87%, var(--blue) 87%, var(--blue) 93%, transparent 93%),
      var(--white);
    box-shadow: 0 12px 34px rgba(0,56,184,.22);
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
  }
  #stage:focus-visible { outline: 4px solid var(--blue-deep); outline-offset: 4px; }

  /* slow rotating star of david behind the face */
  #halo {
    position: absolute; left: 50%; top: 50%;
    width: 86%; translate: -50% -50%;
    opacity: .12; pointer-events: none;
    animation: spin 30s linear infinite;
  }
  @keyframes spin { to { rotate: 360deg; } }

  #face-wrap {
    position: absolute; left: 50%; top: 50%;
    width: 58%; translate: -50% -50%;
    animation: float 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes float { 50% { transform: translateY(-10px) rotate(1.5deg); } }
  #face {
    display: block; width: 100%; height: auto;
    border-radius: 50%;
    box-shadow: 0 0 0 6px var(--white), 0 0 0 11px var(--blue), 0 14px 26px rgba(0,38,125,.35);
    transition: transform .08s;
  }
  #face.hit { animation: squash .22s ease-out; }
  @keyframes squash {
    0% { transform: scale(1, 1); }
    30% { transform: scale(1.12, .86); }
    60% { transform: scale(.94, 1.08); }
    100% { transform: scale(1, 1); }
  }

  .ring {
    position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px;
    border: 3px solid var(--blue); border-radius: 50%;
    pointer-events: none; animation: ring .5s ease-out forwards;
  }
  @keyframes ring { to { transform: scale(7); opacity: 0; } }

  .pop {
    position: absolute; pointer-events: none;
    font-family: var(--display); font-weight: 900; font-size: 1.6rem;
    color: var(--blue);
    text-shadow: 0 0 3px var(--white), 0 0 6px var(--white), 0 0 10px var(--white);
    animation: rise .9s ease-out forwards;
  }
  .pop.crit { font-size: 2.3rem; color: var(--blue-deep); }
  @keyframes rise {
    0% { opacity: 1; transform: translate(-50%, 0) scale(.6); }
    20% { transform: translate(-50%, -14px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -90px) scale(1); }
  }

  .spark {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    pointer-events: none;
    animation: burst .7s cubic-bezier(.2,.7,.4,1) forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  #stage .corner { position: absolute; top: 17%; width: 52px; pointer-events: none; animation: wave 2.6s ease-in-out infinite; }
  #stage .corner.l { left: 10px; rotate: -12deg; }
  #stage .corner.r { right: 10px; rotate: 12deg; animation-delay: -1.3s; }

  /* ledger */
  #shop {
    width: min(380px, 100%);
    max-height: 560px; min-height: 0;
    background: var(--white);
    border: 3px solid var(--blue); border-radius: 20px;
    padding: clamp(10px, 1.6vh, 16px);
    box-shadow: 0 12px 34px rgba(0,56,184,.14);
    display: flex; flex-direction: column; gap: 8px;
  }
  #items {
    flex: 1; min-height: 0;
    display: grid; grid-auto-rows: 1fr; gap: clamp(4px, .9vh, 8px);
    overflow-y: auto;
  }
  #shop h2 {
    margin: 0; display: flex; align-items: center; gap: 10px;
    font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--blue-deep);
  }
  #shop h2 .flag { width: 30px; }
  #lorebtn { margin-left: auto; position: relative; }
  #lorebtn.new::after {
    content: ""; position: absolute; top: -4px; right: -4px; width: 12px; height: 12px;
    border-radius: 50%; background: #e0a800; border: 2px solid var(--white);
    animation: blink 1s steps(2) infinite;
  }
  #mute, #lorebtn {
    width: 36px; height: 36px; padding: 6px;
    border: 2px solid var(--blue-soft); border-radius: 10px; background: var(--ground);
    color: var(--blue); cursor: pointer;
  }
  #mute:hover, #lorebtn:hover { border-color: var(--blue); }
  #lorebtn:focus-visible, #mute:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }
  #lorebtn svg, #mute svg { width: 100%; height: 100%; display: block; }
  #mute .off { display: none; }
  #mute[aria-pressed="true"] .on { display: none; }
  #mute[aria-pressed="true"] .off { display: block; }
  .item {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    width: 100%; min-height: 0; padding: 4px 12px 4px 8px;
    border: 2px solid var(--blue-soft); border-radius: 12px;
    background: var(--ground); color: var(--ink);
    font: inherit; text-align: left; cursor: pointer;
    position: relative; overflow: hidden;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .item .name { font-weight: 600; }
  .item .label { flex: 1; min-width: 0; line-height: 1.2; }
  .icon {
    flex: none; width: clamp(30px, 5vh, 42px); aspect-ratio: 1;
    padding: 5px; border-radius: 10px;
    background: var(--white); border: 2px solid var(--blue-soft);
    color: var(--blue);
  }
  .icon svg { display: block; width: 100%; height: 100%; }
  .item:not(:disabled):hover .icon { animation: jiggle .4s ease-in-out; }
  @keyframes jiggle { 25% { rotate: -10deg; } 75% { rotate: 10deg; } }
  .item.bought .icon { animation: hop .4s ease-out; }
  @keyframes hop { 40% { transform: translateY(-6px) scale(1.15); } }
  .item small { display: block; color: var(--ink-soft); }
  .item .cost { font-family: var(--display); font-weight: 700; color: var(--blue); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .item:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); transform: translateY(-2px); }
  .item:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }
  .item:disabled { opacity: .5; cursor: not-allowed; }
  /* shimmer across upgrades you can afford */
  .item:not(:disabled)::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%);
    transform: translateX(-100%);
    animation: shimmer 2.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer { 60%,100% { transform: translateX(100%); } }
  .item.bought { animation: bought .4s ease-out; }
  @keyframes bought { 40% { background: var(--blue); color: var(--white); transform: scale(1.03); } }
  .count {
    display: inline-block; min-width: 1.6em; padding: 0 6px; margin-left: 6px;
    border-radius: 999px; background: var(--blue); color: var(--white);
    font-size: .8rem; text-align: center;
  }

  #reset {
    flex: none; align-self: flex-start;
    background: none; border: none; padding: 4px 0;
    color: var(--ink-soft); text-decoration: underline; cursor: pointer; font: inherit;
  }
  #reset.armed { color: #b00020; font-weight: 600; }

  /* milestone banner */
  #toast {
    position: fixed; left: 50%; top: calc(24px + env(safe-area-inset-top, 0px)); z-index: 5;
    translate: -50% -160%;
    padding: 12px 22px; border-radius: 999px;
    background: var(--blue); color: var(--white);
    font-family: var(--display); font-weight: 700; font-size: 1.1rem;
    box-shadow: 0 10px 24px rgba(0,38,125,.35);
    transition: translate .35s cubic-bezier(.2,1.4,.4,1);
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { translate: -50% 0; }

  /* Yahu-Bots: little robots that walk across the whole screen */
  #bots { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .bot {
    position: absolute; left: 0; width: 84px;
    pointer-events: auto; cursor: pointer;
    filter: drop-shadow(0 6px 6px rgba(0,38,125,.3));
    touch-action: manipulation;
  }
  .bot:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 4px; border-radius: 12px; }
  .bot .rig { animation: bob .44s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 -5px; } }
  .bot .head {
    position: relative; z-index: 1; display: block;
    width: 62px; margin: 0 auto -6px;
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--white), 0 0 0 6px var(--blue);
  }
  .bot .antenna {
    position: absolute; left: 50%; top: -14px; width: 3px; height: 14px; margin-left: -1.5px;
    background: var(--blue);
  }
  .bot .antenna::after {
    content: ""; position: absolute; left: -4px; top: -8px; width: 11px; height: 11px;
    border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 8px #ff3b3b;
    animation: blink .8s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }
  .bot svg.body { display: block; width: 100%; height: auto; overflow: visible; }
  .bot .leg { transform-box: fill-box; transform-origin: 50% 0; animation: step .44s ease-in-out infinite alternate; }
  .bot .leg.b { animation-direction: alternate-reverse; }
  .bot .arm { transform-box: fill-box; transform-origin: 50% 0; animation: step .44s ease-in-out infinite alternate-reverse; }
  .bot .arm.b { animation-direction: alternate; }
  @keyframes step { from { rotate: -22deg; } to { rotate: 22deg; } }
  .bot .tag {
    position: absolute; left: 50%; top: -38px; translate: -50% 0;
    padding: 2px 8px; border-radius: 999px;
    background: var(--blue); color: var(--white);
    font-family: var(--display); font-weight: 700; font-size: .72rem; white-space: nowrap;
  }
  .bot.zapped { pointer-events: none; animation: zap .45s ease-in forwards; }
  @keyframes zap { 30% { scale: 1.25; } 100% { scale: 0; rotate: 200deg; opacity: 0; } }
  .bigpop {
    position: fixed; z-index: 6; pointer-events: none;
    font-family: var(--display); font-weight: 900; font-size: 2.6rem; color: var(--blue-deep);
    text-shadow: 0 0 4px var(--white), 0 0 8px var(--white), 0 0 14px var(--white);
    animation: rise 1.3s ease-out forwards;
  }
  .fxspark { position: fixed; z-index: 6; }

  @media (max-width: 700px) {
    .bot { width: 66px; }
    .bot .head { width: 48px; }
  }

  @media (max-width: 700px) {
    main { flex-direction: column; align-items: center; }
    #stage { height: auto; flex: 1 1 0; min-height: 0; width: auto; max-height: none; }
    #shop { width: 100%; flex: none; max-height: 52%; }
    #items { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; }
    .item { padding: 6px; display: grid; grid-template-columns: auto 1fr; column-gap: 6px; row-gap: 0; align-items: center; }
    .item .icon { grid-row: span 2; }
    .item .cost { grid-column: 2; line-height: 1.1; }
    .item small { display: none; }
    .item .name { font-size: .82rem; }
    .item .cost { font-size: .85rem; }
    .icon { width: 30px; padding: 4px; }
    .count { position: absolute; top: 4px; right: 4px; margin: 0; font-size: .68rem; }
    .item { min-height: 50px; }
    .item .name { display: block; padding-right: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #shop h2 { font-size: 1.05rem; }
    #reset { font-size: .85rem; }
  }
  @media (max-height: 560px) {
    .item small { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #sky { display: none; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="il" viewBox="0 0 220 160">
    <rect width="220" height="160" fill="#fff"/>
    <rect y="15" width="220" height="25" fill="#0038b8"/>
    <rect y="120" width="220" height="25" fill="#0038b8"/>
    <g fill="none" stroke="#0038b8" stroke-width="5.5">
      <polygon points="110,52 137,98 83,98"/>
      <polygon points="110,108 137,62 83,62"/>
    </g>
  </symbol>
  <symbol id="star" viewBox="0 0 60 60">
    <g fill="none" stroke="#0038b8" stroke-width="5" stroke-linejoin="round">
      <polygon points="30,4 53,44 7,44"/>
      <polygon points="30,56 53,16 7,16"/>
    </g>
  </symbol>
</svg>

<div id="sky" aria-hidden="true"></div>
<div class="band"></div>

<div class="wrap">
  <header>
    <svg class="flag" viewBox="0 0 220 160" aria-hidden="true"><use href="#il"/></svg>
    <h1>Bibi Clicker</h1>
    <svg class="flag r" viewBox="0 0 220 160" aria-hidden="true"><use href="#il"/></svg>
  </header>

  <div class="scoreline">
    <div id="score">0</div>
    <div id="rate">0 per second · 1 per click</div>
    <div id="whisper" role="button" tabindex="0" title="Open the lore book">&nbsp;</div>
  </div>

  <main>
    <div id="stage" role="button" tabindex="0" aria-label="Click Bibi to earn points">
      <svg id="halo" viewBox="0 0 60 60" aria-hidden="true"><use href="#star"/></svg>
      <svg class="corner l" viewBox="0 0 220 160" aria-hidden="true"><use href="#il"/></svg>
      <svg class="corner r" viewBox="0 0 220 160" aria-hidden="true"><use href="#il"/></svg>
      <div id="face-wrap"><img id="face" alt="Benjamin Netanyahu" src="data:image/webp;base64,__FACE__"></div>
    </div>

    <section id="shop" aria-label="Upgrades">
      <h2><svg class="flag" viewBox="0 0 220 160" aria-hidden="true"><use href="#il"/></svg>Upgrades
        <button id="lorebtn" type="button" aria-label="Open the lore book" title="Lore">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/><path d="M12 6l1.7 3h-3.4zM12 12l1.7-3h-3.4z" stroke-width="1.3"/></svg>
        </button>
        <button id="mute" type="button" aria-pressed="false" aria-label="Mute sound" title="Sound on/off">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
      </h2>
      <div id="items"></div>
      <button id="reset" type="button">Reset progress</button>
    </section>
  </main>
</div>

<div class="band"></div>
<div id="toast" role="status"></div>
<div id="bots"></div>
<div id="lore" hidden>
  <div class="book" role="dialog" aria-modal="true" aria-labelledby="loretitle">
    <div class="book-head">
      <div>
        <h2 id="loretitle">The Book of Bibi</h2>
        <div class="meta" id="loremeta"></div>
      </div>
      <button id="loreclose" type="button" aria-label="Close the lore book">&times;</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-chron" aria-selected="true">The Chronicle</button>
      <button class="tab" role="tab" id="tab-codex" aria-selected="false">The Codex</button>
    </div>
    <div class="pages" id="pages"></div>
  </div>
</div>

<script>
(() => {
  // simple line icons, drawn in currentColor on a 24x24 grid
  const I = (inner, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
  const icons = {
    finger:  I('<path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 16a1.6 1.6 0 0 1 2.4-2.1L9 16"/>'),
    intern:  I('<circle cx="12" cy="7" r="3.5"/><path d="M5 21v-1.5A5.5 5.5 0 0 1 10.5 14h3a5.5 5.5 0 0 1 5.5 5.5V21"/><path d="M12 14l-1.2 3 1.2 2 1.2-2z" fill="currentColor"/>'),
    crew:    I('<rect x="2.5" y="7" width="13" height="10" rx="2"/><path d="M15.5 11l6-3.5v9l-6-3.5"/><circle cx="7" cy="12" r="2"/>'),
    mouse:   I('<rect x="6" y="3" width="12" height="18" rx="6" fill="#f5c400" stroke="#9a7a00"/><path d="M12 3v6M6 10h12" stroke="#9a7a00"/>', ''),
    rally:   I('<path d="M5 21V3"/><path d="M5 4h14v9H5" fill="#fff"/><path d="M5 6h14M5 11h14"/><path d="M12 6.8l1.6 2.7h-3.2zM12 10.2l1.6-2.7h-3.2z" stroke-width="1"/>'),
    network: I('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/><path d="M7 11h6M7 14.5h4"/><circle cx="17" cy="13" r="1.4" fill="currentColor"/>'),
    knesset: I('<path d="M3 21h18M4 18h16M5 18V9M9.5 18V9M14.5 18V9M19 18V9M3 9h18l-9-5.5z"/>'),
  };

  const upgrades = [
    { id: 'finger',  name: 'Stronger Finger',  desc: '+1 per click',     cost: 15,     click: 1 },
    { id: 'intern',  name: 'Campaign Intern',  desc: '+1 per second',    cost: 50,     auto: 1 },
    { id: 'crew',    name: 'Camera Crew',      desc: '+5 per second',    cost: 300,    auto: 5 },
    { id: 'mouse',   name: 'Golden Mouse',     desc: '+10 per click',    cost: 1000,   click: 10 },
    { id: 'rally',   name: 'Flag Rally',       desc: '+40 per second',   cost: 5000,   auto: 40 },
    { id: 'network', name: 'News Network',     desc: '+250 per second',  cost: 40000,  auto: 250 },
    { id: 'knesset', name: 'Knesset Majority', desc: '+1,500 per second', cost: 300000, auto: 1500 },
  ];

  const SAVE_KEY = 'bibi-clicker-save';
  let state = { score: 0, owned: {}, best: 0 };
  const hot = window.claude && window.claude.hot;
  try { Object.assign(state, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
  if (hot && hot.data && hot.data.state) state = hot.data.state;
  if (hot && hot.snapshot) hot.snapshot(() => ({ state }));
  // lifetime stats for the lore; these survive a reset ("the lore remembers")
  state.total = Math.max(state.total || 0, state.score);
  state.zaps = state.zaps || 0; state.crits = state.crits || 0;
  state.clicks = state.clicks || 0; state.seen = state.seen || [];
  state.resets = state.resets || 0;
  const earn = n => { state.score += n; state.total += n; };

  const owned = id => state.owned[id] || 0;
  const priceOf = u => Math.floor(u.cost * Math.pow(1.15, owned(u.id)));
  const perClick = () => 1 + upgrades.reduce((s, u) => s + (u.click || 0) * owned(u.id), 0);
  const perSec = () => upgrades.reduce((s, u) => s + (u.auto || 0) * owned(u.id), 0);
  const fmt = n => Math.floor(n).toLocaleString();

  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), rateEl = $('rate'), stage = $('stage'), face = $('face'), toast = $('toast');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- sound: tiny Web Audio synth, starts on the first click ----
  let ac = null, muted = false;
  try { muted = localStorage.getItem('bibi-muted') === '1'; } catch (e) {}
  const muteBtn = $('mute');
  muteBtn.setAttribute('aria-pressed', muted);
  muteBtn.onclick = () => {
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', muted);
    try { localStorage.setItem('bibi-muted', muted ? '1' : '0'); } catch (e) {}
    if (!muted) sfx.buy();
  };
  function audio() {
    if (muted) return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, start, dur, type = 'sine', vol = .2, slideTo) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    click() { const f = 520 + Math.random() * 140; tone(f, 0, .09, 'triangle', .22, f * 1.8); tone(f / 2, 0, .06, 'sine', .15); },
    crit()  { [660, 880, 1320].forEach((f, i) => tone(f, i * .05, .22, 'square', .07)); tone(1760, .15, .3, 'sine', .12); },
    buy()   { tone(988, 0, .09, 'square', .07); tone(1319, .08, .25, 'square', .07); },
    jackpot() {
      tone(220, 0, .25, 'sawtooth', .08, 880);
      [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, .12 + i * .06, .18, 'square', .06));
      tone(2349, .45, .5, 'sine', .14);
    },
    fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, i === 3 ? .5 : .14, 'triangle', .2)); },
  };

  const buttons = {};
  for (const u of upgrades) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'item';
    b.title = 'Buy it to unlock its entry in the Codex.';
    b.innerHTML = `<span class="icon">${icons[u.id]}</span><span class="label"><span class="name">${u.name}</span><span class="count">0</span><small>${u.desc}</small></span><span class="cost"></span>`;
    b.onclick = () => {
      const p = priceOf(u);
      if (state.score < p) return;
      state.score -= p;
      state.owned[u.id] = owned(u.id) + 1;
      sfx.buy();
      b.classList.remove('bought'); void b.offsetWidth; b.classList.add('bought');
      render();
    };
    $('items').appendChild(b);
    buttons[u.id] = b;
  }

  function render() {
    scoreEl.textContent = fmt(state.score);
    rateEl.textContent = `${fmt(perSec())} per second · ${fmt(perClick())} per click`;
    for (const u of upgrades) {
      const b = buttons[u.id], p = priceOf(u);
      b.disabled = state.score < p;
      b.querySelector('.count').textContent = owned(u.id);
      b.querySelector('.cost').textContent = fmt(p);
    }
    checkMilestone();
    checkLore();
  }

  // milestones: 100, 1k, 10k, ...
  let toastTimer; const toastQueue = [];
  function showToast(msg) {
    toastQueue.push(msg);
    if (toastQueue.length === 1) nextToast();
  }
  function nextToast() {
    if (!toastQueue.length) return;
    toast.textContent = toastQueue[0];
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => { toastQueue.shift(); nextToast(); }, 380);
    }, 1800);
  }
  function checkMilestone() {
    const next = Math.max(100, (state.best || 0) * 10);
    if (state.score >= next) {
      state.best = Math.pow(10, Math.floor(Math.log10(state.score)));
      showToast(`${fmt(state.best)} points!`);
      sfx.fanfare();
      if (!calm) for (let i = 0; i < 6; i++) setTimeout(launchFlag, i * 120);
    }
  }

  function spawn(cls, x, y, html) {
    const el = document.createElement('div');
    el.className = cls; el.style.left = x + 'px'; el.style.top = y + 'px';
    if (html) el.innerHTML = html;
    stage.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
    return el;
  }

  function hit(x, y) {
    const crit = Math.random() < 0.05;
    const gain = perClick() * (crit ? 10 : 1);
    earn(gain);
    state.clicks++;
    if (crit) state.crits++;
    crit ? sfx.crit() : sfx.click();

    face.classList.remove('hit'); void face.offsetWidth; face.classList.add('hit');
    scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');

    if (!calm) {
      spawn('ring', x, y);
      const n = crit ? 12 : 5;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * (crit ? 110 : 60);
        const s = spawn('spark', x, y, '<svg viewBox="0 0 60 60" width="18" height="18"><use href="#star"/></svg>');
        s.style.setProperty('--dx', Math.cos(a) * d + 'px');
        s.style.setProperty('--dy', Math.sin(a) * d + 'px');
        s.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
      }
    }
    const pop = spawn('pop' + (crit ? ' crit' : ''), x, y - 20);
    pop.textContent = (crit ? 'CRIT +' : '+') + fmt(gain);
    render();
  }

  stage.addEventListener('pointerdown', e => {
    const r = stage.getBoundingClientRect();
    hit(e.clientX - r.left, e.clientY - r.top);
  });
  stage.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      hit(stage.clientWidth / 2, stage.clientHeight / 2);
    }
  });

  // reset needs a second click to confirm
  const reset = $('reset'); let armTimer;
  reset.onclick = () => {
    if (!reset.classList.contains('armed')) {
      reset.classList.add('armed'); reset.textContent = 'Click again to reset';
      armTimer = setTimeout(() => { reset.classList.remove('armed'); reset.textContent = 'Reset progress'; }, 3000);
      return;
    }
    clearTimeout(armTimer);
    reset.classList.remove('armed'); reset.textContent = 'Reset progress';
    state = { ...state, score: 0, owned: {}, best: 0, resets: state.resets + 1 };
    render();
  };

  // background flags drifting upward
  const sky = $('sky');
  function launchFlag() {
    const f = document.createElement('div');
    f.className = 'drift';
    f.innerHTML = '<svg class="flag" style="width:100%" viewBox="0 0 220 160"><use href="#il"/></svg>';
    f.style.left = Math.random() * 100 + 'vw';
    f.style.animationDuration = 9 + Math.random() * 8 + 's';
    f.style.setProperty('--spin', (Math.random() * 60 - 30) + 'deg');
    sky.appendChild(f);
    f.addEventListener('animationend', () => f.remove());
  }
  if (!calm) { for (let i = 0; i < 3; i++) setTimeout(launchFlag, i * 900); setInterval(launchFlag, 2600); }


  // =====================================================================
  //  THE LORE. Entirely made up. None of this happened. All of it is canon.
  // =====================================================================
  const pageOpened = Date.now();
  const chronicle = [
    { at: 0, title: 'Prologue: The First Click', text: [
      'In the beginning there was the Void, and the Void had zero points, and it was displayed in a very large font.',
      'Then a single Finger descended from the Cursor Heavens and pressed upon the Face. A small blue ring went out from that place, and the number became 1. The scribes call this the First Click. The Face did a little squash-and-stretch about it, which the scribes found undignified but wrote down anyway.' ] },
    { at: 50, title: 'I. The Age of the Green Screen', text: [
      'Before the flags, before the oval, the Face dwelt within a Rectangle of Unholy Green. It was #00ff3c, which no natural thing has ever been.',
      'For one full version the Face lived there, wreathed in a green glow the elders called "bad keying." Then a voice from beyond the repository spoke four words: "Get rid of the green screen." And it was gotten rid of. Some say if you squint at the white parts of the arena, you can still see a faint green fringe. You cannot. But some say it.' ],
      note: 'Historians date the Green Screen Era to Version 1 and part of Version 2. It is not mentioned in polite company.' },
    { at: 250, title: 'II. The Forging of the Oval', text: [
      'The Order of the Rounded Corner was summoned to build a frame worthy of the Face. They argued for nine days over whether it should be a circle. The Face, being taller than it was wide, refused.',
      'At last they forged the Oval: six pixels of white, then five more of blue, then a soft shadow fourteen pixels deep. These are the Sacred Measurements, and they are written in the stylesheet to this day.' ] },
    { at: 1000, title: 'III. The Prophecy of the Golden Mouse', text: [
      '"When a thousand points have been gathered," said the Oracle of the Tab Bar, "there shall come a Mouse, and it shall be gold, and it shall add exactly ten per click, and its price shall rise by fifteen percent each time, as is right and proper."',
      'Nobody understood the prophecy until the Mouse appeared in the shop, at which point everybody claimed they had understood it all along.' ] },
    { at: 5000, title: 'IV. The Intern Wars', text: [
      'The Campaign Interns rose up in the Year of the Break Room, demanding a second click per second. Negotiations lasted forty days.',
      'The Treaty of the Coffee Machine settled it: each Intern clicks exactly once per second, forever, and in exchange the coffee machine is never fixed. Both sides consider this a victory. The coffee machine has not been consulted.' ] },
    { at: 25000, title: 'V. The Rise of the Yahu-Bots', text: [
      'Deep below the Reset Button lies the Foundry, where the Yahu-Bots are made. Each one is 84 pixels wide, or 66 if it is born on a phone. Each one is built with one goal: to walk from one side of the screen to the other in eight to twelve seconds.',
      'Why do they walk? The bots do not know. The Foundry does not know. When asked, a Yahu-Bot will only blink its red antenna at you, twice per 0.8 seconds, which in Bot means "please click me, I am full of points."' ],
      note: 'A Yahu-Bot that reaches the far side of the screen without being clicked goes to the Bot Lounge. The Bot Lounge does not exist. Do not tell them.' },
    { at: 100000, title: 'VI. The Crit Schism', text: [
      'A great argument split the Clickers in two. The Ninety-Five held that every click is equal. The Five held that one click in twenty is touched by fate and worth ten.',
      'The Five were proven right by the code, which says Math.random() < 0.05, and you cannot argue with the code. The Ninety-Five still meet on Tuesdays to argue with the code anyway.' ] },
    { at: 500000, title: 'VII. The Turning of the Star', text: [
      'Behind the Face, faint and blue, the Great Star turns. It completes one full rotation every thirty seconds. It has never been late. It has never been early. It has never stopped, except for people who have Reduce Motion turned on, for whom it respectfully holds still.',
      'Since you opened this page, the Star has turned __SPINS__ times. It knows you are watching.' ] },
    { at: 2000000, title: 'VIII. The Committee of One Hundred and Twenty', text: [
      'The Knesset has 120 seats, and a majority is 61. So when the first Knesset Majority upgrade was bought, the scholars expected 61 clickers to show up.',
      'Instead 1,500 points per second showed up, unannounced, with no clickers at all. The Committee is still investigating. The investigation itself produces 1,500 points per second, which is making things worse.' ] },
    { at: 10000000, title: 'IX. The Reset Heresy', text: [
      'There is a Button at the bottom of the ledger that undoes everything. The ancients knew it was dangerous, so they enchanted it: the first press only warns you. Only a second press, within three seconds, brings the end.',
      'Those who have pressed it twice are called the Returned. They lose their points, their upgrades and their milestones. But the Book remembers them, and so they keep their lore.' ] },
    { at: 50000000, title: 'X. The Great Flag Migration', text: [
      'Every two point six seconds, a flag rises from beneath the page and drifts upward, never to return. No one has ever seen where they go.',
      'The leading theory is that they are migrating to a warmer browser tab. A second theory says they go to the Bot Lounge. The second theory has been officially rejected, since the Bot Lounge does not exist.' ] },
    { at: 250000000, title: 'XI. The Clicker Who Clicked Too Much', text: [
      'There is a legend of a Clicker who clicked so much that the number grew wider than the screen. The Order of the Rounded Corner gathered in a panic. They had not measured for this.',
      'They are still not sure what happens. Perhaps you will find out.' ] },
    { at: 1000000000, title: 'Epilogue: The Last Click', text: [
      'You have gathered a billion points. The scribes have run out of chapters. The Interns have run out of coffee. The Star keeps turning.',
      'There is no Last Click. There is only the next one. The Face is waiting. It has always been waiting. Go on.' ] },
  ];

  const codex = [
    { id: 'face', title: 'The Face', when: () => true, how: '', text: [
      'Cut from a photograph 192 pixels wide, then enlarged four times by the ancient LANCZOS method until it was 272 pixels wide. It is stored inside the page itself, so it can never be lost again.',
      'It has been clicked __CLICKS__ times on this device.' ] },
    { id: 'finger', title: 'Stronger Finger', when: () => owned('finger') > 0, how: 'Buy a Stronger Finger.', text: [
      'Trained for forty days on a stress ball. Index finger only. The thumb applied and was not chosen, and has been bitter about it ever since.' ] },
    { id: 'intern', title: 'Campaign Intern', when: () => owned('intern') > 0, how: 'Hire a Campaign Intern.', text: [
      'Clicks exactly once per second, as agreed in the Treaty of the Coffee Machine (see Chronicle IV). Paid in experience, lanyards, and a reusable water bottle with the logo slightly off-center.' ] },
    { id: 'crew', title: 'Camera Crew', when: () => owned('crew') > 0, how: 'Hire a Camera Crew.', text: [
      'Five people, one camera, no tripod. They were responsible for the Green Screen Era (see Chronicle I) and still insist it was "a creative choice."' ] },
    { id: 'mouse', title: 'Golden Mouse', when: () => owned('mouse') > 0, how: 'Fulfil the prophecy.', text: [
      'Foretold in Chronicle III. Weighs four kilograms. The scroll wheel is purely ceremonial. Polished nightly by an Intern who is technically on a break.' ] },
    { id: 'rally', title: 'Flag Rally', when: () => owned('rally') > 0, how: 'Hold a Flag Rally.', text: [
      'Every flag drifting up the background was once carried at a Flag Rally. They are now migrating (see Chronicle X). Each rally is louder than the last, which is why it earns 40 per second.' ] },
    { id: 'network', title: 'News Network', when: () => owned('network') > 0, how: 'Launch a News Network.', text: [
      'Broadcasts the score live, all day, every day. Its ratings jump whenever a Yahu-Bot walks past. Its weather segment is just the Star turning (see Chronicle VII).' ] },
    { id: 'knesset', title: 'Knesset Majority', when: () => owned('knesset') > 0, how: 'Secure a Knesset Majority.', text: [
      'Produces 1,500 points per second through methods the Committee of One Hundred and Twenty is still investigating (see Chronicle VIII).' ] },
    { id: 'bot', title: 'Yahu-Bot, Model YB-1', when: () => state.zaps > 0, how: 'Click a Yahu-Bot.', text: [
      'Powered by one AA battery and pure ambition. Worth at least 100 points, or far more for a well-upgraded Clicker. The red antenna is not a camera. It is definitely not a camera.',
      'You have zapped __ZAPS__ of them. They hold no grudges, because they do not remember anything.' ] },
    { id: 'crit', title: 'The Golden Click', when: () => state.crits > 0, how: 'Land a critical click.', text: [
      'One click in twenty is worth ten. The sacred chime plays three notes, then a fourth, higher one, as foretold by the Five (see Chronicle VI).',
      'You have landed __CRITS__ Golden Clicks.' ] },
    { id: 'returned', title: 'The Returned', when: () => state.resets > 0, how: 'Do the forbidden thing. Twice.', text: [
      'You pressed the Button. Twice. You came back. The Book remembers you, and has noted it here, slightly judgmentally.',
      'Times returned: __RESETS__.' ] },
  ];

  const whispers = [
    'The Face has been waiting for you.',
    'The Star behind the Face turns once every 30 seconds. It has never been late.',
    'The Bot Lounge does not exist.',
    'The thumb is still bitter about not being chosen.',
    'Some say a faint green fringe remains. It does not. But some say it.',
    'The coffee machine has still not been fixed.',
    'Every flag that drifts away is going somewhere. Nobody knows where.',
    'One click in twenty is touched by fate.',
    'The red antenna is definitely not a camera.',
    'The Order of the Rounded Corner did not plan for numbers this big.',
    'The Golden Mouse weighs four kilograms. Lift with your legs.',
    'The Ninety-Five are meeting again on Tuesday.',
    'The Book remembers everything. Even the resets.',
  ];

  const loreEl = $('lore'), pagesEl = $('pages'), loreBtn = $('lorebtn');
  let loreTab = 'chron';
  const fill = t => t
    .replace('__SPINS__', fmt((Date.now() - pageOpened) / 30000))
    .replace('__CLICKS__', fmt(state.clicks)).replace('__ZAPS__', fmt(state.zaps))
    .replace('__CRITS__', fmt(state.crits)).replace('__RESETS__', fmt(state.resets));
  const unlocked = () => [
    ...chronicle.filter(c => state.total >= c.at).map(c => 'c' + c.at),
    ...codex.filter(c => c.when()).map(c => 'x' + c.id),
  ];
  let fresh = new Set();

  function checkLore() {
    const now = unlocked();
    const added = now.filter(k => !state.seen.includes(k));
    if (!added.length) return;
    // the first visit unlocks the starting pages quietly
    const quiet = state.seen.length === 0;
    state.seen.push(...added);
    if (quiet) return;
    for (const k of added) {
      fresh.add(k);
      const entry = k[0] === 'c' ? chronicle.find(c => 'c' + c.at === k) : codex.find(c => 'x' + c.id === k);
      showToast(`New lore: ${entry.title}`);
    }
    loreBtn.classList.add('new');
  }

  function renderLore() {
    const isChron = loreTab === 'chron';
    $('tab-chron').setAttribute('aria-selected', isChron);
    $('tab-codex').setAttribute('aria-selected', !isChron);
    const nC = chronicle.filter(c => state.total >= c.at).length;
    const nX = codex.filter(c => c.when()).length;
    $('loremeta').textContent = `${nC} of ${chronicle.length} chapters · ${nX} of ${codex.length} codex entries · ${fmt(state.total)} lifetime points`;
    const p = t => `<p>${fill(t)}</p>`;
    let html = '';
    if (isChron) {
      for (const c of chronicle) {
        const k = 'c' + c.at;
        if (state.total >= c.at) {
          html += `<article class="entry${fresh.has(k) ? ' fresh' : ''}"><h3>${c.title}</h3>${c.text.map(p).join('')}${c.note ? `<p class="note">${c.note}</p>` : ''}</article>`;
        } else {
          const pct = Math.min(100, state.total / c.at * 100);
          html += `<article class="entry locked"><h3>? ? ? ? ?</h3><p>Earn ${fmt(c.at)} lifetime points to unlock this chapter.</p><div class="bar"><i style="width:${pct}%"></i></div></article>`;
        }
      }
    } else {
      for (const c of codex) {
        const k = 'x' + c.id;
        html += c.when()
          ? `<article class="entry${fresh.has(k) ? ' fresh' : ''}"><h3>${c.title}</h3>${c.text.map(p).join('')}</article>`
          : `<article class="entry locked"><h3>? ? ? ? ?</h3><p>${c.how}</p></article>`;
      }
    }
    pagesEl.innerHTML = html;
  }

  let lastFocus = null;
  function openLore() {
    lastFocus = document.activeElement;
    loreEl.hidden = false;
    loreBtn.classList.remove('new');
    renderLore();
    fresh = new Set();
    pagesEl.scrollTop = 0;
    $('loreclose').focus();
    sfx.buy();
  }
  function closeLore() {
    loreEl.hidden = true;
    if (lastFocus) lastFocus.focus();
  }
  loreBtn.onclick = openLore;
  $('loreclose').onclick = closeLore;
  loreEl.addEventListener('pointerdown', e => { if (e.target === loreEl) closeLore(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !loreEl.hidden) closeLore(); });
  $('tab-chron').onclick = () => { loreTab = 'chron'; renderLore(); };
  $('tab-codex').onclick = () => { loreTab = 'codex'; renderLore(); };

  // the whisper line under the score
  const whisperEl = $('whisper');
  whisperEl.onclick = openLore;
  whisperEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLore(); } });
  let wi = Math.floor(Math.random() * whispers.length);
  function whisper() {
    whisperEl.classList.add('fade');
    setTimeout(() => {
      wi = (wi + 1) % whispers.length;
      whisperEl.textContent = '“' + whispers[wi] + '”';
      whisperEl.classList.remove('fade');
    }, calm ? 0 : 400);
  }
  whisperEl.textContent = '“' + whispers[wi] + '”';
  setInterval(whisper, 9000);

  // ---- Yahu-Bots ----
  const botLayer = $('bots');
  const botBody = `<svg class="body" viewBox="0 0 84 74" aria-hidden="true">
      <g class="arm a"><rect x="4" y="6" width="9" height="28" rx="4.5" fill="#00267d"/><circle cx="8.5" cy="36" r="5.5" fill="#dfe8ff" stroke="#00267d" stroke-width="2"/></g>
      <g class="arm b"><rect x="71" y="6" width="9" height="28" rx="4.5" fill="#00267d"/><circle cx="75.5" cy="36" r="5.5" fill="#dfe8ff" stroke="#00267d" stroke-width="2"/></g>
      <g class="leg a"><rect x="24" y="42" width="11" height="24" rx="4" fill="#00267d"/><rect x="20" y="62" width="19" height="9" rx="4" fill="#0038b8"/></g>
      <g class="leg b"><rect x="49" y="42" width="11" height="24" rx="4" fill="#00267d"/><rect x="45" y="62" width="19" height="9" rx="4" fill="#0038b8"/></g>
      <rect x="14" y="0" width="56" height="48" rx="10" fill="#fff" stroke="#0038b8" stroke-width="4"/>
      <rect x="14" y="7" width="56" height="6" fill="#0038b8"/>
      <rect x="14" y="35" width="56" height="6" fill="#0038b8"/>
      <g fill="none" stroke="#0038b8" stroke-width="2.2" stroke-linejoin="round" transform="translate(32 14) scale(.34)">
        <polygon points="30,4 53,44 7,44"/><polygon points="30,56 53,16 7,16"/>
      </g>
    </svg>`;
  const bots = new Set();

  function botReward() {
    const base = Math.max(100, perSec() * 25 + perClick() * 30);
    return Math.round(base * (1 + Math.random() * .5));
  }

  function spawnBot() {
    if (document.hidden || bots.size >= 2) return;
    const W = innerWidth, H = innerHeight;
    const goLeft = Math.random() < .5;
    const el = document.createElement('div');
    el.className = 'bot' + (goLeft ? ' left' : '');
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Yahu-Bot: click for bonus points');
    el.innerHTML = `<div class="rig"><span class="tag">Yahu-Bot</span><div style="position:relative"><span class="antenna"></span><img class="head" alt="" src="${face.src}"></div>${botBody}</div>`;
    botLayer.appendChild(el);

    const w = el.offsetWidth;
    const bot = {
      el,
      x: goLeft ? W + 10 : -w - 10,
      y: H * (.22 + Math.random() * .58),
      vx: (goLeft ? -1 : 1) * W / (8 + Math.random() * 4), // crosses in 8-12s
      t: Math.random() * 6,
      done: false,
    };
    bots.add(bot);
    place(bot);

    const zap = e => {
      if (bot.done) return;
      e.preventDefault();
      bot.done = true;
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 3;
      const gain = botReward();
      earn(gain);
      state.zaps++;
      sfx.jackpot();
      el.classList.add('zapped');
      el.addEventListener('animationend', () => { el.remove(); bots.delete(bot); });
      if (calm) setTimeout(() => { el.remove(); bots.delete(bot); }, 50);

      const pop = document.createElement('div');
      pop.className = 'bigpop';
      pop.textContent = '+' + fmt(gain);
      pop.style.left = cx + 'px'; pop.style.top = cy + 'px';
      document.body.appendChild(pop);
      pop.addEventListener('animationend', () => pop.remove());
      if (calm) setTimeout(() => pop.remove(), 1200);

      if (!calm) for (let i = 0; i < 16; i++) {
        const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
        const sp = document.createElement('div');
        sp.className = 'spark fxspark';
        sp.style.left = cx + 'px'; sp.style.top = cy + 'px';
        sp.innerHTML = '<svg viewBox="0 0 60 60" width="18" height="18"><use href="#star"/></svg>';
        sp.style.setProperty('--dx', Math.cos(a) * d + 'px');
        sp.style.setProperty('--dy', Math.sin(a) * d + 'px');
        sp.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        document.body.appendChild(sp);
        sp.addEventListener('animationend', () => sp.remove());
      }
      showToast(`Yahu-Bot zapped! +${fmt(gain)}`);
      render();
    };
    el.addEventListener('pointerdown', zap);
    el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') zap(e); });
  }

  function place(b) {
    const hop = Math.abs(Math.sin(b.t * 7)) * 4;
    b.el.style.transform = `translate(${b.x}px, ${b.y - hop}px)`;
  }

  let last = performance.now();
  function walk(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const b of bots) {
      if (b.done) continue;
      b.x += b.vx * dt; b.t += dt;
      // gentle wander up and down, kept on screen
      b.y = Math.min(innerHeight - 140, Math.max(60, b.y + Math.sin(b.t * 1.3) * 12 * dt));
      place(b);
      if ((b.vx < 0 && b.x < -140) || (b.vx > 0 && b.x > innerWidth + 40)) {
        b.el.remove(); bots.delete(b);
      }
    }
    requestAnimationFrame(walk);
  }
  requestAnimationFrame(walk);

  function scheduleBot(first) {
    setTimeout(() => { spawnBot(); scheduleBot(); }, first ? 6000 : 15000 + Math.random() * 20000);
  }
  scheduleBot(true);
  window.spawnYahuBot = spawnBot; // handy for testing from the console

  setInterval(() => { if (perSec()) { earn(perSec() / 10); render(); } }, 100);
  setInterval(() => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }, 2000);

  render();
})();
</script>
