<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Snake</title>
<style>
  :root {
    --bg: #0f0f1a;
    --panel: #1a1a2e;
    --text: #e0e0e0;
    --accent: #7bd88f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    touch-action: none;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: 4px; color: var(--accent); }
  #hud {
    display: flex;
    justify-content: space-between;
    width: min(480px, 100%);
    font-size: 18px;
  }
  canvas {
    width: min(480px, 100%);
    aspect-ratio: 1;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid var(--panel);
    background: var(--panel);
  }
  #help { font-size: 14px; opacity: 0.7; text-align: center; }
</style>
</head>
<body>
<h1>PIXEL SNAKE</h1>
<div id="hud">
  <span>SCORE <b id="score">0</b></span>
  <span>BEST <b id="best">0</b></span>
</div>
<canvas id="game" width="160" height="160"></canvas>
<div id="help">Arrows / WASD to move &middot; Space to pause &middot; Swipe on mobile</div>

<script>
// The canvas is drawn at a low resolution and scaled up with CSS,
// which gives the chunky pixel look.
const GRID = 20;          // cells per side
const CELL = 8;           // canvas pixels per cell
const START_SPEED = 140;  // ms per step
const MIN_SPEED = 60;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

const COLORS = {
  floor: "#1a1a2e",
  floorAlt: "#1f1f36",
  head: "#b8f5c4",
  body: "#7bd88f",
  bodyDark: "#4fa865",
  food: "#ff6b6b",
  foodShine: "#ffd1d1",
  text: "#e0e0e0",
};

let snake, dir, nextDir, food, score, speed, state, timer;
let best = loadBest();
bestEl.textContent = best;

function loadBest() {
  try { return Number(localStorage.getItem("snakeBest")) || 0; } catch { return 0; }
}
function saveBest(value) {
  try { localStorage.setItem("snakeBest", value); } catch {}
}

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  speed = START_SPEED;
  scoreEl.textContent = score;
  placeFood();
  state = "ready";
  draw();
}

function placeFood() {
  do {
    food = { x: rand(GRID), y: rand(GRID) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function rand(n) { return Math.floor(Math.random() * n); }

function start() {
  state = "playing";
  loop();
}

function loop() {
  clearTimeout(timer);
  if (state !== "playing") return;
  step();
  draw();
  timer = setTimeout(loop, speed);
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
  // The tail moves out of the way this step unless we eat, so ignore it.
  const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) {
    gameOver();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    speed = Math.max(MIN_SPEED, speed - 4);
    placeFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  state = "over";
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    saveBest(best);
  }
}

function setDir(x, y) {
  // Can't reverse straight into yourself.
  if (dir.x === -x && dir.y === -y) return;
  nextDir = { x, y };
  if (state === "ready") start();
}

function togglePause() {
  if (state === "playing") { state = "paused"; draw(); }
  else if (state === "paused") start();
}

// ---------- drawing ----------

function draw() {
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      ctx.fillStyle = (x + y) % 2 ? COLORS.floorAlt : COLORS.floor;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }

  // food: a little pixel apple
  const fx = food.x * CELL, fy = food.y * CELL;
  ctx.fillStyle = COLORS.food;
  ctx.fillRect(fx + 1, fy + 2, 6, 5);
  ctx.fillRect(fx + 2, fy + 1, 4, 7);
  ctx.fillStyle = COLORS.foodShine;
  ctx.fillRect(fx + 2, fy + 3, 1, 1);
  ctx.fillStyle = COLORS.bodyDark;
  ctx.fillRect(fx + 4, fy, 1, 2);

  snake.forEach((s, i) => {
    const px = s.x * CELL, py = s.y * CELL;
    ctx.fillStyle = i === 0 ? COLORS.head : COLORS.body;
    ctx.fillRect(px, py, CELL, CELL);
    ctx.fillStyle = COLORS.bodyDark;
    ctx.fillRect(px, py + CELL - 1, CELL, 1);
    ctx.fillRect(px + CELL - 1, py, 1, CELL);
  });
  drawEyes();

  if (state === "ready") banner("PRESS AN ARROW", "TO START");
  if (state === "paused") banner("PAUSED", "SPACE TO RESUME");
  if (state === "over") banner("GAME OVER", "ENTER TO RETRY");
}

function drawEyes() {
  const h = snake[0];
  const px = h.x * CELL, py = h.y * CELL;
  ctx.fillStyle = "#000";
  if (dir.x !== 0) {
    const ex = px + (dir.x > 0 ? 5 : 2);
    ctx.fillRect(ex, py + 2, 1, 1);
    ctx.fillRect(ex, py + 5, 1, 1);
  } else {
    const ey = py + (dir.y > 0 ? 5 : 2);
    ctx.fillRect(px + 2, ey, 1, 1);
    ctx.fillRect(px + 5, ey, 1, 1);
  }
}

function banner(line1, line2) {
  ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
  ctx.fillRect(0, 60, canvas.width, 40);
  ctx.fillStyle = COLORS.text;
  ctx.textAlign = "center";
  ctx.font = "bold 12px monospace";
  ctx.fillText(line1, canvas.width / 2, 77);
  ctx.font = "8px monospace";
  ctx.fillText(line2, canvas.width / 2, 92);
}

// ---------- input ----------

const KEYS = {
  ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
  ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
  ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
  ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
};

document.addEventListener("keydown", e => {
  if (KEYS[e.key]) {
    e.preventDefault();
    if (state === "over") return;
    setDir(...KEYS[e.key]);
  } else if (e.key === " ") {
    e.preventDefault();
    togglePause();
  } else if (e.key === "Enter" && state === "over") {
    reset();
  }
});

let touchStart = null;
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  if (state === "over") reset();
}, { passive: true });
canvas.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
  else setDir(0, Math.sign(dy));
});

reset();
</script>
</body>
</html>
