<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sky Courier</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background: #000;
    }
    #touch {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      padding: 0 12px;
      justify-content: space-between;
      pointer-events: none;
    }
    body.touch #touch { display: flex; }
    #touch .pad { display: flex; gap: 8px; }
    #touch button {
      pointer-events: auto;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font: bold 16px monospace;
      touch-action: none;
    }
    #touch button.active { background: rgba(255, 255, 255, 0.35); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch">
    <div class="pad">
      <button data-act="left">&#9664;</button>
      <button data-act="right">&#9654;</button>
    </div>
    <div class="pad">
      <button data-act="ability">B</button>
      <button data-act="brake">BRK</button>
      <button data-act="gas">GAS</button>
    </div>
  </div>
  <script>
// Sky Courier — a pixelated top-down canyon run: grab packages, drop them at
// the delivery pads, and dodge the missiles.
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Constants
  // ---------------------------------------------------------------------------
  const W = 128, H = 192;
  const JET_W = 12, JET_H = 14, JET_Y = 146;
  const CRUISE = 90, MIN_SPEED = 60, MAX_SPEED = 170, FAST_SPEED = 145;
  const KTS = 1.2; // px/s -> displayed knots
  const START_GAP = 86, MIN_GAP = 44;
  const TILE_H = 192;
  const MAX_HP = 3, MAX_CARGO = 5;
  const ROLL_TIME = 0.5, ROLL_CD = 3;
  const NEAR_MISS = 7;
  const LEVEL_DIST = 3000;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------------------------------------------------------------------------
  // Canvas
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('game');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function resize() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    const scale = s >= 1 ? Math.floor(s) : s;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
  }
  addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------------------
  // Storage (best score survives reloads when the browser allows it)
  // ---------------------------------------------------------------------------
  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem('skyCourier.' + key);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem('skyCourier.' + key, JSON.stringify(value));
      } catch (e) { /* storage unavailable */ }
    },
  };

  // ---------------------------------------------------------------------------
  // Pixel font (3x5)
  // ---------------------------------------------------------------------------
  const FONT = {
    A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
    E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
    I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
    M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
    Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
    Y: '101101010010010', Z: '111001010100111',
    0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
    4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010',
    8: '111101111101111', 9: '111101111001110',
    '!': '010010010000010', '.': '000000000000010', ':': '000010000010000', '-': '000000111000000',
    '+': '000010111010000', '/': '001001010100100', "'": '010010000000000', '?': '110001010000010',
    '<': '001010100010001', '>': '100010001010100', '=': '000111000111000',
  };

  const textWidth = (str, scale = 1) => (str.length ? str.length * 4 * scale - scale : 0);

  function drawTextRaw(str, x, y, color, scale) {
    ctx.fillStyle = color;
    for (let i = 0; i < str.length; i++) {
      const glyph = FONT[str[i]];
      if (!glyph) continue;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (glyph[r * 3 + c] === '1') {
            ctx.fillRect(x + i * 4 * scale + c * scale, y + r * scale, scale, scale);
          }
        }
      }
    }
  }

  function drawText(str, x, y, color = '#fff', scale = 1, align = 'left', shadow = '#000') {
    str = String(str).toUpperCase();
    const w = textWidth(str, scale);
    if (align === 'center') x -= Math.floor(w / 2);
    else if (align === 'right') x -= w;
    x = Math.round(x);
    y = Math.round(y);
    if (shadow) drawTextRaw(str, x + 1, y + 1, shadow, scale);
    drawTextRaw(str, x, y, color, scale);
  }

  // ---------------------------------------------------------------------------
  // Sprites
  // ---------------------------------------------------------------------------
  // B body, S body shade, H highlight, O stripe, w canopy, g glint, k outline.
  const JET = [
    '.....kk.....',
    '....kHHk....',
    '....kwwk....',
    '....kwgk....',
    '...kBOOBk...',
    '..kSBOOBSk..',
    '.kSBBOOBBSk.',
    'kSBBBOOBBBSk',
    'kBBBBOOBBBBk',
    '.kkkSOOSkkk.',
    '....kBBk....',
    '...kSBBSk...',
    '..kSSkkSSk..',
    '..kk....kk..',
  ];
  const JET_PAL = {
    B: '#f2f2f2', S: '#9a9aae', H: '#ffffff', O: '#ff9d3d',
    w: '#1c2541', g: '#7f9fdf', k: '#121218',
  };
  const JET_WRECK_PAL = {
    B: '#4a4a52', S: '#2a2a30', H: '#5a5a62', O: '#5a3a1a',
    w: '#111111', g: '#333333', k: '#0a0a0c',
  };

  // Package hanging from a balloon.
  const CRATE = [
    '.rrr.',
    'rRrrr',
    'rrrrr',
    '.rrr.',
    '..k..',
    '..k..',
    'kkkkk',
    'kDdDk',
    'kdDdk',
    'kDdDk',
    'kkkkk',
  ];
  const CRATE_PAL = { r: '#d82828', R: '#ff8080', k: '#3a2410', D: '#c88a3a', d: '#9a6428' };

  // Missile turret on the rim of the canyon.
  const TURRET = [
    '..kkk..',
    '.kqqqk.',
    'kqrqrqk',
    'kqqqqqk',
    'kqqqqqk',
    '.kqqqk.',
    '..kkk..',
  ];
  const TURRET_PAL = { k: '#16161a', q: '#5a5a62', r: '#d01818' };

  const CLOUD = [
    '....wwww......',
    '..wwwwwwww....',
    '.wwwwwwwwwww..',
    'wwwwwwwwwwwwww',
    '.wwwwwwwwwwww.',
    '...wwwwwwww...',
  ];

  function buildSprite(map, pal) {
    const c = document.createElement('canvas');
    c.width = map[0].length;
    c.height = map.length;
    const g = c.getContext('2d');
    for (let y = 0; y < map.length; y++) {
      for (let x = 0; x < map[y].length; x++) {
        const col = pal[map[y][x]];
        if (col) {
          g.fillStyle = col;
          g.fillRect(x, y, 1, 1);
        }
      }
    }
    return c;
  }

  const jetSprite = buildSprite(JET, JET_PAL);
  const jetWreckSprite = buildSprite(JET, JET_WRECK_PAL);
  const jetUnderSprite = buildSprite(JET, { ...JET_PAL, B: '#b8b8c8', H: '#c8c8d8', w: '#9a9aae', g: '#9a9aae' });
  const crateSprite = buildSprite(CRATE, CRATE_PAL);
  const turretSprite = buildSprite(TURRET, TURRET_PAL);
  const cloudSprite = buildSprite(CLOUD, { w: '#ffffff' });

  // Mesa tops on either side of the canyon: sandstone strata with speckles.
  const rockTile = (() => {
    const c = document.createElement('canvas');
    c.width = W;
    c.height = TILE_H;
    const g = c.getContext('2d');
    for (let y = 0; y < TILE_H; y++) {
      g.fillStyle = Math.floor(y / 16) % 2 ? '#a8693e' : '#9e6239';
      g.fillRect(0, y, W, 1);
    }
    for (let i = 0; i < 900; i++) {
      g.fillStyle = pick(['#8a5030', '#b87a4a', '#c88a5a', '#7a4428']);
      g.fillRect(randInt(0, W - 1), randInt(0, TILE_H - 1), 1, 1);
    }
    for (let i = 0; i < 26; i++) {
      // Scrubby bushes on the mesas.
      const x = randInt(1, W - 3), y = randInt(1, TILE_H - 3);
      g.fillStyle = '#5a6a2a';
      g.fillRect(x, y, 2, 2);
      g.fillStyle = '#7a8a3a';
      g.fillRect(x, y, 1, 1);
    }
    return c;
  })();

  // Canyon floor far below: dusty ground with a winding river.
  const floorTile = (() => {
    const c = document.createElement('canvas');
    c.width = W;
    c.height = TILE_H;
    const g = c.getContext('2d');
    g.fillStyle = '#5a3c28';
    g.fillRect(0, 0, W, TILE_H);
    for (let i = 0; i < 700; i++) {
      g.fillStyle = pick(['#4e3422', '#664430', '#6e4a34']);
      g.fillRect(randInt(0, W - 1), randInt(0, TILE_H - 1), 1, 1);
    }
    for (let y = 0; y < TILE_H; y++) {
      // One full wiggle per tile so it loops seamlessly.
      const cx = W / 2 + Math.sin((y / TILE_H) * Math.PI * 2) * 22 + Math.sin((y / TILE_H) * Math.PI * 6) * 5;
      g.fillStyle = '#2f5f8a';
      g.fillRect(Math.round(cx - 5), y, 10, 1);
      g.fillStyle = '#4a86b8';
      g.fillRect(Math.round(cx - 2 + Math.sin(y * 0.4)), y, 2, 1);
      g.fillStyle = '#3e5a2a';
      g.fillRect(Math.round(cx - 7), y, 2, 1);
      g.fillRect(Math.round(cx + 5), y, 2, 1);
    }
    return c;
  })();

  // ---------------------------------------------------------------------------
  // Audio (tiny WebAudio synth; created on first input)
  // ---------------------------------------------------------------------------
  const sfx = {
    ctx: null,
    master: null,
    engine: null,
    engineGain: null,
    muted: store.get('muted', false),

    init() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return;
      }
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) {
        this.ctx = null;
      }
    },

    setMuted(m) {
      this.muted = m;
      store.set('muted', m);
      if (this.master) this.master.gain.value = m ? 0 : 0.5;
    },

    tone(freq, dur, type = 'square', vol = 0.12, slideTo = null, delay = 0) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g);
      g.connect(this.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },

    noise(dur, vol = 0.4) {
      if (!this.ctx) return;
      const n = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 1200;
      const g = this.ctx.createGain();
      g.gain.value = vol;
      src.connect(f);
      f.connect(g);
      g.connect(this.master);
      src.start();
    },

    engineOn() {
      if (!this.ctx || this.engine) return;
      const o = this.ctx.createOscillator();
      const f = this.ctx.createBiquadFilter();
      const g = this.ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.value = 90;
      f.type = 'lowpass';
      f.frequency.value = 700;
      g.gain.value = 0.04;
      o.connect(f);
      f.connect(g);
      g.connect(this.master);
      o.start();
      this.engine = o;
      this.engineGain = g;
    },

    engineSet(speed) {
      if (this.engine) this.engine.frequency.setTargetAtTime(60 + speed * 0.5, this.ctx.currentTime, 0.05);
    },

    engineOff() {
      if (!this.engine) return;
      const t = this.ctx.currentTime;
      this.engineGain.gain.setTargetAtTime(0, t, 0.05);
      this.engine.stop(t + 0.3);
      this.engine = null;
      this.engineGain = null;
    },

    blip() { this.tone(660, 0.08, 'square', 0.08); },
    pickup() {
      this.tone(784, 0.07, 'square', 0.08);
      this.tone(1046, 0.1, 'square', 0.08, null, 0.06);
    },
    deliver() {
      [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.15, 'square', 0.08, null, i * 0.08));
    },
    nearMiss(combo) {
      const base = 520 + Math.min(combo, 8) * 60;
      this.tone(base, 0.07, 'square', 0.09);
      this.tone(base * 1.5, 0.1, 'square', 0.09, null, 0.06);
    },
    warn() { this.tone(1200, 0.06, 'square', 0.05); this.tone(1200, 0.06, 'square', 0.05, null, 0.12); },
    launch() { this.noise(0.25, 0.15); this.tone(300, 0.3, 'sawtooth', 0.05, 900); },
    boom() { this.noise(0.35, 0.35); this.tone(120, 0.3, 'square', 0.08, 40); },
    roll() { this.tone(300, 0.3, 'triangle', 0.08, 900); },
    hurt() { this.noise(0.2, 0.4); this.tone(300, 0.2, 'sawtooth', 0.1, 80); },
    crash() {
      this.noise(0.9, 0.6);
      this.tone(140, 0.6, 'sawtooth', 0.2, 35);
    },
  };

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  const keys = new Set();
  const pressed = new Set();
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'gas', KeyW: 'gas',
    ArrowDown: 'brake', KeyS: 'brake',
    Enter: 'start', Space: 'start',
    KeyP: 'pause', Escape: 'pause',
    KeyM: 'mute',
    KeyB: 'ability',
  };

  function actDown(a) {
    if (!keys.has(a)) pressed.add(a);
    keys.add(a);
  }
  function actUp(a) { keys.delete(a); }

  addEventListener('keydown', (e) => {
    const a = KEYMAP[e.code];
    if (!a) return;
    e.preventDefault();
    sfx.init();
    actDown(a);
  });
  addEventListener('keyup', (e) => {
    const a = KEYMAP[e.code];
    if (a) actUp(a);
  });

  function autoPause() {
    keys.clear();
    if (state === 'play') {
      state = 'paused';
      sfx.engineOff();
    }
  }
  addEventListener('blur', autoPause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

  const isTouch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (isTouch) document.body.classList.add('touch');

  for (const btn of document.querySelectorAll('#touch button')) {
    const act = btn.dataset.act;
    const release = () => { btn.classList.remove('active'); actUp(act); };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      sfx.init();
      btn.classList.add('active');
      actDown(act);
    });
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.init();
    if (state !== 'play') pressed.add('start');
  });

  // ---------------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------------
  let state = 'title';
  let best = store.get('best', 0);

  let jet, missiles, warnings, turrets, crates, pads, clouds, particles, popups, banners;
  let score, dist, level, combo, comboTimer, shake, crashTimer, overTimer;
  let hp, hurtTimer, cargo, rollTime, rollCd, rollDir;
  let delivered, nearMisses, crashCause, isNewBest;
  let nextCrate, nextPad, nextTurret, cruiseTimer, padTipShown;
  let floorScroll = 0, rockScroll = 0, time = 0;

  // The canyon is a list of gap samples, one per world pixel of distance
  // (distance grows as you fly up the screen).
  let canyon, canyonBase, cc, ccv, cgap;

  function reset() {
    jet = { x: W / 2 - JET_W / 2, vx: 0, speed: CRUISE };
    missiles = [];
    warnings = [];
    turrets = [];
    crates = [];
    pads = [];
    clouds = [];
    particles = [];
    popups = [];
    banners = [];
    score = 0;
    dist = 0;
    level = 1;
    combo = 0;
    comboTimer = 0;
    shake = 0;
    crashTimer = 0;
    overTimer = 0;
    hp = MAX_HP;
    hurtTimer = 0;
    cargo = 0;
    rollTime = 0;
    rollCd = 0;
    rollDir = 1;
    delivered = 0;
    nearMisses = 0;
    crashCause = 'wall';
    isNewBest = false;
    nextCrate = 160;
    nextPad = 900;
    nextTurret = 500;
    cruiseTimer = 7;
    padTipShown = false;
    canyon = [];
    canyonBase = 0;
    cc = W / 2;
    ccv = 0;
    cgap = START_GAP;
    genCanyon(H * 2);
  }

  function startGame() {
    reset();
    state = 'play';
    sfx.engineOn();
    popup('GRAB THE PACKAGES!', W / 2, 80, '#ffd34d', 1.6);
  }

  // Messages stay out of the flying view. Announcements (no points, centred)
  // queue up in a slim banner under the top bar; everything else (points and
  // callouts about your jet) goes to a short feed in the bottom-right corner.
  function popup(text, x, y, color = '#fff', life = 1) {
    if (/\+\d/.test(text) || x !== W / 2) {
      popups.push({ text, color, life: Math.max(life, 1.2), max: Math.max(life, 1.2) });
      if (popups.length > 3) popups.shift();
    } else if (!banners.some((b) => b.text === text)) {
      banners.push({ text, color, life: Math.min(life, 1.6) });
    }
  }

  function particle(x, y, vx, vy, life, color, size = 1, ground = false) {
    particles.push({ x, y, vx, vy, life, max: life, color, size, ground });
  }

  function explode(x, y, n, colors = ['#fff3a0', '#ffb000', '#ff6a00', '#d02000', '#555555']) {
    for (let i = 0; i < n; i++) {
      particle(x, y, rand(-60, 60), rand(-60, 60), rand(0.3, 0.9), pick(colors), randInt(1, 2));
    }
  }

  // ---------------------------------------------------------------------------
  // Canyon
  // ---------------------------------------------------------------------------
  function genCanyon(upto) {
    while (canyonBase + canyon.length <= upto) {
      const i = canyonBase + canyon.length;
      const target = Math.max(MIN_GAP, START_GAP - (level - 1) * 6) + Math.sin(i * 0.004) * 8;
      cgap += (target - cgap) * 0.01;
      // The canyon meanders; the first stretch stays straight so you can settle in.
      if (i > 250) ccv = clamp(ccv + rand(-0.012, 0.012), -0.35, 0.35);
      cc += ccv;
      const minC = 4 + cgap / 2, maxC = W - 4 - cgap / 2;
      if (cc < minC) { cc = minC; ccv = Math.abs(ccv) * 0.5; }
      if (cc > maxC) { cc = maxC; ccv = -Math.abs(ccv) * 0.5; }
      canyon.push({ l: cc - cgap / 2, r: cc + cgap / 2 });
    }
    const drop = Math.floor(dist) - 80 - canyonBase;
    if (drop > 0) {
      canyon.splice(0, drop);
      canyonBase += drop;
    }
  }

  // World distance of the thing at screen row y.
  const rowDist = (y) => dist + (JET_Y - y);
  function gapAt(y) {
    const i = clamp(Math.round(rowDist(y)) - canyonBase, 0, canyon.length - 1);
    return canyon[i];
  }

  // ---------------------------------------------------------------------------
  // Spawning
  // ---------------------------------------------------------------------------
  function spawnStuff() {
    if (dist >= nextCrate) {
      const g = gapAt(-12);
      crates.push({ x: rand(g.l + 4, g.r - 9), y: -12, bob: rand(0, 6) });
      nextCrate = dist + rand(130, 260);
    }
    if (dist >= nextPad) {
      const g = gapAt(-14);
      const r = 9;
      pads.push({ x: clamp(rand(g.l + r + 4, g.r - r - 4), g.l + r, g.r - r), y: -14, r, done: false });
      nextPad = dist + rand(1100, 1600);
      if (cargo > 0) popup('DROP ZONE AHEAD', W / 2, 60, '#57c062', 1.4);
    }
    if (dist >= nextTurret) {
      const side = Math.random() < 0.5 ? -1 : 1;
      turrets.push({ side, y: -8, cool: rand(0.4, 1.2), shots: level > 3 ? 2 : 1 });
      nextTurret = dist + Math.max(260, rand(700, 1000) - level * 70);
    }
  }

  function updateCruise(dt) {
    if (level < 2) return;
    cruiseTimer -= dt;
    if (cruiseTimer <= 0) {
      warnings.push({ x: jet.x + JET_W / 2, t: 1.1 });
      cruiseTimer = Math.max(2.2, rand(6, 9) - level * 0.6);
      sfx.warn();
    }
    for (const w of warnings) {
      w.t -= dt;
      if (w.t <= 0) {
        missiles.push(makeMissile(w.x, -6, 0, 1, 170 + level * 8, 0));
        sfx.launch();
      }
    }
    warnings = warnings.filter((w) => w.t > 0);
  }

  function makeMissile(x, y, dx, dy, speed, turn) {
    const n = Math.hypot(dx, dy) || 1;
    return { x, y, vx: (dx / n) * speed, vy: (dy / n) * speed, speed, turn, life: 3.2,
      minD: Infinity, passed: false, rolled: false, dead: false };
  }

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------
  function update(dt) {
    time += dt;
    if (pressed.has('mute')) sfx.setMuted(!sfx.muted);
    banners.forEach((b) => { b.life -= dt; });
    if (banners.length && banners[0].life <= 0) banners.shift();
    popups.forEach((p) => { p.life -= dt; });
    popups = popups.filter((p) => p.life > 0);

    if (state === 'title') {
      // Idle flight behind the title.
      dist += 50 * dt;
      genCanyon(dist + H * 2);
      scroll(50 * dt);
      if (pressed.has('start')) startGame();
    } else if (state === 'paused') {
      if (pressed.has('pause') || pressed.has('start')) {
        state = 'play';
        sfx.engineOn();
      }
    } else if (state === 'play') {
      if (pressed.has('pause')) {
        state = 'paused';
        sfx.engineOff();
      } else {
        updatePlay(dt);
      }
    } else if (state === 'crash') {
      crashTimer -= dt;
      const s = jet.speed * 0.3;
      dist += s * dt;
      scroll(s * dt);
      updateMissiles(dt);
      if (crashTimer <= 0) gameOver();
    } else if (state === 'over') {
      overTimer += dt;
      if (overTimer >= 0.7 && pressed.has('start')) startGame();
    }

    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt + (p.ground && state !== 'title' ? jet.speed * dt : 0);
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
    shake = Math.max(0, shake - dt * 12);
    pressed.clear();
  }

  // Everything that sits still in the world slides down the screen.
  function scroll(amount) {
    floorScroll = (floorScroll + amount) % TILE_H;
    rockScroll = (rockScroll + amount) % TILE_H;
    for (const c of crates) c.y += amount;
    for (const p of pads) p.y += amount;
    for (const t of turrets) t.y += amount;
    for (const c of clouds) c.y += amount * 1.4;
    crates = crates.filter((c) => c.y < H + 10);
    pads = pads.filter((p) => p.y < H + 20);
    turrets = turrets.filter((t) => t.y < H + 10);
    clouds = clouds.filter((c) => c.y < H + 10);
    if (Math.random() < amount * 0.004) clouds.push({ x: rand(-10, W - 4), y: -8 });
  }

  function updatePlay(dt) {
    const j = jet;
    // Throttle.
    const target = keys.has('gas') ? MAX_SPEED : keys.has('brake') ? MIN_SPEED : CRUISE;
    j.speed += clamp(target - j.speed, -120 * dt, 90 * dt);

    // Steering with a little drift.
    const steer = (keys.has('right') ? 1 : 0) - (keys.has('left') ? 1 : 0);
    if (steer) j.vx += steer * 340 * dt;
    else j.vx *= Math.exp(-6 * dt);
    j.vx = clamp(j.vx, -85, 85);

    // Barrel roll: a quick hop sideways, untouchable by missiles.
    rollCd = Math.max(0, rollCd - dt);
    rollTime = Math.max(0, rollTime - dt);
    if (pressed.has('ability') && rollCd <= 0) {
      rollTime = ROLL_TIME;
      rollCd = ROLL_CD;
      rollDir = steer || (j.vx < 0 ? -1 : 1);
      j.vx = rollDir * 85;
      sfx.roll();
    }
    j.x += j.vx * dt;
    hurtTimer = Math.max(0, hurtTimer - dt);

    const moved = j.speed * dt;
    dist += moved;
    genCanyon(dist + H * 2);
    scroll(moved);
    score += moved * 0.05 * (j.speed >= FAST_SPEED ? 2 : 1);
    sfx.engineSet(j.speed);

    const newLevel = 1 + Math.floor(dist / LEVEL_DIST);
    if (newLevel > level) {
      level = newLevel;
      popup(level === 2 ? 'CRUISE MISSILES INCOMING!' : 'CANYON NARROWS!', W / 2, 60, '#ff9d3d', 1.5);
      sfx.tone(440, 0.12, 'triangle', 0.1);
      sfx.tone(330, 0.15, 'triangle', 0.1, null, 0.12);
    }

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }

    // Exhaust.
    if (Math.random() < 0.8) {
      particle(j.x + JET_W / 2 + rand(-1, 1), JET_Y + JET_H, rand(-4, 4), rand(20, 40), rand(0.15, 0.3),
        pick(['#ffd34d', '#ff9d3d', '#ffffff']), 1);
    }

    spawnStuff();
    updateCruise(dt);
    checkWalls();
    if (state !== 'play') return;
    updateTurrets(dt);
    updateMissiles(dt);
    if (state !== 'play') return;
    updateCrates();
    updatePads();
  }

  function checkWalls() {
    const j = jet;
    let l = -Infinity, r = Infinity;
    for (let y = JET_Y + 2; y < JET_Y + JET_H - 1; y += 3) {
      const g = gapAt(y);
      l = Math.max(l, g.l);
      r = Math.min(r, g.r);
    }
    const hitL = j.x + 1 < l, hitR = j.x + JET_W - 1 > r;
    if (!hitL && !hitR) return;
    j.x = hitL ? l - 1 : r - JET_W + 1;
    j.vx = hitL ? 60 : -60;
    for (let i = 0; i < 10; i++) {
      particle(hitL ? l : r, JET_Y + rand(2, JET_H - 2), (hitL ? 1 : -1) * rand(10, 50), rand(-20, 20), 0.4,
        pick(['#ffd34d', '#c88a5a', '#ffffff']), 1);
    }
    if (hurtTimer <= 0) {
      crashCause = 'wall';
      damage('SCRAPED THE CANYON!');
    }
  }

  function damage(text) {
    hp--;
    hurtTimer = 1.2;
    shake = 4;
    combo = 0;
    if (hp <= 0) {
      crash();
      return;
    }
    sfx.hurt();
    popup(text, jet.x, JET_Y - 10, '#ff4d4d', 1.2);
    if (cargo > 0) {
      cargo--;
      popup('LOST A PACKAGE', jet.x, JET_Y - 10, '#ff9d3d', 1.2);
      for (let i = 0; i < 6; i++) {
        particle(jet.x + JET_W / 2, JET_Y + 6, rand(-30, 30), rand(10, 50), 0.6, pick(['#c88a3a', '#9a6428', '#d82828']), 1);
      }
    }
  }

  function crash() {
    state = 'crash';
    crashTimer = 1.6;
    shake = 6;
    const cx = jet.x + JET_W / 2, cy = JET_Y + JET_H / 2;
    explode(cx, cy, 50);
    for (let i = 0; i < 12; i++) particle(cx, cy, rand(-50, 50), rand(-50, 50), rand(0.5, 1), '#f2f2f2', 1);
    sfx.engineOff();
    sfx.crash();
  }

  function gameOver() {
    state = 'over';
    overTimer = 0;
    score = Math.floor(score);
    if (score > best) {
      best = score;
      isNewBest = true;
      store.set('best', best);
    }
  }

  function updateTurrets(dt) {
    for (const t of turrets) {
      if (t.y < 6 || t.y > JET_Y - 40) continue;
      t.cool -= dt;
      if (t.cool <= 0 && t.shots > 0 && missiles.length < 2 + Math.floor(level / 2)) {
        t.shots--;
        t.cool = 0.9;
        const g = gapAt(t.y);
        const mx = t.side < 0 ? g.l : g.r, my = t.y;
        missiles.push(makeMissile(mx, my, jet.x + JET_W / 2 - mx, JET_Y - my, 105 + level * 8, 1.4));
        sfx.launch();
      }
    }
  }

  function updateMissiles(dt) {
    const jx = jet.x + JET_W / 2, jy = JET_Y + JET_H / 2;
    for (const m of missiles) {
      if (m.turn && state === 'play' && m.y < JET_Y - 6) {
        // Homing: swing the nose toward the jet, but only so fast.
        const want = Math.atan2(jy - m.y, jx - m.x);
        let a = Math.atan2(m.vy, m.vx);
        let d = want - a;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        a += clamp(d, -m.turn * dt, m.turn * dt);
        m.vx = Math.cos(a) * m.speed;
        m.vy = Math.sin(a) * m.speed;
      }
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.life -= dt;
      if (Math.random() < 0.7) particle(m.x - m.vx * 0.03, m.y - m.vy * 0.03, rand(-5, 5), rand(-5, 5), 0.4, pick(['#aaaaaa', '#dddddd', '#888888']), 1);

      const g = gapAt(m.y);
      if (m.life <= 0 || (m.y > 0 && (m.x < g.l || m.x > g.r))) {
        m.dead = true;
        explode(m.x, m.y, 12);
        sfx.boom();
        continue;
      }
      if (state !== 'play') continue;
      // Distance from the missile to the jet's body.
      const dx = Math.max(jet.x + 1 - m.x, 0, m.x - (jet.x + JET_W - 1));
      const dy = Math.max(JET_Y + 1 - m.y, 0, m.y - (JET_Y + JET_H - 1));
      const d = Math.hypot(dx, dy);
      m.minD = Math.min(m.minD, d);
      if (d < 1.5) {
        if (rollTime > 0) {
          m.rolled = true;
        } else if (hurtTimer <= 0) {
          m.dead = true;
          explode(m.x, m.y, 20);
          crashCause = 'missile';
          damage('HIT BY A MISSILE!');
          if (state !== 'play') return;
          continue;
        }
      }
      if (!m.passed && m.y > JET_Y + JET_H + 4) {
        m.passed = true;
        if (m.minD < NEAR_MISS && hurtTimer <= 0) nearMiss(m.rolled);
      }
    }
    missiles = missiles.filter((m) => !m.dead && m.y < H + 10 && m.y > -40 && m.x > -20 && m.x < W + 20);
  }

  function nearMiss(rolled) {
    combo = comboTimer > 0 ? combo + 1 : 1;
    comboTimer = 2.5;
    nearMisses++;
    const n = Math.round(50 * combo * (rolled ? 2 : 1));
    score += n;
    popup((rolled ? 'ROLL DODGE! +' : 'CLOSE! +') + n, jet.x + JET_W / 2, JET_Y - 8, combo > 2 ? '#ff7ab8' : '#ffd34d', 0.9);
    sfx.nearMiss(combo);
  }

  function updateCrates() {
    for (const c of crates) {
      if (c.got) continue;
      const cy = c.y + Math.sin(time * 3 + c.bob);
      if (jet.x < c.x + 5 && jet.x + JET_W > c.x && JET_Y < cy + 11 && JET_Y + JET_H > cy) {
        c.got = true;
        if (cargo < MAX_CARGO) {
          cargo++;
          score += 50;
          popup('PACKAGE +50', jet.x, JET_Y - 10, '#ffd34d', 1);
          if (cargo === MAX_CARGO) popup('CARGO FULL! FIND A DROP ZONE', W / 2, 60, '#57c062', 1.6);
        } else {
          score += 25;
          popup('NO ROOM +25', jet.x, JET_Y - 10, '#aaaaaa', 1);
        }
        sfx.pickup();
        for (let i = 0; i < 8; i++) particle(c.x + 2, cy + 3, rand(-30, 30), rand(-30, 30), 0.4, pick(['#d82828', '#ff8080', '#ffffff']), 1);
      }
    }
    crates = crates.filter((c) => !c.got);
  }

  // Fly over a drop zone to parachute your whole load onto it. Bigger loads
  // pay a lot more, so it's worth holding on to packages.
  function updatePads() {
    for (const p of pads) {
      if (p.done || p.y < JET_Y + JET_H / 2) continue;
      p.done = true;
      const over = Math.abs(jet.x + JET_W / 2 - p.x) <= p.r + 3;
      if (!over) {
        if (cargo > 0) popup('MISSED THE DROP', jet.x, JET_Y - 10, '#ff7a7a', 1);
        continue;
      }
      if (cargo === 0) {
        if (!padTipShown) {
          padTipShown = true;
          popup('NO CARGO TO DROP', W / 2, 60, '#aaaaaa', 1.2);
        }
        continue;
      }
      const n = 100 * cargo * cargo;
      score += n;
      delivered += cargo;
      popup('DELIVERED ' + cargo + '! +' + n, jet.x, JET_Y - 10, '#57c062', 1.4);
      if (cargo === MAX_CARGO && hp < MAX_HP) {
        hp++;
        popup('FULL LOAD: +1 HP', W / 2, 60, '#57c062', 1.4);
      }
      for (let i = 0; i < cargo; i++) {
        particle(p.x + rand(-4, 4), p.y + rand(-4, 4), rand(-8, 8), rand(-8, 8), 0.8, '#ffffff', 2, true);
      }
      cargo = 0;
      sfx.deliver();
    }
  }

  // ---------------------------------------------------------------------------
  // Draw
  // ---------------------------------------------------------------------------
  function drawWorld() {
    // Canyon floor and drop zones, then the mesas on top.
    const fo = Math.floor(floorScroll), ro = Math.floor(rockScroll);
    for (let y = 0; y < H; y++) {
      const fy = (((y - fo) % TILE_H) + TILE_H) % TILE_H;
      ctx.drawImage(floorTile, 0, fy, W, 1, 0, y, W, 1);
    }

    for (const p of pads) drawPad(p);

    for (let y = 0; y < H; y++) {
      const g = gapAt(y);
      const ry = (((y - ro) % TILE_H) + TILE_H) % TILE_H;
      const l = Math.round(g.l), r = Math.round(g.r);
      if (l > 0) ctx.drawImage(rockTile, 0, ry, l, 1, 0, y, l, 1);
      if (r < W) ctx.drawImage(rockTile, r, ry, W - r, 1, r, y, W - r, 1);
      // Cliff faces drop into shadow.
      ctx.fillStyle = '#3a2418';
      ctx.fillRect(l, y, 3, 1);
      ctx.fillRect(r - 3, y, 3, 1);
      ctx.fillStyle = '#d8a070';
      ctx.fillRect(l - 1, y, 1, 1);
      ctx.fillRect(r, y, 1, 1);
    }

    for (const t of turrets) {
      const g = gapAt(t.y);
      const x = t.side < 0 ? Math.round(g.l) - 5 : Math.round(g.r) - 2;
      ctx.drawImage(turretSprite, x, Math.round(t.y) - 3);
    }

    for (const c of crates) {
      const y = Math.round(c.y + Math.sin(time * 3 + c.bob));
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(Math.round(c.x) + 4, y + 10, 5, 3);
      ctx.drawImage(crateSprite, Math.round(c.x), y);
    }

    const inMenu = state === 'title';
    if (!inMenu) drawJet();

    for (const m of missiles) drawMissile(m);

    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Clouds drift by between you and the camera.
    ctx.globalAlpha = 0.55;
    for (const c of clouds) ctx.drawImage(cloudSprite, Math.round(c.x), Math.round(c.y), 28, 12);
    ctx.globalAlpha = 1;

    if (state === 'play') {
      for (const w of warnings) {
        if (Math.floor(time * 10) % 2) continue;
        const x = clamp(Math.round(w.x), 3, W - 4);
        ctx.fillStyle = '#ff4d4d';
        ctx.fillRect(x - 3, 11, 7, 1);
        drawText('!', x - 1, 13, '#ff4d4d');
      }
    }
  }

  function drawPad(p) {
    const cx = Math.round(p.x), cy = Math.round(p.y);
    // Concentric target painted on the canyon floor.
    const rings = [[p.r, '#f2f2f2'], [p.r - 2, '#2fae4f'], [p.r - 4, '#f2f2f2'], [p.r - 6, '#2fae4f']];
    for (const [r, col] of rings) {
      ctx.fillStyle = col;
      for (let dy = -r; dy <= r; dy++) {
        const hw = Math.round(Math.sqrt(r * r - dy * dy));
        ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
      }
    }
    if (!p.done && cargo > 0 && Math.floor(time * 4) % 2) {
      drawText('DROP', cx, cy - p.r - 7, '#57c062', 1, 'center');
    }
  }

  function drawMissile(m) {
    const n = Math.hypot(m.vx, m.vy) || 1;
    const dx = m.vx / n, dy = m.vy / n;
    for (let i = 5; i >= 0; i--) {
      ctx.fillStyle = i === 0 ? '#ff4d4d' : i >= 4 ? '#5a5a62' : '#e8e8e8';
      ctx.fillRect(Math.round(m.x - dx * i) - 1, Math.round(m.y - dy * i) - 1, 2, 2);
    }
    if (Math.floor(time * 20) % 2) {
      ctx.fillStyle = '#ffb000';
      ctx.fillRect(Math.round(m.x - dx * 7) - 1, Math.round(m.y - dy * 7) - 1, 2, 2);
    }
  }

  function drawJet() {
    const x = Math.round(jet.x), y = JET_Y;
    const wrecked = state === 'crash' || state === 'over';
    if (wrecked && state === 'over') return;
    if (!wrecked && hurtTimer > 0 && Math.floor(time * 20) % 2) ctx.globalAlpha = 0.3;
    // Shadow on the canyon floor far below.
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + 6, y + 10, JET_W - 4, JET_H - 6);
    if (rollTime > 0) {
      // Barrel roll: the wings flip over, showing the belly halfway through.
      const ph = (1 - rollTime / ROLL_TIME) * Math.PI * 2;
      const c = Math.cos(ph);
      const w = Math.max(2, Math.round(JET_W * Math.abs(c)));
      ctx.drawImage(c < 0 ? jetUnderSprite : jetSprite, x + Math.round((JET_W - w) / 2), y, w, JET_H);
    } else {
      ctx.drawImage(wrecked ? jetWreckSprite : jetSprite, x, y);
      // Bank into turns by shading the trailing wing.
      if (!wrecked && Math.abs(jet.vx) > 30) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(jet.vx > 0 ? x : x + JET_W / 2, y + 5, JET_W / 2, 5);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    const b = banners[0];
    if (b) {
      const y = state === 'title' ? H - 22 : 37;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, y - 2, W, 9);
      if (b.life > 0.2 || Math.floor(time * 20) % 2) drawText(b.text, W / 2, y, b.color, 1, 'center');
    }
    popups.forEach((p, i) => {
      const y = H - 12 - (popups.length - 1 - i) * 7;
      ctx.globalAlpha = clamp(p.life / 0.4, 0, 1);
      drawText(p.text, W - 2, y, p.color, 1, 'right');
      ctx.globalAlpha = 1;
    });
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, 9);
    drawText('SCORE ' + Math.floor(score), 2, 2, '#ffffff');
    const fast = jet.speed >= FAST_SPEED;
    drawText(Math.round(jet.speed * KTS) + ' KTS', W - 2, 2, fast ? '#ff9d3d' : '#ffffff', 1, 'right');
    if (fast && Math.floor(time * 4) % 2 === 0) drawText('AFTERBURN X2', W - 2, 12, '#ff9d3d', 1, 'right');

    // Barrel roll: name plus a cooldown bar (yellow while rolling).
    const label = 'B ROLL';
    const ready = rollCd <= 0;
    const running = rollTime > 0;
    drawText(label, 2, 12, running ? '#ffd34d' : ready ? '#ffffff' : '#888888');
    const barW = textWidth(label);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(2, 18, barW, 2);
    ctx.fillStyle = running ? '#ffd34d' : ready ? '#57c062' : '#6a6a6a';
    const frac = running ? rollTime / ROLL_TIME : ready ? 1 : 1 - rollCd / ROLL_CD;
    ctx.fillRect(2, 18, Math.round(barW * frac), 2);
    if (combo > 1 && comboTimer > 0) drawText('COMBO X' + combo, 2, 23, '#ffd34d');

    // Armor blocks, then the cargo hold.
    const bx = W - 2 - MAX_HP * 5 + 1;
    drawText('HP', bx - 2, 20, hp <= 1 && Math.floor(time * 4) % 2 ? '#ff4d4d' : '#ffffff', 1, 'right');
    for (let i = 0; i < MAX_HP; i++) {
      ctx.fillStyle = '#000';
      ctx.fillRect(bx + i * 5, 20, 4, 5);
      ctx.fillStyle = i < hp ? (hp <= 1 ? '#ff4d4d' : '#57c062') : '#3a3a3a';
      ctx.fillRect(bx + i * 5, 21, 4, 3);
    }
    const cx = W - 2 - MAX_CARGO * 5 + 1;
    drawText('BOX', cx - 2, 27, '#ffffff', 1, 'right');
    for (let i = 0; i < MAX_CARGO; i++) {
      ctx.fillStyle = '#000';
      ctx.fillRect(cx + i * 5, 27, 4, 5);
      ctx.fillStyle = i < cargo ? '#c88a3a' : '#3a3a3a';
      ctx.fillRect(cx + i * 5, 28, 4, 3);
    }

    // Throttle bar along the bottom, with an orange tick where afterburn kicks in.
    const span = MAX_SPEED - MIN_SPEED;
    const sf = clamp((jet.speed - MIN_SPEED) / span, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, H - 3, W, 3);
    ctx.fillStyle = fast ? '#ff9d3d' : sf > 0.5 ? '#ffd34d' : '#57c062';
    ctx.fillRect(1, H - 2, Math.round((W - 2) * sf), 1);
    ctx.fillStyle = '#ff9d3d';
    ctx.fillRect(1 + Math.round((W - 2) * (FAST_SPEED - MIN_SPEED) / span), H - 3, 1, 3);
  }

  function dim(alpha) {
    ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
    ctx.fillRect(0, 0, W, H);
  }

  function drawTitle() {
    dim(0.4);
    drawText('SKY', W / 2, 14, '#ff9d3d', 3, 'center', '#5a2a00');
    drawText('COURIER', W / 2, 33, '#ffffff', 3, 'center', '#333333');
    drawText('DELIVER THE GOODS', W / 2, 54, '#ffd34d', 1, 'center');
    drawText('BEST ' + best, W / 2, 64, '#ffffff', 1, 'center');

    const bobY = Math.round(Math.sin(time * 2) * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(W / 2 - 6, 90 + bobY, 20, 22);
    ctx.drawImage(jetSprite, W / 2 - 12, 78 + bobY, JET_W * 2, JET_H * 2);
    if (Math.floor(time * 12) % 2) {
      ctx.fillStyle = '#ffd34d';
      ctx.fillRect(W / 2 - 1, 106 + bobY, 2, 3);
    }

    drawText('PACKAGE +50', W / 2, 116, '#c88a3a', 1, 'center');
    drawText('DROP ZONE: 100 X LOAD X LOAD', W / 2, 124, '#57c062', 1, 'center');
    drawText('CLOSE MISSILE: COMBO BONUS', W / 2, 132, '#ff7ab8', 1, 'center');

    if (Math.floor(time * 2) % 2 === 0) {
      drawText(isTouch ? 'TAP TO FLY' : 'PRESS ENTER TO FLY', W / 2, 150, '#ffd34d', 1, 'center');
    }
    drawText(isTouch ? 'GAS/BRK: THROTTLE' : 'UP/DOWN: THROTTLE', W / 2, 160, '#ffffff', 1, 'center');
    drawText('LEFT/RIGHT: STEER', W / 2, 168, '#ffffff', 1, 'center');
    drawText('B: BARREL ROLL DODGES MISSILES', W / 2, 176, '#6fa8ff', 1, 'center');
  }

  function drawOver() {
    dim(0.55);
    if (crashCause === 'missile') {
      drawText('SHOT DOWN!', W / 2, 26, '#ff4d4d', 2, 'center', '#5a0000');
      drawText('A MISSILE FOUND ITS MARK', W / 2, 42, '#aaaaaa', 1, 'center');
    } else {
      drawText('CRASHED!', W / 2, 26, '#ff4d4d', 2, 'center', '#5a0000');
      drawText('SMASHED INTO THE CANYON', W / 2, 42, '#aaaaaa', 1, 'center');
    }
    drawText('SCORE', W / 2, 54, '#aaaaaa', 1, 'center');
    drawText(Math.floor(score), W / 2, 62, '#ffffff', 2, 'center');
    if (isNewBest) {
      if (Math.floor(time * 4) % 2 === 0) drawText('NEW BEST!', W / 2, 80, '#ffd34d', 1, 'center');
    } else {
      drawText('BEST ' + best, W / 2, 80, '#ffffff', 1, 'center');
    }
    drawText('PACKAGES DELIVERED ' + delivered, W / 2, 94, '#57c062', 1, 'center');
    drawText('CLOSE CALLS ' + nearMisses, W / 2, 103, '#ffd34d', 1, 'center');
    drawText('DISTANCE ' + Math.floor(dist / 10) + ' M', W / 2, 112, '#ffffff', 1, 'center');
    if (overTimer >= 0.7 && Math.floor(time * 2) % 2 === 0) {
      drawText(isTouch ? 'TAP TO RETRY' : 'ENTER: RETRY', W / 2, 140, '#ffd34d', 1, 'center');
    }
  }

  function drawPaused() {
    dim(0.5);
    drawText('PAUSED', W / 2, 80, '#ffffff', 2, 'center');
    drawText(isTouch ? 'TAP TO RESUME' : 'P TO RESUME', W / 2, 100, '#ffd34d', 1, 'center');
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) {
      ctx.translate(Math.round(rand(-shake, shake)), Math.round(rand(-shake, shake)));
    }
    drawWorld();
    ctx.restore();

    if (state === 'title') {
      drawTitle();
      drawPopups();
    } else {
      drawPopups();
      drawHUD();
      if (state === 'paused') drawPaused();
      else if (state === 'over') drawOver();
    }
  }

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------
  reset();
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
