function present(sx, sy) {

function pset(x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return; fb[y * W + x] = c; }
function blendI(i, c, a) {
  if (a >= 1) { fb[i] = c; return; }
  const d = fb[i], ia = 1 - a;
  const r = (d & 255) * ia + (c & 255) * a;
  const g = ((d >> 8) & 255) * ia + ((c >> 8) & 255) * a;
  const b = ((d >> 16) & 255) * ia + ((c >> 16) & 255) * a;
  fb[i] = rgb(r | 0, g | 0, b | 0);
}
function pblend(x, y, c, a) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return; blendI(y * W + x, c, a); }
function padd(x, y, c, a) {
  x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return;
  const i = y * W + x, d = fb[i];
  fb[i] = rgb(Math.min(255, (d & 255) + (c & 255) * a) | 0, Math.min(255, ((d >> 8) & 255) + ((c >> 8) & 255) * a) | 0, Math.min(255, ((d >> 16) & 255) + ((c >> 16) & 255) * a) | 0);
}
function rect(x, y, w, h, c) {
  x |= 0; y |= 0;
  const x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) fb.fill(c, yy * W + x0, yy * W + x1);
}
function rectA(x, y, w, h, c, a) {
  x |= 0; y |= 0;
  const x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) blendI(yy * W + xx, c, a);
}
function outline(x, y, w, h, c, a) {
  a = a == null ? 1 : a;
  for (let i = 0; i < w; i++) { pblend(x + i, y, c, a); pblend(x + i, y + h - 1, c, a); }
  for (let i = 1; i < h - 1; i++) { pblend(x, y + i, c, a); pblend(x + w - 1, y + i, c, a); }
}
function line(x0, y0, x1, y1, c, a) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, n = 0;
  while (n++ < 400) {
    pblend(x0, y0, c, a == null ? 1 : a);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function disc(cx, cy, r, c, a) {
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r * r) pblend(x, y, c, a == null ? 1 : a);
    }
}
function ring(cx, cy, r, c, a) {
  const n = Math.max(8, Math.floor(r * 6));
  for (let i = 0; i < n; i++) { const t = i / n * TAU; pblend(cx + Math.cos(t) * r, cy + Math.sin(t) * r, c, a); }
}
function glow(cx, cy, r, c, a) {
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = Math.sqrt(dx * dx + dy * dy);
      if (d < r) padd(x, y, c, a * (1 - d / r) * (1 - d / r));
    }
}

const SAVE_KEY = 'lighthouseKeeper.save.v1';
function defaultSave() {
  return { best: 0, bestNight: 0, coins: 0, up: { lens: 0, gears: 0, tank: 0, flare: 0, lamp2: 0 }, paints: [0], paint: 0, beams: [0], beam: 0, muted: false };
}
function loadSave() {
  const s = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === 'object') {
        s.best = +d.best || 0; s.bestNight = +d.bestNight || 0; s.coins = +d.coins || 0;
        if (d.up) for (const k in s.up) s.up[k] = clamp(+d.up[k] || 0, 0, (UPGRADES.find(u => u.id === k) || { prices: [] }).prices.length);
        if (Array.isArray(d.paints)) s.paints = d.paints.filter(v => v >= 0 && v < PAINTS.length);
        if (Array.isArray(d.beams)) s.beams = d.beams.filter(v => v >= 0 && v < BEAMS.length);
        if (!s.paints.includes(0)) s.paints.push(0);
        if (!s.beams.includes(0)) s.beams.push(0);
        s.paint = s.paints.includes(d.paint) ? d.paint : 0;
        s.beam = s.beams.includes(d.beam) ? d.beam : 0;
        s.muted = !!d.muted;
      }
    }
  } catch (e) { /* storage blocked: play without saving */ }
  return s;
}

  for (let n = 0; n < s.length; n++) {

}

  if (o.align === 'center') x = Math.round(x - w / 2);

  }

function computeLight(g) {

  for (const b of g.beams) {

    const edge = b.half * 0.35, hmax = b.half + edge * 0.5, hin = b.half - edge * 0.5, r2 = b.reach * b.reach;

// ---- spawning ----

}

// ---- effects ----
function part(g, x, y, vx, vy, life, c, o) {

  g.parts.push({ x, y, vx, vy, life, max: life, c, g: o.g || 0, type: o.type || 'px', r: o.r || 0, dr: o.dr || 0, drag: o.drag || 0, a: o.a == null ? 1 : o.a });
}

// =====================================================================
// UPDATE
// =====================================================================
function tickAmbient(g, dt) {
  const windX = g.wind.x + g.gust.x;
  for (const w of g.waves) {
    w.x += (w.spd + windX * 0.6) * dt;

  }

    b.x += b.vx * dt;

  }
  if (g.weather === 'STORM') for (const r of g.rain) {
    r.y += 150 * r.s * dt; r.x += (windX * 7 - 20) * dt;
    if (r.y > H) { r.y -= H + 4; r.x = rand(0, W + 30); if (Math.random() < 0.3) part(g, rand(0, W), rand(HORIZON + 4, 175), 0, 0, 0.25, C.rain, { type: 'ring', r: 0.5, dr: 5, a: 0.5 }); }
    if (r.x < -4) r.x += W + 8; else if (r.x > W + 30) r.x -= W + 30;
  }
  g.keeperT -= dt;
  if (g.keeperT <= 0) { g.keeperOn = rand(2, 3.5); g.keeperT = rand(7, 13); }
  g.keeperOn = Math.max(0, g.keeperOn - dt);
  g.dockFlash[0] = Math.max(0, g.dockFlash[0] - dt * 1.2);
  g.dockFlash[1] = Math.max(0, g.dockFlash[1] - dt * 1.2);
  g.flashT = Math.max(0, g.flashT - dt);
  g.shakeT = Math.max(0, g.shakeT - dt);
  if (g.shakeT <= 0) g.shakeM = 0;
  for (let i = g.parts.length - 1; i >= 0; i--) {
    const p = g.parts[i];
    p.vy += p.g * dt;
    if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.dr * dt;
    p.life -= dt;
    if (p.life <= 0) g.parts.splice(i, 1);
  }
  for (let i = g.texts.length - 1; i >= 0; i--) {
    const t = g.texts[i];
    if (t.delay > 0) { t.delay -= dt; continue; }
    t.y -= 7 * dt; t.life -= dt;
    if (t.life <= 0) g.texts.splice(i, 1);
  }
  for (const gl of g.gulls) { gl.x += gl.vx * dt; gl.y += Math.sin(gl.x * 0.1 + gl.ph) * 4 * dt; gl.f += dt * 6; }
}

function updateWeather(g, dt) {
  if (g.weather === 'WINDY') {
    g.wind.x = g.windDir * (3 + Math.min(g.n, 12) * 0.12 + Math.sin(g.t * 0.25) * 0.8);
    g.wind.y = Math.sin(g.t * 0.13) * 0.6;
  } else if (g.weather === 'STORM') {
    g.gustT -= dt;
    if (g.gustT <= 0) { g.gustT = rand(1.5, 3); g.gustTo = { x: rand(-5, 5), y: rand(-2, 3) }; }
    g.gust.x = lerp(g.gust.x, g.gustTo.x, dt * 1.2);
    g.gust.y = lerp(g.gust.y, g.gustTo.y, dt * 1.2);
    g.lightningT -= dt;
    if (g.lightningT <= 0 && !g.demo) {
      g.lightningT = rand(5, 10);
      g.flashT = 0.4;
      const pts = []; let x = rand(10, 118), y = 0;

  shake(g, 0.15, 1);

function updateShips(g, dt) {
  const horn = g.hornT > 0, flare = g.flareT > 0, flash = g.flashT > 0;
  for (let i = g.ships.length - 1; i >= 0; i--) {
    const s = g.ships[i], T = TYPES[s.type];
    s.age += dt;
    const L = lightAt(g, s.x, s.y, T.len > 12 ? 4 : 2), mainL = lastMain;
    let desired = s.h, speed = T.speed * g.cfg.speedMul;
    if (T.friendly) {
      const harbor = nearHarbor(s.x, s.y);
      let drain = L * T.drain;
      if (flare) drain = Math.max(drain, T.drain * 1.2);
      if (flash) drain = Math.max(drain, T.drain * 0.8);
      if (harbor) drain = Math.max(drain, T.drain * 0.5);
      s.litVis = L > 0 || flare || flash || harbor;
      if (!g.demo) {
        if (drain > 0) { if (s.m >= 0.66 && !s.close) s.close = true; s.m -= drain * dt; }
        else s.m += T.fill * g.cfg.fillMul * dt;
        s.m = clamp(s.m, 0, 1);
        s.maxM = Math.max(s.maxM, s.m);
        if (s.m >= 1) { if (!s.lost) { s.lost = true; ftext(g, s.x, s.y - 12, 'LOST!', C.red); sfx('lost'); } }
        else if (s.m < 0.9) s.lost = false;
      }
      if (s.type === 'ghost') {
        s.lostT = s.lost ? s.lostT + dt : 0;
        if (s.lostT > 5) { for (let k = 0; k < 10; k++) part(g, s.x, s.y, rand(-6, 6), rand(-10, -2), rand(0.6, 1.2), PAL.ghost.B, { a: 0.6 }); ftext(g, s.x, s.y - 10, 'VANISHED', C.cyan); g.ships.splice(i, 1); continue; }
      }
      if (!s.lost && !(s.side && s.age < 1.6)) {
        const f = flowAngle(g.fields[s.entrance], s.x, s.y);
        const k = smooth(0.3, 1, s.m);
        s.wander = clamp(s.wander + (Math.random() - 0.5) * 7 * dt, -1.6, 1.6);
        if (k <= 0) s.wander *= 1 - dt;
        // lean into the drift so lit ships hold their course
        const dx = Math.sin(f) * speed - (g.wind.x * T.wind + g.gust.x * 0.4) * 0.6;
        const dy = -Math.cos(f) * speed - (g.wind.y * T.wind + g.gust.y * 0.4) * 0.6;
        desired = Math.atan2(dx, -dy) + s.wander * k * 1.6;

    } else {

      s.litVis = L > 0 || flash || flare;
      if (s.state === 'sail') {
        if (mainL > 0 || L > 0) s.spot += dt * (g.focus && mainL > 0 ? 1.4 : (mainL > 0 ? 1 : 0.5));
        else s.spot = Math.max(0, s.spot - dt * 0.6);
        desired = s.baseH + Math.sin(s.age * 0.5) * 0.15;
        if (s.spot >= 2) { s.state = 'aim'; s.aimT = 0.9; ftext(g, s.x, s.y - 12, 'SPOTTED!', C.red); sfx('alarm'); }
      } else if (s.state === 'aim') {
        desired = Math.atan2(LAMP_X - s.x, -(LAMP_Y - s.y));
        speed *= 0.3;
        s.aimT -= dt;
        if (s.aimT <= 0) { fireCannon(g, s); s.state = 'flee'; s.baseH = s.x < W / 2 ? -Math.PI / 2 : Math.PI / 2; }
      } else { desired = s.baseH; speed *= 1.3; }
    }
    // turn
    const turn = T.turn * (s.state === 'aim' ? 2 : 1);
    s.h = wrapA(s.h + clamp(wrapA(desired - s.h), -turn * dt, turn * dt));
    // move
    const hx = Math.sin(s.h), hy = -Math.cos(s.h);

    if (s.type === 'sail' && g.weather !== 'WINDY' && g.weather !== 'STORM') wx += g.breeze * T.wind;
    if (g.weather === 'STORM') { wx += Math.sin(g.t * 1.7 + i) * 1.2; wy += Math.cos(g.t * 1.3 + i * 2) * 1.0; }
    s.x += (hx * speed + wx) * dt;
    s.y += (hy * speed + wy) * dt;

    for (let e = 0; e < 2; e++) if (s.x > CHANNELS[e].x0 && s.x < CHANNELS[e].x1 + 1 && s.y >= DOCK_Y) docked = e;
    if (docked >= 0) {
      if (g.demo) { g.dockFlash[docked] = 1; for (let k = 0; k < 8; k++) part(g, s.x, s.y, rand(-15, 15), rand(-15, 15), 0.6, C.gold, { drag: 3 }); }
      else if (g.dawnT < 0) dock(g, s, docked);
      g.ships.splice(i, 1);
      continue;
    }
    if (s.type === 'ghost' || g.dawnT >= 0) continue;

    const bow = T.len * 0.4;
    if (solidAt(g, s.x + hx * bow, s.y + hy * bow) || solidAt(g, s.x, s.y) || (s.type === 'cargo' && solidAt(g, s.x - hx * bow, s.y - hy * bow))) {
      if (g.demo) { g.ships.splice(i, 1); continue; }
      wreck(g, s);
      g.ships.splice(i, 1);
    }
  }
}

function updateBarrels(g, dt) {

        g.oil = Math.min(g.oilMax, g.oil + 35);

        ftext(g, b.x, b.y - 6, '+OIL', C.oil);

        sfx('oil');

function updateFlareAndBalls(g, dt) {

    if (f.vy > -25 || f.y < 50) {
      g.flareShot = null; g.flareT = 3; g.flarePos = { x: f.x, y: f.y };
      for (const s of g.ships) if (TYPES[s.type].friendly) s.m *= 0.4;
      for (let k = 0; k < 30; k++) { const a = rand(0, TAU), v = rand(10, 40); part(g, f.x, f.y, Math.cos(a) * v, Math.sin(a) * v, rand(0.6, 1.4), Math.random() < 0.5 ? hex('#ff6a8a') : C.white, { g: 20, drag: 1.5 }); }
      ftext(g, f.x, f.y + 6, 'FLARE!', hex('#ff8aa0'));
    }
  }
  if (g.flareT > 0) {
    g.flareT -= dt;
    if (g.flarePos) { g.flarePos.y += 4 * dt; if (Math.random() < 0.5) part(g, g.flarePos.x + rand(-1, 1), g.flarePos.y, rand(-3, 3), rand(4, 10), 0.6, hex('#ff8aa0')); }
  }
  for (let i = g.balls.length - 1; i >= 0; i--) {
    const b = g.balls[i];
    b.u += dt / b.dur;
    const u = Math.min(1, b.u);
    b.x = lerp(b.x0, LAMP_X, u); b.y = lerp(b.y0, LAMP_Y, u) - Math.sin(u * Math.PI) * 14;
    if (Math.random() < 0.6) part(g, b.x, b.y, rand(-2, 2), rand(-2, 2), 0.5, hex('#7a8090'), { a: 0.6 });
    if (b.u >= 1) {
      g.balls.splice(i, 1);
      g.crackT = 6;
      shake(g, 0.45, 2);
      for (let k = 0; k < 16; k++) { const a = rand(0, TAU), v = rand(10, 35); part(g, LAMP_X, LAMP_Y, Math.cos(a) * v, Math.sin(a) * v, rand(0.4, 0.9), Math.random() < 0.5 ? C.white : C.cyan, { g: 60 }); }
      ftext(g, LAMP_X, LAMP_Y - 20, 'LAMP CRACKED!', C.red);
      sfx('crack');
    }
  }
}

function spawner(g, dt) {
  const friendly = g.ships.filter(s => TYPES[s.type].friendly).length;
  g.spawnT -= dt;
  if (g.spawnT <= 0 && g.t < g.dur - 10) {
    if (friendly < g.cfg.maxShips && spawnShip(g, pickType(g))) g.spawnT = g.cfg.interval * rand(0.75, 1.25);
    else g.spawnT = 1;
  }
  if (g.cfg.pirates) {
    g.pirateT -= dt;
    if (g.pirateT <= 0) {
      if (g.ships.filter(s => s.type === 'pirate').length < g.cfg.pirateMax && g.t < g.dur - 8) spawnPirate(g);
      g.pirateT = g.cfg.pirateInterval * rand(0.8, 1.2);
    }
  }
  g.barrelT -= dt;
  if (g.barrelT <= 0) { spawnBarrel(g); g.barrelT = rand(15, 24); }
}

function updatePlay(dt) {
  const g = G;
  const tp = tapId();
  if (hit('Escape', 'KeyP') || tp === 'pause') { setScreen('pause'); return; }
  if (hit('KeyM')) { S.muted = !S.muted; save(); }
  g.t += dt;
  // beam control
  let dir = 0;
  if (keys.ArrowLeft || keys.KeyA || touchHeld('left')) dir -= 1;
  if (keys.ArrowRight || keys.KeyD || touchHeld('right')) dir += 1;
  g.focus = !!(keys.ShiftLeft || keys.ShiftRight || keys.ArrowDown || keys.KeyS || touchHeld('focus'));
  const rs = (1.4 + 0.4 * S.up.gears) * (g.focus ? 0.75 : 1);
  const aim = aimPoint();
  if (aim) g.aimTo = clamp(Math.atan2(aim.x - LAMP_X, -(aim.y - LAMP_Y)), -BEAM_LIMIT, BEAM_LIMIT);
  else for (const t of taps) if (!playBtnAt(t) && t.y > HORIZON - 8 && t.y < 176) g.aimTo = clamp(Math.atan2(t.x - LAMP_X, -(t.y - LAMP_Y)), -BEAM_LIMIT, BEAM_LIMIT);
  if (dir) { g.beamAngle += dir * rs * dt; g.aimTo = null; }
  else if (g.aimTo != null) {
    g.beamAngle += clamp(g.aimTo - g.beamAngle, -rs * 2.2 * dt, rs * 2.2 * dt);
    if (!aim && Math.abs(g.aimTo - g.beamAngle) < 0.01) g.aimTo = null;
  }
  g.beamAngle = clamp(g.beamAngle, -BEAM_LIMIT, BEAM_LIMIT);
  if (hit('Space') || tp === 'flare') useFlare(g);
  if (hit('KeyH') || tp === 'horn') useHorn(g);
  // oil
  if (g.oil > 0) {
    g.oil -= (g.focus ? 1.8 : 0.75) * dt;
    if (g.oil <= 0) { g.oil = 0; ftext(g, LAMP_X, LAMP_Y - 20, 'OUT OF OIL!', C.oil); sfx('sputter'); }
  }
  g.crackT = Math.max(0, g.crackT - dt);
  g.hornT = Math.max(0, g.hornT - dt);
  g.hornCD = Math.max(0, g.hornCD - dt);
  updateWeather(g, dt);
  computeBeams(g);
  spawner(g, dt);
  updateShips(g, dt);
  updateBarrels(g, dt);
  updateFlareAndBalls(g, dt);
  tickAmbient(g, dt);
  if (g.overT >= 0) { g.overT -= dt; if (g.overT < 0) { endRun(false); return; } }
  else if (g.t >= g.dur) startDawn();
}

function updateDemo(g, dt) {
  g.t += dt;
  g.beamAngle = Math.sin(g.t * 0.45) * 1.2;
  computeBeams(g);
  g.spawnT -= dt;
  if (g.spawnT <= 0) { if (g.ships.length < 4) spawnShip(g, pick(['fishing', 'fishing', 'sail', 'cargo', 'speed'])); g.spawnT = rand(3, 6); }
  updateShips(g, dt);
  tickAmbient(g, dt);
}

function startRun() {
  RUN = { night: 1, score: 0, coins: 0, startBest: S.best };
  startNight(1);
}
function startNight(n) {
  RUN.night = n;
  G = makeWorld(n, false);
  computeBeams(G);
  setScreen('intro');
}
function startDawn() {
  const g = G, mul = 1 + 0.1 * (RUN.night - 1);
  g.dawnT = 0;
  for (const s of g.ships) {
    if (!TYPES[s.type].friendly) continue;
    const b = Math.round(5 * mul);
    g.safe++; g.score += b; RUN.score += b;
    ftext(g, s.x, s.y - 8, 'SAFE +' + b, C.green, rand(0, 0.5));
  }
  for (let i = 0; i < 6; i++) { const fromLeft = Math.random() < 0.5; g.gulls.push({ x: fromLeft ? -rand(5, 60) : W + rand(5, 60), y: rand(30, 110), vx: (fromLeft ? 1 : -1) * rand(18, 28), f: rand(0, 6), ph: rand(0, TAU) }); }
  sfx('dawn');
  setScreen('dawn');
}
function finishNight() {
  const g = G;
  const coins = Math.floor(g.score / 4) + 5;
  UI.sumCoins = coins;
  RUN.coins += coins;
  S.coins += coins;
  S.best = Math.max(S.best, RUN.score);
  S.bestNight = Math.max(S.bestNight, RUN.night);
  save();
  setScreen('summary');
}
function endRun(quit) {
  const g = G;
  const coins = Math.floor(g.score / 4);
  UI.overCoins = RUN.coins + coins;
  UI.quit = !!quit;
  S.coins += coins;
  UI.newBest = RUN.score > RUN.startBest && RUN.score > 0;
  S.best = Math.max(S.best, RUN.score);
  S.bestNight = Math.max(S.bestNight, RUN.night - 1);
  save();
  if (!quit) sfx('over');
  setScreen('gameover');
}

// =====================================================================
// DRAW
// =====================================================================
function dawnAmount(g) {
  if (g.demo) return 0;
  if (g.dawnT >= 0) return clamp(0.9 + g.dawnT * 0.1, 0, 1);
  return smooth(0.62, 1, g.t / g.dur) * 0.9;
}
function drawSky(g, dawn) {
  for (let y = 0; y < HORIZON; y++) {
    const t = y / (HORIZON - 1);
    let c = mix(C.skyNT, C.skyNB, t);
    if (dawn > 0) {
      const p = mix(C.skyPT, C.skyPB, t), o = mix(C.skyOT, C.skyOB, t);
      c = dawn < 0.5 ? mix(c, p, dawn * 2) : mix(p, o, (dawn - 0.5) * 2);
    }
    fb.fill(c, y * W, y * W + W);
  }
  const sv = 1 - dawn * 1.1;
  if (sv > 0) for (const s of g.stars) {
    const tw = 0.5 + 0.5 * Math.sin(g.t * s.sp + s.ph);
    pblend(s.x, s.y, C.star, sv * (0.25 + 0.75 * tw * tw));
  }
  // crescent moon
  const mx = 112, my = 17;
  for (let y = my - 4; y <= my + 4; y++) for (let x = mx - 4; x <= mx + 4; x++) {
    const a = (x + 0.5 - mx) ** 2 + (y + 0.5 - my) ** 2, b = (x + 0.5 - mx - 2) ** 2 + (y + 0.5 - my + 1) ** 2;
    if (a < 13 && b > 9) pblend(x, y, C.moon, 1 - dawn * 0.6);
  }
  glow(mx, my, 8, C.moon, 0.08 * (1 - dawn));
}
function drawSea(g, dawn) {
  for (let y = HORIZON; y < H; y++) {
    let c = mix(C.seaHor, C.seaDeep, Math.min(1, (y - HORIZON) / 50));
    if (dawn > 0) c = mix(c, C.seaDawn, dawn * 0.6);
    fb.fill(c, y * W, y * W + W);
  }
  for (let x = 0; x < W; x++) pblend(x, HORIZON, mix(C.seaHor, C.skyOB, dawn), 0.5);
  const storm = g.weather === 'STORM';
  const wc = storm ? C.waveStorm : C.wave;
  for (const w of g.waves) {
    const v = Math.sin(g.t * (storm ? 2.2 : 1.3) + w.ph);
    if (v < 0.1) continue;
    for (let k = 0; k < w.len; k++) {
      const x = Math.floor(w.x) + k, y = w.y;
      if (x < 0 || x >= W) continue;
      const i = y * W + x;
      if (g.mask[i]) continue;
      const lit = y < LIGHT_ROWS && LM[i] > 0;
      pblend(x, y, lit ? C.waveLit : wc, v * (lit ? 0.9 : 0.7) * (k === 0 || k === w.len - 1 ? 0.6 : 1));
    }
    if (storm && v > 0.85) pblend(Math.floor(w.x) + 1, w.y - 1, C.foamDim, 0.7);
  }
}
function drawRocks(g, dawn) {
  const all = g.flashT > 0 ? 1 : g.flareT > 0 ? 0.85 : 0;
  const base = Math.max(all, dawn * 0.9);
  for (const r of g.rockPix) {
    const l = r.i < W * LIGHT_ROWS && LM[r.i] > 0 ? 1 : 0;
    const v = Math.max(l, base);
    fb[r.i] = v >= 1 ? ROCK_LIT[r.s] : v <= 0 ? ROCK_DARK[r.s] : mix(ROCK_DARK[r.s], ROCK_LIT[r.s], v);
  }
  for (const f of g.foam) {
    const v = Math.sin(g.t * f.sp + f.ph);
    if (v < (f.o ? 0.75 : 0.3)) continue;
    const lit = (f.i < W * LIGHT_ROWS && LM[f.i] > 0) || all > 0;
    const a = (lit ? 0.9 : 0.4) * (f.o ? 0.6 : 1) * Math.min(1, (v - 0.2) * 2);
    blendI(f.i, lit ? C.foam : C.foamDim, Math.max(a, dawn * 0.5));
  }
}
function drawBeam(g) {
  const bc = beamCol();
  const n = W * LIGHT_ROWS;
  for (let i = 0; i < n; i++) {
    const l = LM[i];
    if (l <= 0 || g.mask[i] === 2) continue;
    const x = i % W, y = (i / W) | 0;
    const q = Math.floor(l * 0.55 * 6 + BAYER[((y & 3) << 2) | (x & 3)]) / 6;
    if (q > 0) { blendI(i, bc, q * 0.85); padd(x, y, bc, q * 0.25); }
  }
}
function drawLand(g, dawn) {
  for (const p of g.landPix) {
    const d = Math.hypot(p.x - LAMP_X, p.y - LAMP_Y);
    const k = Math.max(0, 1 - d / 36) * 0.55 + dawn * 0.35 + (g.flashT > 0 ? 0.4 : 0);
    fb[p.i] = k > 0 ? mix(p.c, C.landGlow, k) : p.c;
  }
  // docks and dock lanterns
  const posts = [[27, 0], [42, 0], [83, 1], [98, 1]];
  for (const [x0, e] of posts) {
    for (let y = 184; y < H; y += 2) { pset(x0, y, C.plank); pset(x0 + 1, y, C.plank); pset(x0 + 2, y, C.plank); pset(x0, y + 1, C.post); }
    pset(x0 + 1, 182, C.post); pset(x0 + 1, 183, C.post);
    const fl = g.dockFlash[e];
    const pulse = 0.7 + 0.3 * Math.sin(g.t * 3 + x0);
    pset(x0 + 1, 181, mix(C.lantern, C.white, fl));
    glow(x0 + 1.5, 181.5, 4 + fl * 8, C.lantern, 0.25 * pulse + fl * 0.6);
  }
}
function drawLighthouse(g, x, y, paint, bcol) {
  const pal = paintPal(paint);
  const noOil = !g.demo && g.oil <= 0;
  const pulse = 0.5 + 0.5 * Math.sin(g.t * 3);
  const lampC = noOil ? mix(hex('#3a3020'), bcol, g.flick) : mix(bcol, C.white, 0.25 + 0.2 * pulse);
  pal.y = lampC;
  pal.L = noOil ? mix(hex('#5a4a30'), C.white, g.flick * 0.6) : C.white;
  if (g.keeperOn > 0) pal.w = hex('#2a3060');
  drawSprite(SPR.lighthouse, pal, x, y);
  if (g.keeperOn > 0) { pset(x + 7, y + 12, hex('#e8b890')); pset(x + 8, y + 12, hex('#e8b890')); pset(x + 8, y + 11, hex('#1a1e40')); }
  if (g.crackT > 0) { pset(x + 5, y + 4, C.sil); pset(x + 6, y + 5, C.sil); pset(x + 6, y + 6, C.sil); pset(x + 9, y + 4, C.sil); }
  glow(x + 7.5, y + 5.5, 8 + pulse * 2, bcol, (noOil ? 0.15 * g.flick : 0.35) * (g.crackT > 0 ? g.flick : 1));
}
function drawFog(g) {
  const fc = C.fog, bc = beamCol();
  for (let y = HORIZON - 6; y < H; y++) {
    if (y < 0) continue;
    for (let x = 0; x < W; x++) {
      let dens = 0;
      for (const b of g.fogBlobs) {
        const dx = (x - b.x) / b.rx, dy = (y - b.y) / b.ry, v = 1 - (dx * dx + dy * dy);
        if (v > 0) dens += v;
      }
      dens = Math.min(1, dens);
      const i = y * W + x;
      const l = y < LIGHT_ROWS ? LM[i] : 0;
      let a = 0.1;
      if (BAYER[((y & 3) << 2) | (x & 3)] < dens * 0.95) a += 0.3 + dens * 0.15;
      blendI(i, l > 0 ? mix(fc, bc, 0.5) : fc, a + l * 0.15);
    }
  }
}
function drawRain(g) {
  const wx = g.wind.x + g.gust.x;
  const dx = (wx * 7 - 20) / 150;
  for (const r of g.rain) line(r.x, r.y, r.x + dx * 3, r.y + 3, C.rain, 0.45);
}
function drawShips(g) {
  const dawn = dawnAmount(g);
  for (const s of g.ships) {
    if (s.type === 'ghost' && !s.litVis) continue;
    const vis = s.litVis || dawn > 0.7;
    const fa = s.fade * (s.type === 'ghost' ? 0.6 : 1);
    for (const w of s.wake) {
      const a = (1 - w.a / 1.2) * (vis ? 0.6 : 0.22) * fa;
      pblend(w.x, w.y, C.wake, a);
      if (w.a > 0.25) { const sp = w.a * 2.6; pblend(w.x + w.px * sp, w.y + w.py * sp, C.wake, a * 0.6); pblend(w.x - w.px * sp, w.y - w.py * sp, C.wake, a * 0.6); }
    }
  }
  for (const s of g.ships) {
    const T = TYPES[s.type];
    const vis = s.litVis || dawn > 0.7;
    if (s.type === 'ghost') {
      if (!s.litVis && dawn < 0.7) continue;
      drawSprite(SPR.sail, PAL.ghost, s.x, s.y, { rot: s.h, alpha: (0.45 + 0.15 * Math.sin(g.t * 5)) * s.fade });
    } else {
      const pal = vis ? PAL[s.type] : DARK_PAL[s.type];
      drawSprite(SPR[T.spr], pal, s.x, s.y, { rot: s.h, alpha: s.fade });
      const lo = LANTERN[T.spr];
      if (lo && T.friendly) {
        const ang = Math.round(s.h / (TAU / 32)) * (TAU / 32), ca = Math.cos(ang), sa = Math.sin(ang);
        const lx = Math.round(s.x) + ca * lo.x - sa * lo.y, ly = Math.round(s.y) + sa * lo.x + ca * lo.y;
        glow(lx, ly, 3, C.lantern, 0.3 * s.fade);
      }
    }
    if (g.demo || g.dawnT >= 0) continue;
    if (T.friendly) {
      if (s.type === 'ghost' && !s.litVis) continue;
      const mx = Math.round(s.x) - 4, my = Math.round(s.y) - (s.type === 'cargo' ? 13 : 9);
      const col = s.m < 0.33 ? C.green : s.m < 0.66 ? C.yellow : C.red;
      const blink = s.lost && Math.floor(g.t * 6) % 2 === 0;
      rectA(mx - 1, my - 1, 10, 4, C.black, 0.75);
      rect(mx, my, Math.max(1, Math.round(8 * s.m)), 2, blink ? C.white : col);
      if (s.lost) drawText('!', mx + 10, my - 2, C.red, { shadow: true });
    } else if (s.spot > 0 && s.state === 'sail') {
      const mx = Math.round(s.x) - 4, my = Math.round(s.y) - 10;
      rectA(mx - 1, my - 1, 10, 4, C.black, 0.75);
      rect(mx, my, Math.max(1, Math.round(8 * s.spot / 2)), 2, Math.floor(g.t * 8) % 2 ? C.red : hex('#ff9a9a'));
    } else if (s.state === 'aim') {
      if (Math.floor(g.t * 8) % 2) drawText('!', s.x, s.y - 13, C.red, { align: 'center' });
    }
  }
}
function drawBarrels(g) {
  for (const b of g.barrels) {
    const lit = (b.y < LIGHT_ROWS && LM[Math.floor(b.y) * W + Math.floor(clamp(b.x, 0, W - 1))] > 0) || g.flareT > 0 || g.flashT > 0;
    drawSprite(SPR.barrel, lit ? PAL.barrel : DARK_PAL.barrel, b.x - 2, b.y - 2);
    if (!lit && Math.sin(g.t * 2.5 + b.ph) > 0.85) pset(b.x - 1, b.y - 1, C.oil);
    if (b.litT > 0) rect(b.x - 3, b.y - 6, Math.ceil(7 * Math.min(1, b.litT / 0.5)), 1, C.oil);
  }
}
function drawFx(g) {
  for (const p of g.parts) {
    const a = Math.min(1, p.life / p.max * 1.5) * p.a;
    if (p.type === 'ring') ring(p.x, p.y, p.r, p.c, a * 0.8);
    else pblend(p.x, p.y, p.c, a);
  }
  for (const b of g.balls) { disc(b.x, b.y, 1.3, hex('#20222a')); pset(b.x, b.y - 1, hex('#8088a0')); }
  if (g.flareShot) { pset(g.flareShot.x, g.flareShot.y, C.white); glow(g.flareShot.x, g.flareShot.y, 5, hex('#ff6a8a'), 0.6); }
  if (g.flareT > 0 && g.flarePos) { pset(g.flarePos.x, g.flarePos.y, C.white); glow(g.flarePos.x, g.flarePos.y, 10, hex('#ff8aa0'), 0.7 * Math.min(1, g.flareT)); }
  for (const gl of g.gulls) drawSprite(Math.floor(gl.f) % 2 ? SPR.gull1 : SPR.gull2, PAL.gull, gl.x, gl.y, { flip: gl.vx < 0 });
  for (const t of g.texts) {
    if (t.delay > 0) continue;
    const w = textW(t.s);
    const x = clamp(t.x, w / 2 + 1, W - w / 2 - 1);
    drawText(t.s, x, Math.round(t.y), t.c, { align: 'center', alpha: Math.min(1, t.life / t.max * 2) });
  }
}
function drawOverlays(g) {
  if (g.flareT > 0) rectA(0, 0, W, H, hex('#ffd0d8'), 0.12 * Math.min(1, g.flareT));
  if (g.flashT > 0) {
    rectA(0, 0, W, H, C.white, 0.5 * (g.flashT / 0.4));
    if (g.bolt && g.flashT > 0.2) for (let k = 1; k < g.bolt.length; k++) line(g.bolt[k - 1][0], g.bolt[k - 1][1], g.bolt[k][0], g.bolt[k][1], C.white, 1);
  }
  if (g.hornT > 0 && Math.floor(g.t * 4) % 2) drawText('SLOW', LAMP_X, 140, C.cyan, { align: 'center', alpha: 0.6 });
}

function drawWorld(g) {
  const dawn = dawnAmount(g);
  computeLight(g);
  drawSky(g, dawn);
  drawSea(g, dawn);
  drawRocks(g, dawn);
  drawBarrels(g);
  drawBeam(g);
  drawLand(g, dawn);
  drawLighthouse(g, LH_X, LH_Y, S.paint, beamCol());
  if (g.weather === 'FOG') drawFog(g);

  if (g.weather === 'STORM') drawRain(g);

  drawOverlays(g);

function clockStr(g) {
  const mins = Math.min(540, Math.floor(clamp(g.t / g.dur, 0, 1) * 54) * 10);
  const h24 = 21 + Math.floor(mins / 60);
  const h12 = ((h24 + 11) % 12) + 1;
  const mm = String(mins % 60).padStart(2, '0');
  return h12 + ':' + mm + ((h24 % 24) >= 12 ? 'PM' : 'AM');
}
function drawHUD(g) {
  rectA(0, 0, W, 15, C.black, 0.35);
  drawText('N' + RUN.night, 2, 1, C.white);
  drawText(clockStr(g), 64, 1, C.clock, { align: 'center' });
  drawText(String(RUN.score), 116, 1, C.gold, { align: 'right' });
  rect(120, 1, 2, 5, C.dim); rect(123, 1, 2, 5, C.dim);
  regions.push(PAUSE_BTN);
  // oil
  const low = g.oil / g.oilMax < 0.2;
  const oilC = low && Math.floor(g.t * 4) % 2 ? C.red : C.oil;
  icon('drop', 2, 8, oilC);
  outline(6, 8, 22, 5, C.dim, 0.8);
  rect(7, 9, Math.round(20 * g.oil / g.oilMax), 3, oilC);

function drawTouchButtons(g) {

// --- how to play pages ---
function miniBeam(x0, y0, ang, half, reach, clip) {
  const bc = beamCol();
  for (let y = clip.y; y < clip.y + clip.h; y++) for (let x = clip.x; x < clip.x + clip.w; x++) {
    const dx = x + 0.5 - x0, dy = y + 0.5 - y0, d = Math.hypot(dx, dy);
    if (d > reach || d < 1) continue;
    const diff = Math.abs(Math.atan2(dx, -dy) - ang);
    if (diff > half) continue;
    const bt = BAYER[((y & 3) << 2) | (x & 3)];
    if (diff > half * 0.7 && bt > (half - diff) / (half * 0.3)) continue;
    const q = Math.floor((1 - d / reach) * 0.5 * 6 + bt) / 6;
    if (q > 0) pblend(x, y, bc, q);
  }
}

// --- shop ---
function shopDone() {
  sfx('sel');
  if (UI.shopFrom === 'summary') startNight(RUN.night + 1);
  else setScreen('title');
}
function shopMsg(m) { UI.shopMsg = m; UI.shopMsgT = 2; }
function shopCycle(row, d) {
  if (row === 5) { UI.paintView = (UI.paintView + PAINTS.length + d) % PAINTS.length; sfx('sel'); }
  else if (row === 6) { UI.beamView = (UI.beamView + BEAMS.length + d) % BEAMS.length; sfx('sel'); }
}
function shopActivate(row) {
  if (row < 5) {
    const u = UPGRADES[row], lvl = S.up[u.id];
    if (lvl >= u.prices.length) { shopMsg('ALREADY MAXED'); sfx('no'); return; }
    const price = u.prices[lvl];
    if (S.coins < price) { shopMsg('NOT ENOUGH COINS'); sfx('no'); return; }
    S.coins -= price; S.up[u.id]++; save();
    shopMsg('BOUGHT!'); sfx('ok');
  } else if (row === 5 || row === 6) {
    const isPaint = row === 5;
    const v = isPaint ? UI.paintView : UI.beamView;
    const owned = isPaint ? S.paints : S.beams;
    if (owned.includes(v)) {
      if (isPaint) S.paint = v; else S.beam = v;
      save(); shopMsg('EQUIPPED'); sfx('ok');
      return;
    }
    const price = isPaint ? PAINT_PRICE : BEAM_PRICE;
    if (S.coins < price) { shopMsg('NOT ENOUGH COINS'); sfx('no'); return; }
    S.coins -= price; owned.push(v);
    if (isPaint) S.paint = v; else S.beam = v;
    save(); shopMsg('BOUGHT!'); sfx('ok');
  } else shopDone();
}

    } else {

      const equipped = (isPaint ? S.paint : S.beam) === v;

      if (equipped) drawText('IN USE', 122, y + 3, C.green, { align: 'right' });

      else coinText(isPaint ? PAINT_PRICE : BEAM_PRICE, 122, y + 3, 'right');

  rect(4, 148, 54, 42, C.seaDeep); outline(4, 148, 54, 42, C.faint);
  const pv = UI.shopSel === 5 ? UI.paintView : S.paint;
  const bv = UI.shopSel === 6 ? UI.beamView : S.beam;
  const bc = beamCol(bv);
  for (let y = 149; y < 172; y++) for (let x = 5; x < 57; x++) {
    const dx = x + 0.5 - 24, dy = y + 0.5 - 159, d = Math.hypot(dx, dy);
    const diff = Math.abs(Math.atan2(dx, -dy) - 0.75 - Math.sin(scrT) * 0.2);
    if (diff > 0.26 || d > 40 || d < 2) continue;
    const bt = BAYER[((y & 3) << 2) | (x & 3)];
    if (diff > 0.18 && bt > (0.26 - diff) / 0.08) continue;
    const q = Math.floor((1 - d / 40) * 0.5 * 6 + bt) / 6;
    if (q > 0) pblend(x, y, bc, q);
  }
  rect(5, 182, 52, 7, C.land);
  const pg = { demo: true, t: scrT, oil: 1, flick: 1, keeperOn: 0, crackT: 0 };
  drawLighthouse(pg, 17, 154, pv, bc);
  drawText(UI.shopMsgT > 0 ? UI.shopMsg : (UI.shopSel < 7 ? (isTouch ? 'TAP AGAIN TO BUY' : 'ENTER TO BUY') : ''), 92, 154, UI.shopMsg === 'NOT ENOUGH COINS' && UI.shopMsgT > 0 ? C.red : C.dim, { align: 'center' });
  button('done', UI.shopFrom === 'summary' ? 'NEXT NIGHT' : 'DONE', 64, 172, 58, 14, UI.shopSel === 7);
}

// =====================================================================
// MAIN LOOP
// =====================================================================
function update(dt) {
  SCREENS[screen].update(dt);
  scrT += dt;
}
function draw() {
  regions = [];
  SCREENS[screen].draw();
  let sx = 0, sy = 0;
  const g = screen === 'title' || screen === 'howto' ? DEMO : G;
  if (g && g.shakeT > 0 && screen !== 'pause') { sx = Math.round(rand(-g.shakeM, g.shakeM)); sy = Math.round(rand(-g.shakeM, g.shakeM)); }
  present(sx, sy);
}
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 8) {
    update(STEP);
    acc -= STEP; steps++;
    pressed.clear(); taps = [];
  }
  if (steps >= 8) acc = 0;
  draw();
}

resize();
setScreen('title');
requestAnimationFrame(frame);

})();
</script>
