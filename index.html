    splash() { this.noise(0.3, 0.35, 900); },
    snag() { this.tone(180, 0.15, 'square', 0.1, 90); this.noise(0.1, 0.2, 600); },
    push() { this.tone(240, 0.08, 'square', 0.08, 160); },
    catch(n) { this.tone(520 + n * 45, 0.07, 'square', 0.08); this.tone((520 + n * 45) * 1.5, 0.08, 'square', 0.06, null, 0.05); },
    zap() { this.noise(0.25, 0.3, 4000); this.tone(1200, 0.2, 'sawtooth', 0.07, 200); },
    full() { [784, 988, 1175].forEach((f, i) => this.tone(f, 0.09, 'square', 0.07, null, i * 0.06)); },
    coin(i) { this.tone(988 + (i % 6) * 60, 0.06, 'square', 0.05); this.tone(1319 + (i % 6) * 60, 0.08, 'square', 0.05, null, 0.04); },
    flop() { this.noise(0.08, 0.25, 1500); this.tone(160, 0.06, 'triangle', 0.06, 110); },
    meow() { this.tone(700, 0.18, 'triangle', 0.05, 1000); this.tone(1000, 0.15, 'triangle', 0.04, 600, 0.15); },
    zone() { [392, 523, 659].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.09, null, i * 0.09)); },
    unlock() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.15, 'square', 0.08, null, i * 0.1)); },
  };

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  const keys = new Set();
  const pressed = new Set();
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Enter: 'ok', Space: 'ok',
    KeyP: 'pause', Escape: 'back',
    KeyM: 'mute',
  };
  addEventListener('keydown', (e) => {
    const a = KEYMAP[e.code];
    if (!a) return;
    e.preventDefault();
    sfx.init();
    if (!keys.has(a)) pressed.add(a);
    keys.add(a);
    pointer.follow = false;
  });
  addEventListener('keyup', (e) => {
    const a = KEYMAP[e.code];
    if (a) keys.delete(a);
  });
  addEventListener('blur', () => keys.clear());

  // Pointer: tap buttons in menus; while fishing the hook chases the finger
  // (or the mouse while it moves over the game).
  const pointer = { x: 64, y: 96, down: false, follow: false, taps: [] };
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.init();
    const p = toGame(e);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.down = true;
    pointer.follow = true;
    pointer.taps.push(p);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = toGame(e);
    pointer.x = p.x;
    pointer.y = p.y;
    if (pointer.down || e.pointerType === 'mouse') pointer.follow = true;
  });
  const release = (e) => {
    pointer.down = false;
    if (e.pointerType !== 'mouse') pointer.follow = false;
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Buttons drawn this frame, so taps can find them next frame.
  let buttons = [];
  function button(x, y, w, h, label, act, opts = {}) {
    buttons.push({ x, y, w, h, act });
    const sel = opts.selected;
    const lift = sel ? Math.round(Math.sin(time * 6)) * 0.5 : 0;
    y += lift;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x + 1, y + 1, w, h);
    ctx.fillStyle = opts.bg || (sel ? '#2a5a8a' : '#123050');
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = sel ? '#3a6a9a' : '#1a4060';
    ctx.fillRect(x + 1, y + 1, w - 2, 1);
    ctx.fillStyle = sel ? '#ffe070' : '#5a8ab8';
    ctx.fillRect(x, y, w, 1);
    ctx.fillRect(x, y + h - 1, w, 1);
    ctx.fillRect(x, y, 1, h);
    ctx.fillRect(x + w - 1, y, 1, h);
    if (label) {
      const s = opts.scale || 1;
      drawText(label, x + w / 2, Math.round(y + (h - 5 * s) / 2), opts.color || (sel ? '#ffe070' : '#fff'), s, 'center');
    }
  }
  function tappedButton() {
    for (const t of pointer.taps) {
      for (const b of buttons) {
        if (t.x >= b.x && t.x < b.x + b.w && t.y >= b.y && t.y < b.y + b.h) return b.act;
      }
    }
    return null;
  }

  // ---------------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------------
  let state = 'title';
  let pausedFrom = null;
  let time = 0;
  let camY = TITLE_CAM;
  let shake = 0;
  let flash = 0;
  let menuSel = 0;
  let shopSel = 0;
  let logPage = 0;
  let fish = [];
  let bubbles = [];
  let popups = [];
  let flyers = [];
  let ripples = [];
  let coins = [];
  let banner = null;
  let report = null;
  let shopMsg = null;
  let moneyBump = 0;

  const hook = { x: 86, y: -8, vy: 0 };
  const run = {
    maxY: 0, catch: [], pushes: 0, deepest: 0, zone: 0, full: false, floor: false,
    newSpecies: [], record: false, hint: 0, castT: 0,
  };
  const boatFx = { crate: 0, crateBounce: 0, cat: 0, catMeow: 0 };
  const gulls = [
    { x: 20, y: -52, vx: 9, ph: 0 },
    { x: 100, y: -46, vx: -7, ph: 2 },
  ];

  const lv = save.lv;
  const lineMaxY = () => Math.min(LINE_M[lv.line] * PPM, FLOOR_Y - 4);
  const capacity = () => HOOK_CAP[lv.hook];

  // Rock walls close in as you go deeper. Width in world units at a world y.
  function wallWidth(y) {
    const m = y / PPM;
    if (m < 160) return 0;
    let w = m < 1100 ? 2 + (m - 160) / 940 * 5 : 7 + (m - 1100) / 600 * 7;
    w += (hash(Math.floor(y / 6), 7) - 0.5) * 3;
    return Math.max(0, Math.round(w));
  }

  // ---------------------------------------------------------------------------
  // The fisherman and his rod
  // ---------------------------------------------------------------------------
  const boatBob = () => Math.sin(time * 2) * 0.6;

  // The rod's angle, bend and the fisherman's mood follow the game state.
  function pose() {
    const st = state === 'pause' ? pausedFrom : state;
    let ang = -0.62 + Math.sin(time * 1.3) * 0.03, bend = 0.5, mood = 'idle';
    if (st === 'drop' && run.castT < 0.45) {
      const t = run.castT;
      ang = t < 0.15 ? lerp(-0.62, -2.2, t / 0.15) : lerp(-2.2, -0.45, Math.min(1, (t - 0.15) / 0.2));
      bend = t < 0.15 ? -2 : 2;
      mood = 'cast';
    } else if (st === 'drop') {
      ang = -0.5 + Math.sin(time * 7) * 0.015;
      bend = 1.5;
      mood = 'watch';
    } else if (st === 'reel') {
      ang = -0.8 + Math.sin(time * 9) * 0.04;
      bend = Math.min(7, 3 + run.catch.length * 0.4);
      mood = 'reel';
    } else if (st === 'haul') {
      ang = -1.2;
      bend = 0;
      mood = run.catch.length ? 'cheer' : 'sad';
    } else if (st === 'report') {
      mood = report && report.total > 0 ? 'happy' : 'sad';
    }
    return { ang, bend, mood };
  }

  // Rod in world units: butt, the grip the front hand holds, the tip.
  function rodGeom() {
    const p = pose();
    const by = boatBob();
    const px = BOAT_X + 26.5, py = -12.5 + by;
    const dx = Math.cos(p.ang), dy = Math.sin(p.ang);
    const nx = -dy, ny = dx;
    const butt = { x: px - dx * 5, y: py - dy * 5 };
    const end = { x: px + dx * (ROD_LEN - 5), y: py + dy * (ROD_LEN - 5) };
    const tip = { x: end.x + nx * p.bend * 0.8, y: end.y + ny * p.bend * 0.8 };
    const ctl = { x: (butt.x + end.x) / 2 + nx * p.bend, y: (butt.y + end.y) / 2 + ny * p.bend };
    return { p, butt, ctl, tip, grip: { x: px, y: py }, dx, dy, nx, ny };
  }
  const rodPoint = (g, t) => ({
    x: (1 - t) * (1 - t) * g.butt.x + 2 * (1 - t) * t * g.ctl.x + t * t * g.tip.x,
    y: (1 - t) * (1 - t) * g.butt.y + 2 * (1 - t) * t * g.ctl.y + t * t * g.tip.y,
  });

  // ---------------------------------------------------------------------------
  // The fish world
  // ---------------------------------------------------------------------------
  function pickSpecies(m) {
    let total = 0;
    const opts = [];
    for (const sp of SPECIES) {
      if (m < sp.min || m > sp.max) continue;
      const mid = (sp.min + sp.max) / 2, half = (sp.max - sp.min) / 2;
      const w = 1 - Math.abs(m - mid) / half * 0.7;
      opts.push([sp, w]);
      total += w;
    }
    let r = Math.random() * total;
    for (const [sp, w] of opts) {
      r -= w;
      if (r < 0) return sp;
    }
    return opts.length ? opts[opts.length - 1][0] : SPECIES[0];
  }

  function jellyChance(m) {
    if (m < 110) return 0;
    if (m < 350) return 0.08;
    if (m < 1100) return 0.12;
    return 0.15;
  }

  function makeFish(y) {
    const m = y / PPM;
    if (Math.random() < jellyChance(m)) {
      return {
        jelly: true, deep: m > 350, x: rand(12, W - 12), y, baseY: y, w: 7, h: 6,
        vx: rand(-6, 6), phase: rand(0, 6), stun: 0,
      };
    }
    const sp = pickSpecies(m);
    const dir = Math.random() < 0.5 ? -1 : 1;
    return {
      sp, x: rand(10, W - 10), y, baseY: y, w: sp.w, h: sp.h,
      vx: dir * sp.speed * rand(0.6, 1.2), phase: rand(0, 4), stun: 0, turn: rand(3, 12),
      golden: Math.random() < 0.015 + lv.bait * 0.006,
    };
  }

  function spawnFish(y0, y1) {
    const list = [];
    let y = y0;
    while (true) {
      y += rand(9, 16);
      if (y > y1) break;
      list.push(makeFish(y));
    }
    return list;
  }

  function updateFish(dt) {
    const viewTop = camY - 20, viewBot = camY + H + 20;
    for (const f of fish) {
      if (f.caught) continue;
      if (f.stun > 0) f.stun -= dt;
      if (f.jelly) {
        // Jellies rise with each pulse of the bell
        f.y = f.baseY + Math.sin(time * 1.6 + f.phase) * 3;
        f.x += f.vx * dt;
        if (f.x < 8 || f.x > W - 8) f.vx = -f.vx;
        continue;
      }
      f.x += f.vx * dt;
      if (f.knock) {
        f.knock *= Math.pow(0.05, dt);
        f.x += f.knock * dt;
      }
      // Now and then a fish turns around
      f.turn -= dt;
      if (f.turn <= 0) {
        f.turn = rand(4, 14);
        f.vx = -f.vx;
      }
      const m = f.w / 2 + 6;
      if (f.x > W + m) f.x = -m;
      if (f.x < -m) f.x = W + m;
      f.y = f.baseY + Math.sin(time * 2 + f.phase) * 1;
      if (f.y > viewTop && f.y < viewBot && f.y > 4 && Math.random() < dt * 0.15) {
        const nose = f.x + (f.vx >= 0 ? f.w / 2 + 1 : -f.w / 2 - 1);
        bubbles.push({ x: nose, y: f.y - 1, vx: 0, vy: -rand(10, 18), life: rand(0.8, 1.6) });
      }
    }
  }

  const hookBox = () => ({ x: hook.x - 3, y: hook.y - 6, w: 5, h: 7 });
  function hits(f, box, sweep = 0) {
    const fx = f.x - f.w / 2, fy = f.y - f.h / 2, fw = f.w, fh = f.h;
    const by = sweep < 0 ? box.y + sweep : box.y;
    const bh = box.h + Math.abs(sweep);
    return fx < box.x + box.w && fx + fw > box.x && fy < by + bh && fy + fh > by;
  }

  // ---------------------------------------------------------------------------
  // Flow
  // ---------------------------------------------------------------------------
  function toTitle() {
    state = 'title';
    fish = spawnFish(16, 260);
    hook.vy = 0;
    flyers = [];
    popups = [];
    coins = [];
    run.catch = [];
  }

  function startCast() {
    state = 'drop';
    save.dives++;
    run.maxY = lineMaxY();
    fish = spawnFish(20, Math.min(run.maxY + 260, FLOOR_Y - 12));
    run.catch = [];
    run.pushes = POLE_PUSH[lv.pole];
    run.deepest = 0;
    run.zone = 0;
    run.full = false;
    run.floor = false;
    run.newSpecies = [];
    run.record = false;
    run.castT = 0;
    run.hint = save.dives <= 2 ? 3 : 0;
    hook.vy = 0;
    popups = [];
    banner = null;
    sfx.cast();
  }

  function startReel(text, color) {
    state = 'reel';
    hook.vy = 0;
    if (text) popup(hook.x, hook.y - 10, text, color || '#ffe070');
    if (run.hint) run.hint = 3;
  }

  function splashAt(x, n = 8) {
    for (let i = 0; i < n; i++) bubbles.push({ x: x + rand(-4, 4), y: -1, vx: rand(-30, 30), vy: rand(-60, -20), life: 0.6, drop: true });
    ripples.push({ x, t: 0 });
  }

  function startHaul() {
    state = 'haul';
    sfx.splash();
    splashAt(hook.x, 10);
    flyers = run.catch.map((f, i) => ({ f, x: hook.x, y: 0, vx: 0, vy: 0, t: 0, delay: i * 0.14, launched: false, done: false }));
    report = { total: 0, popped: 0, groups: {}, timer: 0 };
    boatFx.crate = 0;
    for (const f of run.catch) f.value = Math.round(f.sp.value * (f.golden ? 5 : 1) * BAIT_VALUE[lv.bait]);
  }

  function finishHaul() {
    state = 'report';
    const r = report;
    if (run.floor && !save.chest) {
      save.chest = true;
      r.chest = true;
      save.money += CHEST_BONUS;
      sfx.unlock();
    }
    const depthM = Math.floor(run.deepest / PPM);
    if (depthM > save.best) {
      save.best = depthM;
      r.record = true;
    }
    r.depth = depthM;
    persist();
  }

  function popup(x, y, text, color = '#fff', life = 1) {
    const stacked = popups.filter((p) => p.t < 0.6).length;
    popups.push({ x, y: y - stacked * 8, text, color, t: 0, life });
  }

  function steer(dt) {
    const speed = 110 * POLE_SPEED[lv.pole];
    let dx = 0;
    if (keys.has('left')) dx -= 1;
    if (keys.has('right')) dx += 1;
    if (dx) {
      hook.x += dx * speed * dt;
    } else if (pointer.follow) {
      const d = pointer.x - hook.x;
      hook.x += clamp(d, -speed * 1.6 * dt, speed * 1.6 * dt);
    }
    const wl = Math.max(wallWidth(hook.y), wallWidth(hook.y - 8));
    hook.x = clamp(hook.x, wl + 5, W - wl - 3);
  }

  function checkZone() {
    const m = hook.y / PPM;
    const z = zoneIndex(m);
    if (z > run.zone) {
      run.zone = z;
      const fresh = z >= save.zones;
      if (fresh) save.zones = z + 1;
      banner = { text: ZONES[z].name, sub: fresh ? 'NEW ZONE!' : '', color: ZONES[z].color, t: 0 };
      if (fresh) sfx.zone();
    }
  }

  function updateDrop(dt) {
    run.castT += dt;
    if (run.castT < 0.32) {
      // Still swinging the rod: the hook rides along at the tip
      const g = rodGeom();
      hook.x = g.tip.x;
      hook.y = g.tip.y + 2;
      hook.vy = -40;
      return;
    }
    steer(dt);
    const prevY = hook.y;
    if (hook.y < 0) {
      hook.vy += 400 * dt;
      hook.y += hook.vy * dt;
      if (hook.y >= 0) {
        sfx.splash();
        splashAt(hook.x);
      }
      return;
    }
    const speed = (70 + hook.y * 0.06) * POLE_SPEED[lv.pole];
    hook.vy = speed;
    hook.y += speed * dt;
    if (Math.random() < dt * 12) bubbles.push({ x: hook.x + rand(-2, 2), y: hook.y - 8, vx: 0, vy: -rand(15, 30), life: rand(0.6, 1.2) });
    run.deepest = Math.max(run.deepest, hook.y);
    checkZone();

    if (hook.y >= run.maxY) {
      hook.y = run.maxY;
      run.deepest = hook.y;
      if (run.maxY >= FLOOR_Y - 4) {
        run.floor = true;
        startReel(save.chest ? 'THE BOTTOM!' : 'TREASURE!', '#ffe070');
        if (!save.chest) sfx.unlock();
        for (let i = 0; i < 12; i++) bubbles.push({ x: hook.x + rand(-6, 6), y: hook.y, vx: rand(-10, 10), vy: -rand(10, 40), life: rand(0.5, 1.2) });
      } else {
        startReel('LINE MAX!', '#8fe0ff');
      }
      sfx.snag();
      return;
    }

    if (hook.y < 16) return; // a moment of grace after the splash
    const box = hookBox();
    for (const f of fish) {
      if (f.caught || f.stun > 0) continue;
      if (!hits(f, box, prevY - hook.y)) continue;
      if (run.pushes > 0) {
        run.pushes--;
        f.stun = 1;
        f.knock = (f.x < hook.x ? -1 : 1) * 160;
        if (!f.jelly) f.vx = Math.sign(f.knock) * Math.abs(f.vx);
        popup(hook.x, hook.y - 8, 'PUSH!', '#a0f0a0', 0.6);
        sfx.push();
        shake = 0.1;
        continue;
      }
      shake = 0.25;
      if (f.jelly) {
        flash = 0.15;
        sfx.zap();
        startReel('ZAPPED!', '#7ae0ff');
      } else {
        sfx.snag();
        startReel('SNAGGED!', '#ff9a7a');
      }
      return;
    }
  }

  function updateReel(dt) {
    steer(dt);
    const speed = (90 + hook.y * 0.07) * POLE_SPEED[lv.pole] * (run.full ? 1.8 : 1);
    const prevY = hook.y;
    hook.y -= speed * dt;
    if (Math.random() < dt * 8) bubbles.push({ x: hook.x + rand(-2, 2), y: hook.y, vx: 0, vy: -rand(15, 30), life: rand(0.6, 1.2) });
    const box = hookBox();
    const pull = BAIT_PULL[lv.bait];
    for (const f of fish) {
      if (f.caught || f.stun > 0) continue;
      if (!f.jelly && !run.full && pull) {
        const dy = f.y - hook.y;
        if (Math.abs(dy) < pull && Math.abs(f.x - hook.x) < pull * 2.2) {
          f.x += clamp(hook.x - f.x, -50 * dt, 50 * dt);
          f.vx = Math.abs(f.vx) * Math.sign(hook.x - f.x || 1);
        }
      }
      if (!hits(f, box, prevY - hook.y)) continue;
      if (f.jelly) {
        f.stun = 1.2;
        flash = 0.15;
        shake = 0.2;
        sfx.zap();
        const lost = run.catch.pop();
        if (lost) {
          lost.caught = false;
          lost.baseY = hook.y + 6;
          lost.x = hook.x;
          lost.stun = 1.5;
          lost.vx = (Math.random() < 0.5 ? -1 : 1) * 40;
          if (run.full) run.full = false;
          popup(hook.x, hook.y - 8, 'ZAP! ONE GOT AWAY', '#7ae0ff');
        } else {
          popup(hook.x, hook.y - 8, 'ZAP!', '#7ae0ff', 0.6);
        }
        continue;
      }
      if (run.full) continue;
      f.caught = true;
      run.catch.push(f);
      sfx.catch(run.catch.length);
      for (let i = 0; i < 4; i++) bubbles.push({ x: hook.x + rand(-3, 3), y: hook.y + rand(0, 4), vx: rand(-8, 8), vy: -rand(15, 35), life: rand(0.4, 0.9) });
      if (!save.caught[f.sp.id] && !run.newSpecies.includes(f.sp)) {
        run.newSpecies.push(f.sp);
        popup(hook.x, hook.y - 10, 'NEW: ' + f.sp.name, '#ffe070', 1.4);
      } else if (f.golden) {
        popup(hook.x, hook.y - 10, 'GOLDEN!', '#f2c200', 1.2);
      }
      if (run.catch.length >= capacity()) {
        run.full = true;
        sfx.full();
        popup(hook.x, hook.y - 16, 'HOOK FULL!', '#ffe070', 1.2);
      }
    }
    if (hook.y <= 0) {
      hook.y = 0;
      for (const f of run.catch) {
        save.caught[f.sp.id] = (save.caught[f.sp.id] || 0) + 1;
        if (f.golden) save.golden[f.sp.id] = (save.golden[f.sp.id] || 0) + 1;
      }
      startHaul();
    }
  }

  function updateHaul(dt) {
    const g = rodGeom();
    hook.x = lerp(hook.x, g.tip.x, Math.min(1, dt * 5));
    hook.y = lerp(hook.y, g.tip.y + 12, Math.min(1, dt * 5));
    report.timer += dt;
    const crateX = BOAT_X + 7.5;
    let allDone = true;
    for (const fl of flyers) {
      if (fl.done) continue;
      allDone = false;
      if (!fl.launched) {
        fl.delay -= dt;
        if (fl.delay > 0) continue;
        fl.launched = true;
        fl.x = hook.x;
        fl.y = Math.min(hook.y, 0);
        // Toss in an arc that lands in the crate
        fl.vy = -rand(95, 115);
        const drop = -13 - fl.y;
        const tLand = (-fl.vy + Math.sqrt(fl.vy * fl.vy + 600 * drop)) / 300;
        fl.vx = (crateX - fl.x) / tLand;
        sfx.flop();
      }
      fl.t += dt;
      fl.vy += 300 * dt;
      fl.x += fl.vx * dt;
      fl.y += fl.vy * dt;
      if (fl.vy > 0 && fl.y > -13) {
        fl.done = true;
        const f = fl.f;
        report.total += f.value;
        save.money += f.value;
        const gr = report.groups[f.sp.id] || (report.groups[f.sp.id] = { sp: f.sp, n: 0, value: 0, golden: 0 });
        gr.n++;
        gr.value += f.value;
        if (f.golden) gr.golden++;
        popup(fl.x, fl.y - 6, '+$' + fmt(f.value), f.golden ? '#f2c200' : '#a0f0a0', 0.9);
        sfx.coin(report.popped++);
        boatFx.crate++;
        boatFx.crateBounce = 0.25;
        if (boatFx.cat <= 0) boatFx.cat = 0.5;
        if (report.popped === 1 || f.golden) {
          boatFx.catMeow = 0.8;
          sfx.meow();
        }
        const sx = fl.x, sy = fl.y - camY;
        for (let i = 0; i < Math.min(4, 1 + Math.floor(f.value / 50)); i++) {
          coins.push({ x: sx, y: sy, vx: rand(-30, 30), vy: rand(-60, -30), t: -i * 0.05 });
        }
      }
    }
    if (allDone && report.timer > 0.6) finishHaul();
  }

  function updateCamera(dt) {
    let target = TITLE_CAM;
    if (state === 'drop' && hook.y > 0) target = hook.y - 56 + hook.vy / 12;
    else if (state === 'reel') target = hook.y - 128;
    target = Math.max(TITLE_CAM, Math.min(target, FLOOR_Y + 16 - H));
    camY += (target - camY) * Math.min(1, dt * 12);
  }

  // ---------------------------------------------------------------------------
  // Menus
  // ---------------------------------------------------------------------------
  function buy(i) {
    const u = UPGRADES[i];
    const l = lv[u.id];
    if (l >= u.prices.length) {
      shopMsg = { text: 'ALREADY MAXED', color: '#ffe070', t: 0 };
      sfx.buzz();
      return;
    }
    const price = u.prices[l];
    if (save.money < price) {
      shopMsg = { text: 'NEED $' + fmt(price - save.money) + ' MORE', color: '#ff7a7a', t: 0 };
      sfx.buzz();
      return;
    }
    save.money -= price;
    lv[u.id]++;
    persist();
    shopMsg = { text: u.name + ' UPGRADED!', color: '#a0f0a0', t: 0, bought: i };
    sfx.unlock();
  }

  function update(dt) {
    time += dt;
    if (pressed.has('mute')) sfx.setMuted(!sfx.muted);
    const tap = tappedButton();

    if (state === 'pause') {
      if (pressed.has('pause') || pressed.has('back') || pressed.has('ok') || tap === 'resume') state = pausedFrom;
      else if (tap === 'quit') toTitle();
      return;
    }

    if ((state === 'drop' || state === 'reel') && (pressed.has('pause') || pressed.has('back') || tap === 'pause')) {
      pausedFrom = state;
      state = 'pause';
      return;
    }

    updateFish(dt);

    if (state === 'title' || state === 'report') {
      // Bait dangles from the rod tip
      const g = rodGeom();
      hook.x = g.tip.x + Math.sin(time * 1.7) * 0.6;
      hook.y = g.tip.y + 13;
    }

    if (state === 'title') {
      if (pressed.has('left') || pressed.has('up')) { menuSel = (menuSel + 2) % 3; sfx.blip(); }
      if (pressed.has('right') || pressed.has('down')) { menuSel = (menuSel + 1) % 3; sfx.blip(); }
      let act = tap;
      if (pressed.has('ok')) act = ['cast', 'shop', 'log'][menuSel];
      if (act === 'cast') startCast();
      else if (act === 'shop') { state = 'shop'; shopMsg = null; sfx.blip(); }
      else if (act === 'log') { state = 'log'; logPage = 0; sfx.blip(); }
    } else if (state === 'drop') {
      updateDrop(dt);
    } else if (state === 'reel') {
      updateReel(dt);
    } else if (state === 'haul') {
      updateHaul(dt);
    } else if (state === 'report') {
      if (pressed.has('ok') || pressed.has('back') || tap) toTitle();
    } else if (state === 'shop') {
      if (pressed.has('up')) { shopSel = (shopSel + UPGRADES.length) % (UPGRADES.length + 1); sfx.blip(); }
      if (pressed.has('down')) { shopSel = (shopSel + 1) % (UPGRADES.length + 1); sfx.blip(); }
      if (tap === 'back' || pressed.has('back') || (pressed.has('ok') && shopSel === UPGRADES.length)) {
        state = 'title';
        menuSel = 0;
        sfx.blip();
      } else if (typeof tap === 'number') {
        shopSel = tap;
        buy(tap);
      } else if (pressed.has('ok')) {
        buy(shopSel);
      }
      if (shopMsg) shopMsg.t += dt;
    } else if (state === 'log') {
      const pages = Math.ceil(SPECIES.length / 7);
      if (pressed.has('left') || tap === 'prev') { logPage = (logPage + pages - 1) % pages; sfx.blip(); }
      if (pressed.has('right') || tap === 'next') { logPage = (logPage + 1) % pages; sfx.blip(); }
      if (pressed.has('back') || pressed.has('ok') || tap === 'back') { state = 'title'; menuSel = 2; sfx.blip(); }
    }

    // Effects
    for (const b of bubbles) {
      b.life -= dt;
      b.x += (b.vx || 0) * dt + Math.sin(time * 6 + b.y) * 0.1;
      b.y += b.vy * dt;
      if (b.drop) b.vy += 200 * dt;
      else if (b.y < 0) b.life = 0;
    }
    bubbles = bubbles.filter((b) => b.life > 0);
    for (const r of ripples) r.t += dt;
    ripples = ripples.filter((r) => r.t < 1.2);
    for (const c of coins) {
      c.t += dt;
      if (c.t < 0) continue;
      if (c.t < 0.3) {
        c.vy += 200 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
      } else {
        // Fly to the cash counter at the top of the screen
        c.x = lerp(c.x, W / 2, Math.min(1, dt * 8));
        c.y = lerp(c.y, 8, Math.min(1, dt * 8));
        if (Math.abs(c.y - 8) < 2) {
          c.done = true;
          moneyBump = 0.15;
        }
      }
    }
    coins = coins.filter((c) => !c.done);
    for (const p of popups) p.t += dt;
    popups = popups.filter((p) => p.t < p.life);
    if (banner) {
      banner.t += dt;
      if (banner.t > 2.2) banner = null;
    }
    for (const g of gulls) {
      g.x += g.vx * dt;
      g.ph += dt * 6;
      if (g.x > W + 20) { g.x = -20; g.y = rand(-58, -42); }
      if (g.x < -20) { g.x = W + 20; g.y = rand(-58, -42); }
    }
    boatFx.cat = Math.max(0, boatFx.cat - dt);
    boatFx.catMeow = Math.max(0, boatFx.catMeow - dt);
    boatFx.crateBounce = Math.max(0, boatFx.crateBounce - dt);
    moneyBump = Math.max(0, moneyBump - dt);
    if (run.hint && (state === 'drop' || state === 'reel')) run.hint = Math.max(0, run.hint - dt * 0.6);
    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt);
    updateCamera(dt);
  }

  // ---------------------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------------------
  // A one-detail-pixel-wide line.
  function line(x0, y0, x1, y1, color) {
    x0 = Math.round(x0 * S); y0 = Math.round(y0 * S); x1 = Math.round(x1 * S); y1 = Math.round(y1 * S);
    ctx.fillStyle = color;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (let i = 0; i < 4000; i++) {
      if (y0 >= -2 && y0 <= H * S) ctx.fillRect(x0 / S, y0 / S, 1 / S, 1 / S);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  function drawSky(cy) {
    const surf = Math.round(-cy);
    if (surf <= 0) return;
    const top = [120, 196, 250], bot = [214, 242, 255];
    for (let y = 0; y < surf; y++) {
      const t = Math.floor(y / surf * 8) / 8;
      ctx.fillStyle = `rgb(${lerp(top[0], bot[0], t) | 0},${lerp(top[1], bot[1], t) | 0},${lerp(top[2], bot[2], t) | 0})`;
      ctx.fillRect(0, y, W, 1);
    }
    // Sun with a slowly turning ring of rays
    const sx = 106, sy = surf - 46;
    for (let i = 0; i < 8; i++) {
      const a = time * 0.3 + i * Math.PI / 4;
      dot(sx + Math.cos(a) * 9, sy + Math.sin(a) * 9, '#fff3a0');
      dot(sx + Math.cos(a) * 10, sy + Math.sin(a) * 10, '#fff8c8');
    }
    ctx.fillStyle = '#fff8c8';
    ctx.fillRect(sx - 4, sy - 6, 8, 12);
    ctx.fillRect(sx - 6, sy - 4, 12, 8);
    ctx.fillRect(sx - 5, sy - 5, 10, 10);
    ctx.fillStyle = '#ffe070';
    ctx.fillRect(sx - 3.5, sy - 4, 7, 8);
    ctx.fillRect(sx - 4, sy - 3.5, 8, 7);
    // Puffy clouds
    for (let i = 0; i < 3; i++) {
      const cx = snap(((i * 53 + time * (2 + i)) % (W + 40)) - 20);
      const cyy = surf - 56 + i * 9;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx, cyy, 18, 3);
      ctx.fillRect(cx + 2, cyy - 2, 7, 2);
      ctx.fillRect(cx + 7, cyy - 3.5, 6, 2);
      ctx.fillRect(cx + 12, cyy - 1.5, 4, 2);
      ctx.fillStyle = '#d8ecfa';
      ctx.fillRect(cx + 1, cyy + 2.5, 16, 1);
    }
    // A distant island with a lighthouse
    const hy = surf;
    ctx.fillStyle = '#7ab4d0';
    for (let x = 0; x < 34; x += 0.5) {
      const h = Math.max(0, Math.sin(x / 34 * Math.PI) * 6 + Math.sin(x * 0.7) * 0.6);
      ctx.fillRect(x, hy - h, 0.5, h);
    }
    ctx.fillStyle = '#e8f0f4';
    ctx.fillRect(14, hy - 15, 3, 10);
    ctx.fillStyle = '#d04848';
    ctx.fillRect(14, hy - 13, 3, 1.5);
    ctx.fillRect(14, hy - 9.5, 3, 1.5);
    ctx.fillStyle = '#4a5a6a';
    ctx.fillRect(13.5, hy - 16.5, 4, 1.5);
    if (Math.sin(time * 2.5) > 0) {
      ctx.fillStyle = '#ffe070';
      ctx.fillRect(14.5, hy - 16, 2, 1);
      dot(12, hy - 15.5, '#fff3a0');
      dot(19, hy - 15.5, '#fff3a0');
    }
    // Seagulls
    for (const g of gulls) {
      const gy = g.y - cy + Math.sin(g.ph * 0.3) * 2;
      if (gy < -4 || gy > surf) continue;
      const wing = Math.sin(g.ph);
      const dir = g.vx > 0 ? 1 : -1;
      const x = snap(g.x);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 1.5, gy, 3, 1);
      dot(x + dir * 1.5, gy - 0.5, '#ffffff');
      dot(x + dir * 2, gy - 0.5, '#f0a030');
      dot(x - dir * 2, gy + 0.5, '#d0d8e0');
      for (let i = 1; i <= 3; i++) {
        const wy = gy - wing * i * 0.6;
        dot(x - 1 - i * 0.5, wy, i === 3 ? '#5a6a7a' : '#e8eef4');
        dot(x + 1 + i * 0.5, wy, i === 3 ? '#5a6a7a' : '#e8eef4');
      }
    }
  }

  function drawWater(cy) {
    for (let sy = Math.max(0, Math.round(-cy)); sy < H; sy++) {
      const wy = sy + cy;
      ctx.fillStyle = waterColor(wy / PPM);
      ctx.fillRect(0, sy, W, 1);
    }
    // Light rays near the top
    if (cy < 200) {
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (let i = 0; i < 4; i++) {
        const x0 = ((i * 37 + time * 4) % (W + 40)) - 20;
        for (let wy = 0; wy < 200; wy += 1) {
          const sy = wy - cy;
          if (sy < 0 || sy > H) continue;
          ctx.fillRect(snap(x0 + wy * 0.25), sy, 6 - wy / 50, 1);
        }
      }
      // Drifting specks in the water
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      for (let i = 0; i < 24; i++) {
        const wy = (hash(i, 31) * 240 + time * 2) % 240;
        const sy = wy - cy;
        if (sy < 0 || sy > H) continue;
        ctx.fillRect(snap((hash(i, 17) * W + Math.sin(time + i) * 3 + W) % W), snap(sy), 0.5, 0.5);
      }
    }
  }

  function drawSurface(cy) {
    const surf = -cy;
    if (surf < -4 || surf >= H) return;
    for (let x = 0; x < W; x += 0.5) {
      const o = Math.sin(x * 0.2 + time * 2) * 0.8 + Math.sin(x * 0.53 - time * 1.3) * 0.4;
      const y = snap(surf + o);
      ctx.fillStyle = '#7ac8e8';
      ctx.fillRect(x, y, 0.5, 1.5);
      ctx.fillStyle = '#e6faff';
      ctx.fillRect(x, y - 0.5, 0.5, 0.5);
      if (hash(Math.floor(x * 2), Math.floor(time * 3)) < 0.02) dot(x, y + 1.5, '#ffffff');
    }
    for (const r of ripples) {
      const rad = 3 + r.t * 26;
      const a = 1 - r.t / 1.2;
      ctx.fillStyle = `rgba(230,250,255,${a.toFixed(2)})`;
      for (const s of [-1, 1]) {
        ctx.fillRect(snap(r.x + s * rad - 2), snap(surf + 0.5), 4, 0.5);
        ctx.fillRect(snap(r.x + s * rad * 0.7 - 1), snap(surf + 1.5), 2, 0.5);
      }
    }
  }

  function drawKelp(cy) {
    for (let i = 0; i < 9; i++) {
      const x = Math.round(hash(i, 3) * (W - 12)) + 6;
      const y0 = 100 + hash(i, 5) * 80, y1 = 260 + hash(i, 9) * 110;
      if (y1 - cy < 0 || y0 - cy > H) continue;
      for (let wy = Math.floor(y0); wy < y1; wy++) {
        const sy = wy - cy;
        if (sy < -2 || sy > H) continue;
        const ox = snap(Math.sin(wy * 0.06 + time * 1.4 + i) * 2);
        ctx.fillStyle = '#2a7a3a';
        ctx.fillRect(x + ox, sy, 1.5, 1);
        ctx.fillStyle = '#4aa05a';
        ctx.fillRect(x + ox + 1.5, sy, 0.5, 1);
        if ((wy + i * 3) % 7 === 0) {
          const side = (wy / 7) % 2 ? 1 : -1;
          const flap = Math.sin(time * 3 + wy) * 0.5;
          ctx.fillStyle = '#3a9a4a';
          ctx.fillRect(x + ox + (side > 0 ? 2 : -3), sy + flap, 3, 1);
          ctx.fillRect(x + ox + (side > 0 ? 4.5 : -4), sy + flap + 0.5, 1.5, 1);
          if ((wy + i) % 21 === 0) {
            ctx.fillStyle = '#c8b030';
            ctx.fillRect(x + ox + (side > 0 ? 2 : -1.5), sy - 1, 1, 1);
          }
        }
      }
    }
  }

  function drawWalls(cy) {
    for (let sy = 0; sy < H; sy++) {
      const wy = sy + cy;
      if (wy < 0) continue;
      const w = wallWidth(wy);
      const w2 = wallWidth(wy + 37);
      if (!w && !w2) continue;
      const band = Math.floor(wy / 4);
      ctx.fillStyle = hash(band, 11) < 0.5 ? '#1a1620' : '#221c2a';
      if (w) ctx.fillRect(0, sy, w, 1);
      ctx.fillStyle = hash(band, 13) < 0.5 ? '#1a1620' : '#221c2a';
      if (w2) ctx.fillRect(W - w2, sy, w2, 1);
      ctx.fillStyle = '#3a3248';
      if (w) ctx.fillRect(w - 1, sy, 1, 1);
      if (w2) ctx.fillRect(W - w2, sy, 0.5, 1);
      // Specks of mineral in the rock
      if (hash(wy, 5) < 0.06 && w > 2) dot(hash(wy, 6) * (w - 1), sy, '#5a4a6a');
      if (hash(wy, 8) < 0.04 && w2 > 2) dot(W - hash(wy, 9) * (w2 - 1), sy, hash(wy, 2) < 0.3 ? '#7ae0ff' : '#5a4a6a');
    }
    // Seafloor
    const fy = FLOOR_Y - cy;
    if (fy < H) {
      for (let x = 0; x < W; x += 1) {
        const o = Math.round(hash(x, 99) * 2);
        ctx.fillStyle = '#3a3428';
        ctx.fillRect(x, fy + o, 1, H);
        ctx.fillStyle = '#5a5040';
        ctx.fillRect(x, fy + o, 1, 0.5);
        if (hash(x, 98) < 0.15) dot(x, fy + o + 2 + hash(x, 97) * 6, '#4e4636');
      }
      if (!save.chest) {
        spr(chestSprite, 58, fy - 5);
        if (Math.floor(time * 3) % 3 === 0) dot(60 + (Math.floor(time * 3) % 7), fy - 4, '#ffffff');
      }
    }
  }

  function fishImage(f, frameOffset = 0) {
    const sp = f.sp;
    const set = f.golden ? sp.gold : sp.norm;
    const right = f.vx + (f.knock || 0) >= 0;
    const wag = 3 + Math.abs(f.vx) / 5;
    const fr = Math.floor(time * wag + f.phase + frameOffset) & 3;
    return { img: set[right ? 0 : 1][fr], right };
  }

  function drawFishList(cy) {
    for (const f of fish) {
      if (f.caught) continue;
      const sy = f.y - cy;
      if (sy < -20 || sy > H + 20) continue;
      if (f.jelly) {
        if (f.stun > 0 && Math.floor(time * 12) % 2) continue;
        const set = f.deep ? jellySprites.deep : jellySprites.shallow;
        spr(set[Math.floor(time * 4 + f.phase) & 3], f.x - 5, sy - 4.5);
        continue;
      }
      if (f.stun > 0 && Math.floor(time * 16) % 2) continue;
      const { img, right } = fishImage(f);
      const m = f.sp.meta;
      const ax = right ? m.ax : m.cw - m.ax;
      spr(img, f.x - ax / S, sy - m.ay / S);
      if (f.golden && Math.floor(time * 4 + f.phase) % 3 === 0) {
        const gx = f.x + (hash(Math.floor(time * 4), f.baseY | 0) - 0.5) * f.w;
        const gy = sy - f.h / 2 - 1;
        dot(gx, gy, '#ffffff');
        dot(gx - 0.5, gy, '#fff3a0');
        dot(gx + 0.5, gy, '#fff3a0');
        dot(gx, gy - 0.5, '#fff3a0');
        dot(gx, gy + 0.5, '#fff3a0');
      }
    }
  }

  // The bait wriggles on the hook; each kind is drawn a little differently.
  function drawBait(x, y) {
    const t = time;
    const p = (dx, dy, c) => dot(x + dx / S, y + dy / S, c);
    switch (lv.bait) {
      case 0: // worm
        for (let i = 0; i < 7; i++) {
          const wy = i - 1, wx = Math.sin(t * 8 + i * 0.9) * 1.5;
          p(wx, wy, i % 2 ? '#c05868' : '#e88a98');
          p(wx + 1, wy, '#d06a7a');
        }
        break;
      case 1: // cricket
        p(-1, 0, '#5a6a2a'); p(0, 0, '#6a7a2a'); p(1, 0, '#6a7a2a'); p(2, 0, '#7a8a3a');
        p(-1, 1, '#4a5a1a'); p(0, 1, '#5a6a2a'); p(1, 1, '#5a6a2a');
        p(3, -1, '#3a2a1a');
        p(-2, 2 + Math.round(Math.sin(t * 12)), '#3a3a1a'); p(1, 2, '#3a3a1a');
        p(3, -2 + Math.round(Math.sin(t * 9)), '#3a3a1a');
        break;
      case 2: // shrimp
        for (let i = 0; i < 6; i++) {
          const a = i / 5 * Math.PI * 0.9 + 0.3;
          p(Math.cos(a) * 2.5, Math.sin(a) * 2.5 - 1, i % 2 ? '#ff9a7a' : '#ffb898');
        }
        p(2, -3 + Math.round(Math.sin(t * 7)), '#ffd0b8'); p(3, -4 + Math.round(Math.sin(t * 7)), '#ffd0b8');
        break;
      case 3: // minnow
        for (let i = 0; i < 5; i++) p(i - 2, 0, i === 4 ? '#102030' : '#b8c8d8');
        p(-1, 1, '#8fa8b8'); p(0, 1, '#e0eef4'); p(1, 1, '#e0eef4');
        p(-3, Math.round(Math.sin(t * 14)), '#7a98aa');
        break;
      case 4: // squid
        p(0, -2, '#f0e0f0'); p(-1, -1, '#e8d0e0'); p(0, -1, '#f8f0f8'); p(1, -1, '#e8d0e0');
        p(-1, 0, '#e8d0e0'); p(0, 0, '#f0e0f0'); p(1, 0, '#e8d0e0');
        for (let i = -1; i <= 1; i++) {
          p(i + Math.sin(t * 9 + i), 1, '#d0a8c8');
          p(i + Math.sin(t * 9 + i + 1) * 1.3, 2, '#c098b8');
        }
        break;
      case 5: { // glow lure
        const pulse = Math.sin(t * 5) > 0;
        p(0, -2, '#2ab0d0'); p(-1, -1, '#7af0ff'); p(0, -1, '#ffffff'); p(1, -1, '#7af0ff');
        p(-1, 0, '#2ab0d0'); p(0, 0, '#7af0ff'); p(1, 0, '#2ab0d0');
        if (pulse) { p(-2, -1, '#7af0ff'); p(2, -1, '#7af0ff'); p(0, -3, '#7af0ff'); p(0, 1, '#7af0ff'); }
        break;
      }
      default: { // gold lure: a spinning spoon
        const w = Math.abs(Math.cos(t * 6)) * 2;
        for (let dy = -2; dy <= 1; dy++) {
          for (let dx = -Math.round(w); dx <= Math.round(w); dx++) p(dx, dy, dx === 0 && dy === -1 ? '#ffffff' : '#f2c200');
        }
        p(0, 2, '#c89200');
      }
    }
  }

  function drawHook(cy, g) {
    const hx = hook.x, hy = hook.y - cy;
    line(g.tip.x, g.tip.y - cy, hx - 0.5, hy - 7, 'rgba(235,245,255,0.75)');
    // Catch dangling under the hook, heads up and wriggling
    const n = run.catch.length;
    if (state === 'reel' || (state === 'drop' && n)) {
      const show = Math.min(n, 6);
      for (let i = show - 1; i >= 0; i--) {
        const f = run.catch[n - 1 - i];
        const set = f.golden ? f.sp.gold : f.sp.norm;
        const img = set[0][Math.floor(time * 14 + i * 1.3) & 3];
        const m = f.sp.meta;
        ctx.save();
        ctx.translate(snap(hx - 1 + ((i % 2) ? 1.5 : -1.5) + Math.sin(time * 6 + i)), snap(hy - 1 + i * 2.5));
        ctx.rotate(-Math.PI / 2);
        ctx.drawImage(img, -m.nose / S, -Math.round(m.ay) / S, img.width / S, img.height / S);
        ctx.restore();
      }
      if (n > 6) drawText('X' + n, hx + 4, hy + 4, '#fff');
    }
    spr(hookSprite, hx - 4, hy - 7);
    drawBait(hx - 2.5, hy - 2.5);
  }

  // The boat, the fisherman, the cat, and the rod. Coordinates inside are in
  // detail pixels from the hull's left end at the waterline.
  function drawBoat(cy, g) {
    const ox = BOAT_X, oy = snap(-cy + boatBob());
    if (oy > H + 30 || oy < -40) return;
    const R = (x, y, w, h, c) => {
      ctx.fillStyle = c;
      ctx.fillRect(ox + x / S, oy + y / S, w / S, h / S);
    };
    const p = g.p;

    // Mast with a flag and a lantern
    R(29, -54, 2, 40, '#7a5030');
    R(30, -54, 1, 40, '#9a6a40');
    R(28, -56, 4, 2, '#5a3820');
    for (let c = 0; c < 12; c++) {
      const wave = Math.round(Math.sin(time * 8 - c * 0.7) * (c / 11) * 1.5);
      for (let r = 0; r < 7; r++) R(31 + c, -54 + r + wave, 1, 1, r < 2 || r > 4 ? '#e04030' : '#f8f0e0');
    }
    R(26, -42, 1, 3, '#3a2a1a');
    R(24, -39, 5, 5, '#3a2a1a');
    R(25, -38, 3, 3, Math.sin(time * 3) > -0.6 ? '#ffe070' : '#ffc040');
    R(26, -38, 1, 1, '#ffffff');

    // Fish crate (fills up as the haul lands)
    const cb = boatFx.crateBounce > 0 ? -1 : 0;
    const shown = Math.min(5, (state === 'haul' || state === 'report') ? boatFx.crate : 1);
    const tailCols = ['#8fa8b8', '#d84a4a', '#e0c040', '#3a8a8a', '#f07a20'];
    for (let i = 0; i < shown; i++) {
      const tx = 8 + i * 3, ty = -26 + cb - (i % 2);
      R(tx, ty, 1, 3, tailCols[i]);
      R(tx - 1, ty - 1, 1, 1, tailCols[i]);
      R(tx + 1, ty - 1, 1, 1, tailCols[i]);
    }
    R(6, -24 + cb, 18, 7, '#a0703a');
    R(6, -24 + cb, 18, 1, '#c89050');
    R(6, -21 + cb, 18, 1, '#7a5028');
    R(6, -24 + cb, 1, 7, '#7a5028');
    R(23, -24 + cb, 1, 7, '#7a5028');

    drawFisher(R, g, p);

    // Hull
    for (let r = 0; r < 25; r++) {
      const y = -18 + r;
      const left = r * 0.3;
      const right = 84 - (r < 3 ? 0 : Math.pow(r - 3, 1.3) * 0.6);
      let c;
      if (r === 0) c = '#f0dcb0';
      else if (r === 1) c = '#c8a070';
      else if (r === 2) c = '#5a3018';
      else if (r === 9 || r === 10) c = '#f4f0e0';
      else if (y >= 1) c = '#2a4a6a';
      else if (r % 5 === 2) c = '#9a2a1c';
      else c = '#c8402a';
      R(Math.round(left), y, Math.round(right - left), 1, c);
      if (r > 2 && y < 1) {
        R(Math.round(left), y, 2, 1, shade(c, -0.25));
        R(Math.round(right) - 3, y, 2, 1, shade(c, 0.15));
      }
    }
    // Rivets and the bow post
    for (let x = 8; x < 76; x += 8) R(x, -12, 1, 1, '#7a2014');
    R(80, -22, 4, 5, '#c8a070');
    R(80, -22, 4, 1, '#f0dcb0');
    // Life ring
    for (let a = 0; a < 16; a++) {
      const ang = a / 16 * Math.PI * 2;
      R(Math.round(58 + Math.cos(ang) * 3.5), Math.round(-11 + Math.sin(ang) * 3.5), 1, 1, (a >> 2) % 2 ? '#e04030' : '#ffffff');
    }

    // Outboard motor with a spinning propeller
    R(-9, -26, 10, 9, '#d8d8e0');
    R(-9, -26, 10, 2, '#f0f0f8');
    R(-9, -21, 10, 1, '#e04030');
    R(-9, -18, 10, 1, '#a0a0b0');
    R(1, -21, 5, 1, '#3a3a40');
    R(-5, -17, 3, 22, '#8a8a98');
    const prop = Math.floor(time * 20) % 2;
    R(-6, 4 - prop * 2, 1, 3 + prop * 2, '#c8c8d0');
    R(-2, 3 + prop, 1, 3 - prop, '#c8c8d0');
    if (state === 'haul' || (state === 'title' && Math.sin(time * 0.8) > 0.9)) {
      const pt = (time * 2) % 1;
      R(-8 - pt * 4, -28 - pt * 8, 2, 2, `rgba(200,200,210,${(1 - pt).toFixed(2)})`);
    }

    drawCat(R);

    // Water lapping over the bottom of the hull
    for (let x = -10; x < 86; x++) {
      const w = Math.round(Math.sin((ox + x / S) * 0.2 + time * 2) * 1.6);
      R(x, w, 1, 8, 'rgba(63,167,214,0.72)');
      R(x, w - 1, 1, 1, '#e6faff');
    }
  }

  function drawFisher(R, g, p) {
    const mood = p.mood;
    const breathe = Math.sin(time * 2.2) > 0.6 ? -1 : 0;
    const jump = mood === 'cheer' ? -Math.round(Math.abs(Math.sin(time * 9)) * 2) : 0;
    const by = breathe + jump;
    const fx = 34; // torso left edge
    const coat = '#f2c200', coatD = '#c89400', coatL = '#ffe070';

    // Back arm (behind the body)
    const by0 = boatBob();
    const toLocal = (pt) => ({ x: (pt.x - BOAT_X) * S, y: (pt.y - by0) * S });
    const shoulderB = { x: fx + 3, y: -24 + by };
    let handB;
    if (mood === 'reel') {
      const a = time * 14;
      const reel = toLocal(rodPoint(g, 0.16));
      handB = { x: reel.x + Math.cos(a) * 2.5, y: reel.y + 2 + Math.sin(a) * 2.5 };
    } else if (mood === 'cheer') {
      handB = { x: fx - 3 + Math.sin(time * 14) * 1.5, y: -40 + by };
    } else if (mood === 'sad') {
      handB = { x: fx + 6, y: -16 };
    } else {
      handB = toLocal(rodPoint(g, 0.06));
    }
    limb(R, shoulderB, handB, coatD, '#e0b090');

    // Torso
    R(fx, -25 + by, 16, 14, coat);
    R(fx, -25 + by, 3, 14, coatD);
    R(fx + 13, -25 + by, 3, 14, coatL);
    R(fx + 3, -26 + by, 10, 2, coatD);
    R(fx + 9, -22 + by, 1, 11, coatD);
    R(fx + 11, -21 + by, 1, 1, '#3a2a10');
    R(fx + 11, -17 + by, 1, 1, '#3a2a10');

    // Head
    const hx = fx + 2 + (mood === 'reel' ? -1 : 0), hy = -38 + by + (mood === 'sad' ? 1 : 0);
    R(hx + 1, hy, 11, 11, '#f0c8a0');
    R(hx + 1, hy, 2, 11, '#d8a880');
    R(hx + 2, hy + 4, 2, 3, '#d8a880');
    R(hx + 12, hy + 4, 2, 2, '#e8b088');
    R(hx + 9, hy + 6, 2, 1, '#f09a8a');
    // Beard and mouth
    R(hx + 3, hy + 7, 9, 4, '#8a5a3a');
    R(hx + 3, hy + 10, 7, 2, '#6a4028');
    if (mood === 'happy' || mood === 'cheer') {
      R(hx + 8, hy + 8, 3, 1, '#3a1a10');
      R(hx + 7, hy + 7, 1, 1, '#3a1a10');
      R(hx + 11, hy + 7, 1, 1, '#3a1a10');
    } else if (mood === 'sad') {
      R(hx + 8, hy + 8, 3, 1, '#3a1a10');
      R(hx + 7, hy + 9, 1, 1, '#3a1a10');
      R(hx + 11, hy + 9, 1, 1, '#3a1a10');
    } else {
      R(hx + 8, hy + 8, 3, 1, '#3a1a10');
    }
    // Eyes: blink now and then, look at the hook while fishing
    const blink = (time % 3.4) < 0.12;
    const look = mood === 'watch' || mood === 'reel' ? 1 : 0;
    if (mood === 'happy' || mood === 'cheer') {
      R(hx + 6, hy + 3, 2, 1, '#2a1a10');
      R(hx + 10, hy + 3, 2, 1, '#2a1a10');
    } else if (blink) {
      R(hx + 6, hy + 4, 2, 1, '#2a1a10');
      R(hx + 10, hy + 4, 2, 1, '#2a1a10');
    } else {
      R(hx + 6, hy + 3, 2, 2, '#ffffff');
      R(hx + 10, hy + 3, 2, 2, '#ffffff');
      R(hx + 7, hy + 3 + look, 1, 1, '#2a1a10');
      R(hx + 11, hy + 3 + look, 1, 1, '#2a1a10');
      if (mood === 'sad') {
        R(hx + 6, hy + 2, 2, 1, '#8a5a3a');
        R(hx + 10, hy + 2, 2, 1, '#8a5a3a');
      }
    }
    // Sou'wester hat
    R(hx, hy - 5, 13, 6, coat);
    R(hx, hy - 5, 13, 1, coatL);
    R(hx, hy - 1, 13, 1, coatD);
    R(hx - 3, hy, 19, 2, coat);
    R(hx - 4, hy + 1, 4, 2, coatD);
    R(hx + 14, hy + 1, 3, 1, coatL);

    // Rod (bent toward the line) with its reel
    const col = POLE_COLORS[lv.pole];
    for (let i = 0; i <= 60; i++) {
      const t = i / 60;
      const pt = toLocal(rodPoint(g, t));
      const c = t < 0.18 ? '#b88a50' : t > 0.94 ? '#e04030' : col;
      R(Math.round(pt.x), Math.round(pt.y), t < 0.3 ? 2 : 1, 1, c);
    }
    const reel = toLocal(rodPoint(g, 0.16));
    R(Math.round(reel.x) - 1, Math.round(reel.y) + 1, 3, 3, '#a0a8b8');
    R(Math.round(reel.x), Math.round(reel.y) + 2, 1, 1, '#4a4a50');
    const ca = mood === 'reel' ? time * 14 : 0.8;
    R(Math.round(reel.x + Math.cos(ca) * 2.5), Math.round(reel.y + 2 + Math.sin(ca) * 2.5), 1, 1, '#2a2a30');

    // Front arm, holding the grip
    const shoulderF = { x: fx + 12, y: -24 + by };
    const handF = mood === 'cheer' ? toLocal(rodPoint(g, 0.2)) : toLocal(g.grip);
    limb(R, shoulderF, handF, coat, '#f0c8a0');
  }

  // An arm: a short thick line from shoulder to hand.
  function limb(R, a, b, sleeve, skin) {
    const n = Math.max(2, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y)));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = Math.round(lerp(a.x, b.x, t)), y = Math.round(lerp(a.y, b.y, t));
      R(x - 1, y - 1, 3, 3, t > 0.8 ? skin : sleeve);
    }
  }

  // An orange tabby sitting on the bow, swishing its tail; it hops when fish land.
  function drawCat(R) {
    const hop = boatFx.cat > 0 ? -Math.round(Math.sin(boatFx.cat / 0.5 * Math.PI) * 5) : 0;
    const cx = 70, cy = -18 + hop;
    const o = '#e8902a', d = '#b86010', w = '#f8f0e0';
    // Tail
    for (let i = 0; i < 9; i++) {
      const a = Math.sin(time * 2.5 + i * 0.4) * 0.5;
      R(Math.round(cx - 1 - i * 0.6 + Math.sin(a) * i * 0.3), Math.round(cy - 1 - i * 0.8 * Math.cos(a)), 2, 1, i % 3 === 2 ? d : o);
    }
    // Body
    R(cx, cy - 8, 8, 8, o);
    R(cx + 1, cy - 6, 2, 1, d);
    R(cx + 1, cy - 3, 2, 1, d);
    R(cx + 5, cy - 6, 3, 6, w);
    R(cx + 5, cy - 1, 2, 1, w);
    R(cx + 7, cy - 1, 2, 1, w);
    // Head
    const look = state === 'reel' || state === 'drop' ? 1 : 0;
    R(cx + 3, cy - 14, 8, 6, o);
    R(cx + 3, cy - 16, 2, 2, o);
    R(cx + 9, cy - 16, 2, 2, o);
    R(cx + 4, cy - 15, 1, 1, '#f0a0a0');
    R(cx + 9, cy - 15, 1, 1, '#f0a0a0');
    R(cx + 5, cy - 14, 1, 2, d);
    R(cx + 8, cy - 14, 1, 2, d);
    R(cx + 6, cy - 10, 4, 2, w);
    R(cx + 7, cy - 10, 2, 1, '#e07080');
    const blink = (time % 4.1) < 0.12;
    if (blink || boatFx.catMeow > 0) {
      R(cx + 5, cy - 12 + look, 2, 1, '#2a1a10');
      R(cx + 8, cy - 12 + look, 2, 1, '#2a1a10');
    } else {
      R(cx + 5, cy - 12 + look, 2, 2, '#7ad050');
      R(cx + 8, cy - 12 + look, 2, 2, '#7ad050');
      R(cx + 6, cy - 12 + look, 1, 2, '#1a1a10');
      R(cx + 9, cy - 12 + look, 1, 2, '#1a1a10');
    }
    // Whiskers
    R(cx + 10, cy - 10, 3, 1, '#f8f0e0');
    R(cx + 1, cy - 10, 3, 1, '#f8f0e0');
    if (boatFx.catMeow > 0) drawText('MEW!', ox2(cx + 14), -camY + boatBob() - 12, '#fff', 1, 'left', '#1c4a7a');
  }
  const ox2 = (x) => BOAT_X + x / S;

  // Darkness: one cell per grid unit, with light pools around the hook and glowing fish.
  const darkCanvas = document.createElement('canvas');
  darkCanvas.width = W;
  darkCanvas.height = H;
  const dctx = darkCanvas.getContext('2d');
  const dimg = dctx.createImageData(W, H);

  function drawDarkness(cy) {
    if (darkAt((cy + H) / PPM) <= 0.01) return;
    const lights = [];
    if (state !== 'title') lights.push({ x: hook.x, y: hook.y - cy - 2, r: BAIT_LIGHT[lv.bait], s: 1 });
    for (const f of fish) {
      if (f.caught) continue;
      const sy = f.y - cy;
      if (sy < -20 || sy > H + 20) continue;
      if (f.jelly && f.deep) lights.push({ x: f.x, y: sy, r: 9 + Math.sin(time * 4 + f.phase) * 1.5, s: 0.7 });
      else if (f.sp && f.sp.glow) lights.push({ x: f.x, y: sy, r: 11, s: 0.8 });
    }
    const d = dimg.data;
    for (let gy = 0; gy < H; gy++) {
      const py = gy + 0.5;
      const base = darkAt((cy + py) / PPM);
      const row = lights.filter((L) => Math.abs(py - L.y) < L.r);
      for (let gx = 0; gx < W; gx++) {
        const idx = (gy * W + gx) * 4;
        if (base <= 0) {
          d[idx + 3] = 0;
          continue;
        }
        const px = gx + 0.5;
        let lit = 0;
        for (const L of row) {
          const dx = px - L.x, dy = py - L.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < L.r * L.r) lit = Math.max(lit, (1 - Math.sqrt(d2) / L.r) * L.s);
        }
        const a = base * (1 - Math.min(1, lit * 1.5));
        const level = clamp(Math.floor(a * 5 + BAYER[(gy & 3) * 4 + (gx & 3)]) / 5, 0, 1);
        d[idx] = 3;
        d[idx + 1] = 6;
        d[idx + 2] = 14;
        d[idx + 3] = level * 255;
      }
    }
    dctx.putImageData(dimg, 0, 0);
    ctx.drawImage(darkCanvas, 0, 0, W, H);
    // Glowing spots stay visible through the dark
    for (const f of fish) {
      if (f.caught || !f.sp || !f.sp.glow) continue;
      const sy = f.y - cy;
      if (sy < -10 || sy > H + 10) continue;
      const m = f.sp.meta;
      const right = f.vx + (f.knock || 0) >= 0;
      const ax = right ? m.ax : m.cw - m.ax;
      const on = Math.sin(time * 3 + f.phase) > -0.7;
      for (const [gx, gy] of m.glow) {
        const px = right ? gx : m.cw - 1 - gx;
        if (on) dot(f.x - ax / S + px / S, sy - m.ay / S + gy / S, f.sp.glow);
      }
    }
  }

  function drawScene() {
    const cy = Math.round((camY + (shake > 0 ? rand(-1.5, 1.5) : 0)) * S) / S;
    const g = rodGeom();
    drawSky(cy);
    drawWater(cy);
    drawKelp(cy);
    drawFishList(cy);
    for (const b of bubbles) {
      const sy = b.y - cy;
      if (b.drop) {
        dot(b.x, sy, '#e6faff');
      } else {
        dot(b.x, sy, 'rgba(220,240,255,0.7)');
        if (b.life > 0.8) dot(b.x + 0.5, sy - 0.5, 'rgba(255,255,255,0.8)');
      }
    }
    drawWalls(cy);
    drawSurface(cy);
    drawBoat(cy, g);
    drawHook(cy, g);
    drawDarkness(cy);
    for (const fl of flyers) {
      if (!fl.launched || fl.done) continue;
      const set = fl.f.golden ? fl.f.sp.gold : fl.f.sp.norm;
      const right = fl.vx >= 0;
      const img = set[right ? 0 : 1][Math.floor(fl.t * 16) & 3];
      const m = fl.f.sp.meta;
      ctx.save();
      ctx.translate(snap(fl.x), snap(fl.y - cy));
      ctx.rotate(Math.floor(fl.t * 8) % 4 * Math.PI / 2 * (right ? 1 : -1));
      ctx.drawImage(img, -Math.round(m.cw / 2) / S, -Math.round(m.ay) / S, img.width / S, img.height / S);
      ctx.restore();
    }
    for (const p of popups) {
      const sy = p.y - cy - p.t * 14;
      drawText(p.text, clamp(p.x, textWidth(p.text) / 2 + 2, W - textWidth(p.text) / 2 - 2), sy, p.color, 1, 'center');
    }
    for (const c of coins) {
      if (c.t < 0) continue;
      const w = [3, 2, 1, 2][Math.floor(time * 16 + c.vx) & 3];
      ctx.fillStyle = '#c89200';
      ctx.fillRect(snap(c.x - w / 2), snap(c.y - 1.5), w, 3);
      ctx.fillStyle = '#f2c200';
      ctx.fillRect(snap(c.x - w / 2), snap(c.y - 1.5), Math.max(0.5, w - 1), 2.5);
      if (w === 3) dot(c.x - 0.5, c.y - 1, '#fff3a0');
    }
    if (flash > 0) {
      ctx.fillStyle = 'rgba(160,240,255,0.35)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawHUD() {
    const m = Math.floor(Math.max(0, hook.y) / PPM);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, 9);
    drawText(m + 'M', 2, 2, '#fff');
    drawText('/' + Math.floor(run.maxY / PPM) + 'M', 2 + textWidth(m + 'M') + 2, 2, '#8a9ab0');
    const cap = run.catch.length + '/' + capacity();
    drawText(cap, W - 12, 2, run.full ? '#ffe070' : '#fff', 1, 'right');
    // Pause button
    buttons.push({ x: W - 10, y: 0, w: 10, h: 9, act: 'pause' });
    ctx.fillStyle = '#fff';
    ctx.fillRect(W - 7, 2, 1, 5);
    ctx.fillRect(W - 4, 2, 1, 5);
    // Pushes left
    for (let i = 0; i < run.pushes; i++) {
      ctx.fillStyle = '#2a6a3a';
      ctx.fillRect(2 + i * 4, 11, 3, 3);
      ctx.fillStyle = '#a0f0a0';
      ctx.fillRect(2 + i * 4, 11, 2.5, 2.5);
    }
    // Depth gauge on the right edge
    const gx = W - 3, g0 = 14, g1 = H - 6;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(gx, g0, 2, g1 - g0);
    const t = clamp(hook.y / run.maxY, 0, 1);
    ctx.fillStyle = state === 'drop' ? '#8fe0ff' : '#ffe070';
    ctx.fillRect(gx - 1, Math.round(lerp(g0, g1, t)) - 1, 4, 3);
    if (save.best) {
      const bt = clamp(save.best * PPM / run.maxY, 0, 1);
      ctx.fillStyle = '#ff7a7a';
      ctx.fillRect(gx - 1, Math.round(lerp(g0, g1, bt)), 4, 1);
    }

    if (banner) {
      const a = banner.t < 0.2 ? banner.t / 0.2 : banner.t > 1.8 ? (2.2 - banner.t) / 0.4 : 1;
      if (a > 0.5) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 26, W, banner.sub ? 20 : 12);
        if (banner.sub) drawText(banner.sub, W / 2, 29, '#fff', 1, 'center');
        drawWavyText(banner.text, W / 2, banner.sub ? 37 : 29, banner.color, 1, '#000', 1, 8);
      }
    }
    if (run.hint > 0 && Math.floor(time * 3) % 4) {
      const txt = state === 'drop' ? ['DODGE THE FISH', 'ON THE WAY DOWN!'] : ['CATCH FISH', 'ON THE WAY UP!'];
      drawText(txt[0], W / 2, H - 30, '#ffe070', 1, 'center');
      drawText(txt[1], W / 2, H - 22, '#ffe070', 1, 'center');
      drawText(pointer.follow ? 'DRAG TO STEER' : 'ARROWS OR DRAG TO STEER', W / 2, H - 12, '#fff', 1, 'center');
    }
  }

  function drawTitle() {
    // Logo
    drawWavyText('LITTLE LURE', W / 2, 8, '#ffe070', 2, '#1c4a7a', 1.5, 3);
    drawText('- FISHING CO. -', W / 2, 24, '#1c4a7a', 1, 'center', '#ffffff');
    // Menu panel
    ctx.fillStyle = 'rgba(8,24,48,0.6)';
    ctx.fillRect(14, 112, 100, 72);
    drawText('CASH $' + fmt(save.money), W / 2, 116, '#a0f0a0', 1, 'center');
    button(34, 125, 60, 17, 'CAST', 'cast', { selected: menuSel === 0, scale: 2 });
    button(20, 147, 42, 13, 'SHOP', 'shop', { selected: menuSel === 1 });
    button(66, 147, 42, 13, 'FISH LOG', 'log', { selected: menuSel === 2 });
    const zone = ZONES[Math.min(save.zones, ZONES.length) - 1];
    drawText('BEST ' + save.best + 'M', W / 2, 165, '#8fe0ff', 1, 'center');
    drawText(zone.name, W / 2, 173, zone.color, 1, 'center');
    if (save.dives === 0 && Math.floor(time * 2) % 2) drawText('TAP CAST TO FISH!', W / 2, 100, '#fff', 1, 'center', '#1c4a7a');
    drawText(sfx.muted ? 'M: SOUND OFF' : '', 2, H - 7, '#8a9ab0');
  }

  function drawPanel(x, y, w, h) {
    ctx.fillStyle = 'rgba(6,16,34,0.88)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#5a8ab8';
    ctx.fillRect(x, y, w, 1);
    ctx.fillRect(x, y + h - 1, w, 1);
    ctx.fillRect(x, y, 1, h);
    ctx.fillRect(x + w - 1, y, 1, h);
  }

  // Draw a species' sprite to fit inside a box, swimming in place.
  function fishIcon(sp, golden, x, y, bw, bh, frameT = time * 5) {
    const img = (golden ? sp.gold : sp.norm)[0][Math.floor(frameT) & 3];
    const k = Math.min(1, bw / (img.width / S), bh / (img.height / S));
    const w = img.width / S * k, h = img.height / S * k;
    ctx.drawImage(img, snap(x + (bw - w) / 2), snap(y + (bh - h) / 2), w, h);
  }

  function drawReport() {
    const r = report;
    const groups = Object.values(r.groups).sort((a, b) => b.value - a.value);
    drawPanel(6, 36, 116, 146);
    drawWavyText('CATCH REPORT', W / 2, 41, '#ffe070', 1, '#000', 1, 5);
    let y = 52;
    if (!groups.length) {
      drawText('NOTHING BIT...', W / 2, y + 6, '#8a9ab0', 1, 'center');
      drawText('CATCH FISH ON', W / 2, y + 20, '#fff', 1, 'center');
      drawText('THE WAY UP!', W / 2, y + 28, '#fff', 1, 'center');
      y += 44;
    }
    groups.slice(0, 6).forEach((gr, i) => {
      fishIcon(gr.sp, gr.golden > 0, 9, y - 2, 16, 9, time * 6 + i);
      drawText(gr.n + 'X ' + gr.sp.name, 27, y, gr.golden ? '#f2c200' : '#fff');
      drawText('$' + fmt(gr.value), 118, y, '#a0f0a0', 1, 'right');
      y += 9;
    });
    if (groups.length > 6) {
      drawText('+' + (groups.length - 6) + ' MORE KINDS', W / 2, y, '#8a9ab0', 1, 'center');
      y += 9;
    }
    y = Math.max(y + 2, 108);
    ctx.fillStyle = '#5a8ab8';
    ctx.fillRect(10, y, 108, 1);
    drawText('TOTAL', 10, y + 4, '#fff');
    drawText('$' + fmt(r.total), 118, y + 4, '#a0f0a0', 1, 'right');
    drawText('DEPTH ' + r.depth + 'M', 10, y + 13, '#8fe0ff');
    if (r.record) drawText('RECORD!', 118, y + 13 + (Math.floor(time * 6) % 2 ? -1 : 0), '#ff7a7a', 1, 'right');
    let ny = y + 22;
    if (run.newSpecies.length) {
      const more = run.newSpecies.length - 1;
      drawText('NEW: ' + run.newSpecies[0].name + (more ? ' +' + more : ''), 10, ny, '#ffe070');
      ny += 9;
    }
    if (r.chest) {
      spr(chestSprite, 10, ny);
      drawText('SUNKEN CHEST!', 70, ny, '#f2c200', 1, 'center');
      drawText('+$' + fmt(CHEST_BONUS), 70, ny + 8, '#f2c200', 1, 'center');
    }
    if (Math.floor(time * 2) % 2) drawText('TAP TO CONTINUE', W / 2, 172, '#fff', 1, 'center');
  }

  function drawUnderwaterBg() {
    for (let y = 0; y < H; y++) {
      ctx.fillStyle = waterColor(200 + y * 1.5);
      ctx.fillRect(0, y, W, 1);
    }
    for (let i = 0; i < 16; i++) {
      const by = H - ((time * (6 + (i % 4) * 3) + hash(i, 4) * H) % H);
      dot(hash(i, 2) * W + Math.sin(time * 2 + i) * 2, by, 'rgba(220,240,255,0.5)');
    }
  }

  function drawShop() {
    drawUnderwaterBg();
    drawWavyText('TACKLE SHOP', W / 2, 4, '#ffe070', 1, '#000', 1, 5);
    const bump = moneyBump > 0 ? 1 : 0;
    drawText('$' + fmt(save.money), W / 2, 12 - bump, '#a0f0a0', 1, 'center');
    UPGRADES.forEach((u, i) => {
      const x = 4, y = 21 + i * 38, w = 120, h = 35;
      const l = lv[u.id];
      const maxed = l >= u.prices.length;
      const sel = shopSel === i;
      buttons.push({ x, y, w, h, act: i });
      drawPanel(x, y, w, h);
      if (sel) {
        ctx.fillStyle = Math.floor(time * 4) % 2 ? '#ffe070' : '#ffd040';
        ctx.fillRect(x, y, w, 1);
        ctx.fillRect(x, y + h - 1, w, 1);
        ctx.fillRect(x, y, 1, h);
        ctx.fillRect(x + w - 1, y, 1, h);
      }
      const justBought = shopMsg && shopMsg.bought === i && shopMsg.t < 0.6;
      const iy = y + 4 + (sel ? Math.round(Math.sin(time * 5)) : 0) - (justBought ? 2 : 0);
      ctx.drawImage(iconSprites[u.icon], x + 4, iy);
      drawText(u.name, x + 16, y + 5, sel ? '#ffe070' : '#fff');
      // Level pips
      const n = u.prices.length + 1;
      for (let k = 0; k < n; k++) {
        const pop = justBought && k === l ? -1 : 0;
        ctx.fillStyle = k <= l ? '#a0f0a0' : '#2a3a50';
        ctx.fillRect(x + w - 4 - (n - k) * 4, y + 5 + pop, 3, 4);
      }
      drawText(u.now(l), x + 4, y + 15, '#8fe0ff');
      if (maxed) {
        drawText('FULLY UPGRADED', x + 4, y + 24, '#ffe070');
      } else {
        drawText(u.next(l), x + 4, y + 24, '#c0c8d8');
        const price = '$' + fmt(u.prices[l]);
        drawText(price, x + w - 4, y + 15, save.money >= u.prices[l] ? '#a0f0a0' : '#ff7a7a', 1, 'right');
      }
      if (justBought) {
        for (let k = 0; k < 6; k++) {
          const a = k / 6 * Math.PI * 2 + shopMsg.t * 4;
          dot(x + 8 + Math.cos(a) * (6 + shopMsg.t * 12), y + 8 + Math.sin(a) * (6 + shopMsg.t * 12), '#ffe070');
        }
      }
    });
    if (shopMsg && shopMsg.t < 1.6) drawText(shopMsg.text, W / 2, 174, shopMsg.color, 1, 'center');
    button(44, 181, 40, 10, 'BACK', 'back', { selected: shopSel === UPGRADES.length });
  }

  function drawLog() {
    drawUnderwaterBg();
    const known = SPECIES.filter((s) => save.caught[s.id]).length;
    drawWavyText('FISH LOG', W / 2, 4, '#ffe070', 1, '#000', 1, 5);
    drawText(known + '/' + SPECIES.length + ' SPECIES', W / 2, 12, '#8fe0ff', 1, 'center');
    const per = 7;
    const list = SPECIES.slice(logPage * per, logPage * per + per);
    list.forEach((sp, i) => {
      const y = 22 + i * 21;
      drawPanel(4, y, 120, 19);
      const n = save.caught[sp.id] || 0;
      if (n) {
        fishIcon(sp, false, 6 + Math.sin(time * 1.5 + i) * 1, y + 2, 28, 15, time * 6 + i);
      } else {
        const img = sp.dark;
        const k = Math.min(1, 28 / (img.width / S), 15 / (img.height / S));
        ctx.drawImage(img, snap(6 + (28 - img.width / S * k) / 2), snap(y + 2 + (15 - img.height / S * k) / 2), img.width / S * k, img.height / S * k);
      }
      drawText(n ? sp.name : '???', 36, y + 3, n ? '#fff' : '#5a6a80');
      drawText(sp.min + '-' + sp.max + 'M', 36, y + 11, '#8a9ab0');
      if (n) {
        drawText('$' + fmt(sp.value), 120, y + 3, '#a0f0a0', 1, 'right');
        drawText('X' + n, 120, y + 11, '#fff', 1, 'right');
        if (save.golden[sp.id]) {
          ctx.fillStyle = '#f2c200';
          ctx.fillRect(100, y + 12, 3, 3);
          if (Math.floor(time * 3 + i) % 4 === 0) dot(102.5, y + 11.5, '#ffffff');
        }
      }
    });
    const pages = Math.ceil(SPECIES.length / per);
    drawText((logPage + 1) + '/' + pages, W / 2, 172, '#8a9ab0', 1, 'center');
    button(4, 168, 22, 12, '<', 'prev');
    button(102, 168, 22, 12, '>', 'next');
    button(44, 181, 40, 10, 'BACK', 'back', { selected: true });
    if (save.chest) spr(chestSprite, 2, 2);
  }

  function drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    drawText('PAUSED', W / 2, 70, '#ffe070', 2, 'center');
    button(34, 92, 60, 14, 'RESUME', 'resume', { selected: true });
    button(34, 112, 60, 14, 'GIVE UP', 'quit');
    drawText('GIVING UP LOSES', W / 2, 134, '#8a9ab0', 1, 'center');
    drawText('THIS CATCH', W / 2, 142, '#8a9ab0', 1, 'center');
  }

  function draw() {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.imageSmoothingEnabled = false;
    buttons = [];
    if (state === 'shop') return drawShop();
    if (state === 'log') return drawLog();
    drawScene();
    if (state === 'title') drawTitle();
    else if (state === 'drop' || state === 'reel') drawHUD();
    else if (state === 'pause') {
      drawHUD();
      buttons = [];
      drawPause();
    } else if (state === 'haul') {
      const s = moneyBump > 0 ? 1 : 0;
      drawText('$' + fmt(report.total), W / 2, 4 - s, '#a0f0a0', 2, 'center');
    } else if (state === 'report') drawReport();
  }

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && (state === 'drop' || state === 'reel')) {
      pausedFrom = state;
      state = 'pause';
    }
  });

  toTitle();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    pressed.clear();
    pointer.taps = [];
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Debug hook for automated tests.
  window.__lure = { save, SPECIES, jellySprites, get state() { return state; }, get run() { return run; }, get hook() { return hook; }, get fish() { return fish; } };
})();
  </script>
</body>
</html>
