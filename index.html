<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Survivor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Everything the game needs lives inside #game-container.
    That makes it easy to drop the game into a bigger website later.
  -->
  <div id="game-container">
    <!--
      The canvas is only 320 x 180 pixels. JavaScript scales it up
      by a whole number (2x, 3x, 4x...) so every pixel stays crisp.
    -->
    <canvas id="game-canvas" width="320" height="180"></canvas>
  </div>

  <!--
    Scripts load in order. Each file adds a few named things that the
    later files can use. main.js runs last and starts the game.
  -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/player.js"></script>
  <script src="js/projectiles.js"></script>
  <script src="js/orbs.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/spawner.js"></script>
  <script src="js/upgrades.js"></script>
  <script src="js/levelup.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
