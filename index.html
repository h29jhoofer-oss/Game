<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One More Jump</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="omj-page">

  <!--
    The whole game lives inside this one element.
    To embed it in another page: copy this <div>, the CSS link and the
    <script> tags, and give the div a width (its height follows 16:9).
  -->
  <div class="omj omj--fullscreen" tabindex="0" aria-label="One More Jump game">
    <div class="omj-stage">
      <canvas class="omj-canvas" width="384" height="216"></canvas>

      <!-- Small buttons in the corner during play -->
      <div class="omj-corner">
        <button class="omj-icon" data-action="pause" title="Pause (Esc)" aria-label="Pause">
          <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="2" height="6"/><rect x="6" y="2" width="2" height="6"/></svg>
        </button>
        <button class="omj-icon" data-action="mute" title="Mute (M)" aria-label="Mute">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 4h2l3-3v8l-3-3h-2z"/>
            <path class="omj-icon-waves" d="M7 3h1v4h-1zM9 2h1v6h-1z"/>
            <path class="omj-icon-cross" d="M6 3h1v1h1v1h-1v1h-1v-1h1v-1h-1zM8 3h1v1h-1zM8 5h1v1h-1z" transform="translate(1 1)"/>
          </svg>
        </button>
      </div>

      <!-- START SCREEN -->
      <div class="omj-screen omj-screen--start" data-screen="start">
        <canvas class="omj-title omj-title--big" data-title="ONE MORE JUMP"></canvas>
        <p class="omj-text">Press <kbd>SPACE</kbd> to jump.</p>
        <p class="omj-best">BEST <span data-field="best">0</span></p>

        <div class="omj-skins">
          <button class="omj-arrow" data-action="skin-prev" aria-label="Previous skin">&lt;</button>
          <div class="omj-skin-card">
            <canvas class="omj-skin-preview" data-skin-preview></canvas>
            <span class="omj-skin-name" data-field="skin-name">Classic</span>
            <span class="omj-skin-lock" data-field="skin-lock"></span>
          </div>
          <button class="omj-arrow" data-action="skin-next" aria-label="Next skin">&gt;</button>
        </div>

        <button class="omj-btn" data-action="play">PLAY</button>
        <p class="omj-hint">SPACE / &uarr; / W / CLICK = JUMP &nbsp;·&nbsp; ESC = PAUSE &nbsp;·&nbsp; M = MUTE</p>
      </div>

      <!-- PAUSE SCREEN -->
      <div class="omj-screen omj-screen--pause" data-screen="pause">
        <canvas class="omj-title" data-title="PAUSED"></canvas>
        <p class="omj-text">Take a breath. The spikes will wait.</p>
        <button class="omj-btn" data-action="resume">RESUME</button>
        <button class="omj-btn omj-btn--small" data-action="menu">MENU</button>
        <p class="omj-hint">Press <kbd>ESC</kbd> to resume</p>
      </div>

      <!-- GAME OVER SCREEN -->
      <div class="omj-screen omj-screen--over" data-screen="over">
        <canvas class="omj-title" data-title="GAME OVER" data-field="over-title"></canvas>
        <p class="omj-text omj-funny" data-field="message"></p>
        <p class="omj-cause" data-field="cause"></p>
        <div class="omj-scores">
          <div><span>SCORE</span><strong data-field="score">0</strong></div>
          <div><span>BEST</span><strong data-field="over-best">0</strong></div>
          <div><span>JUMPED</span><strong data-field="jumped">0</strong></div>
        </div>
        <p class="omj-unlock" data-field="unlock"></p>
        <div class="omj-row">
          <button class="omj-btn" data-action="restart">RESTART</button>
          <button class="omj-btn omj-btn--small" data-action="menu">MENU</button>
        </div>
        <p class="omj-hint">Press <kbd>R</kbd> or <kbd>SPACE</kbd> to try again</p>
      </div>
    </div>
  </div>

  <!-- Load order matters: config first, game last. -->
  <script src="js/config.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/font.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/player.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/spawner.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/background.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script>
    // Start the game inside the element above.
    OMJ.createGame(document.querySelector('.omj'), { autofocus: true });
  </script>
</body>
</html>
