<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Ascent</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0a10;
      color: #d8d3c4;
      font-family: "Courier New", monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    canvas {
      width: min(96vw, calc(85vh * 4 / 3));
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      border: 4px solid #2a2433;
      box-shadow: 0 0 40px rgba(120, 80, 200, 0.25);
      background: #000;
    }
    p {
      margin: 0;
      font-size: 14px;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>
  <p>Move: WASD / Arrows &nbsp;·&nbsp; Attack: Space / J &nbsp;·&nbsp; Pause: P</p>
  <script src="game.js"></script>
</body>
</html>
