<body>
  <canvas id="game" aria-label="Little Lure Co. fishing game"></canvas>
  <script>
// Little Lure Co. — a pixelated drop-and-reel fishing game. Dodge fish on the
// way down, catch them on the way up, sell the haul and buy better tackle to
// reach the bottom of the trench.
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Constants
  // ---------------------------------------------------------------------------
  // The game is laid out on a 128x192 grid, but drawn at S times that so
  // sprites, the boat and the fish can carry finer detail.
  const W = 128, H = 192, S = 2;
  const PPM = 2;                   // world units per metre of depth
  const FLOOR_M = 1700;            // the trench floor
  const FLOOR_Y = FLOOR_M * PPM;
  const TITLE_CAM = -64;           // camera when sitting at the surface
  const BOAT_X = 40;               // left end of the hull at the waterline
  const ROD_LEN = 26;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const fmt = (n) => Math.floor(n).toLocaleString('en-US');
  const snap = (v) => Math.round(v * S) / S;
  // Stable noise so rock walls and kelp don't flicker.
  const hash = (a, b) => {
    let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);

  // Colour helpers for shading sprites. amt < 0 darkens, > 0 lightens.
  function rgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [n >> 16, (n >> 8) & 255, n & 255];
  }
  const toHex = (c) => '#' + c.map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  const shade = (hex, amt) => toHex(rgb(hex).map((v) => (amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  const mix = (a, b, t) => {
    const ca = rgb(a), cb = rgb(b);
    return toHex(ca.map((v, i) => lerp(v, cb[i], t)));
  };

  // Ocean zones, by depth in metres.
  const ZONES = [
    { name: 'SUNLIT SHALLOWS', m: 0, color: '#8fe0ff' },
    { name: 'KELP FOREST', m: 60, color: '#8af07a' },
    { name: 'TWILIGHT ZONE', m: 160, color: '#a0b8ff' },
    { name: 'MIDNIGHT ZONE', m: 350, color: '#c08aff' },
    { name: 'THE ABYSS', m: 650, color: '#ff7aa0' },
    { name: 'THE TRENCH', m: 1100, color: '#ffd060' },
  ];
  const zoneIndex = (m) => {
    let z = 0;
    for (let i = 0; i < ZONES.length; i++) if (m >= ZONES[i].m) z = i;
    return z;
  };

  // Water colour keyframes (metres -> colour) and how dark it gets.
  const WATER = [
    [0, [63, 167, 214]], [60, [42, 134, 184]], [160, [30, 100, 150]], [350, [28, 74, 124]],
    [650, [30, 58, 110]], [1100, [36, 46, 96]], [1700, [44, 36, 80]],
  ];
  const DARK = [[0, 0], [120, 0], [300, 0.55], [600, 0.8], [1000, 0.92], [1700, 0.96]];
  function keyframe(list, m) {
    if (m <= list[0][0]) return list[0][1];
    for (let i = 1; i < list.length; i++) {
      if (m <= list[i][0]) {
        const [m0, a] = list[i - 1], [m1, b] = list[i];
        const t = (m - m0) / (m1 - m0);
        return Array.isArray(a) ? a.map((v, k) => lerp(v, b[k], t)) : lerp(a, b, t);
      }
    }
    return list[list.length - 1][1];
  }
  const waterColor = (m) => {
    const c = keyframe(WATER, m);
    return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  };
  const darkAt = (m) => keyframe(DARK, m);

  // Fish. min/max are the depths (m) they live at; value is the base sale
  // price. `look` describes the sprite (sizes are in detail pixels):
  // body shape, length L, height Hh, tail length T and style, dorsal fin
  // [start, end, height] along the body, a pattern, and extra features.
  const SPECIES = [
    { id: 'minnow', name: 'MINNOW', min: 0, max: 70, value: 2, speed: 22,
      look: { body: 'fusi', L: 12, Hh: 6, T: 5, tail: 'fork', dorsal: [0.35, 0.6, 3], pattern: 'lateral' },
      pal: { b: '#8fa8b8', s: '#e0eef4', f: '#7a98aa', e: '#102030', p: '#e8f4ff' } },
    { id: 'sardine', name: 'SARDINE', min: 4, max: 95, value: 3, speed: 30,
      look: { body: 'fusi', L: 14, Hh: 7, T: 5, tail: 'fork', dorsal: [0.4, 0.6, 3], pattern: 'dots' },
      pal: { b: '#4a76a8', s: '#d8e6f0', f: '#6a8ab0', e: '#102030' } },
    { id: 'perch', name: 'PERCH', min: 12, max: 110, value: 6, speed: 16,

      pal: { b: '#b8a838', s: '#f0e0a0', f: '#e06830', e: '#201810' } },
    { id: 'clown', name: 'CLOWNFISH', min: 20, max: 120, value: 8, speed: 14,
      look: { body: 'round', L: 14, Hh: 10, T: 5, tail: 'round', dorsal: [0.25, 0.75, 3], pattern: 'stripes' },
      pal: { b: '#f07a20', s: '#f8a040', f: '#f07a20', e: '#1a1a1a', o: '#2a1408' } },
    { id: 'bass', name: 'SEA BASS', min: 30, max: 150, value: 10, speed: 18,

    { id: 'puffer', name: 'PUFFERFISH', min: 50, max: 180, value: 15, speed: 10,
      look: { body: 'round', L: 15, Hh: 14, T: 4, tail: 'round', dorsal: [0.15, 0.3, 2], pattern: 'spots', extra: ['spikes'], eye: 3 },
      pal: { b: '#d8c070', s: '#f8f0c8', f: '#b89a50', e: '#201810' } },
    { id: 'mackerel', name: 'MACKEREL', min: 70, max: 220, value: 20, speed: 28,
      look: { body: 'fusi', L: 22, Hh: 9, T: 7, tail: 'fork', dorsal: [0.35, 0.55, 4], pattern: 'wavy', extra: ['finlets'] },
      pal: { b: '#3a8a8a', s: '#d0e4e8', f: '#4a8a96', e: '#0a1418' } },
    { id: 'snapper', name: 'RED SNAPPER', min: 100, max: 280, value: 30, speed: 18,
      look: { body: 'fusi', L: 20, Hh: 13, T: 7, tail: 'fork', dorsal: [0.15, 0.75, 5], eye: 3 },
      pal: { b: '#d84a4a', s: '#f8b0a0', f: '#e0606a', e: '#200a0a' } },
    { id: 'tuna', name: 'BLUEFIN TUNA', min: 140, max: 360, value: 55, speed: 26,
      look: { body: 'fusi', L: 30, Hh: 14, T: 10, tail: 'lunate', dorsal: [0.45, 0.62, 6], pattern: 'lateral', extra: ['finlets'], eye: 3 },
      pal: { b: '#24407a', s: '#c8d4e4', f: '#e0c040', e: '#0a1020', p: '#8aa0c8' } },
    { id: 'lantern', name: 'LANTERNFISH', min: 170, max: 450, value: 70, speed: 20, glow: '#7af0ff',
      look: { body: 'fusi', L: 14, Hh: 7, T: 5, tail: 'fork', dorsal: [0.4, 0.55, 3], eye: 3 },
      pal: { b: '#384a6a', s: '#5a7090', f: '#4a5c7c', e: '#0a1020' } },
    { id: 'hatchet', name: 'HATCHETFISH', min: 220, max: 520, value: 95, speed: 14, glow: '#a0f0ff',
      look: { body: 'deep', L: 12, Hh: 14, T: 4, tail: 'fork', dorsal: [0.3, 0.45, 3], eye: 3 },
      pal: { b: '#a8b8c8', s: '#e8f0f8', f: '#8a9aac', e: '#101418' } },
    { id: 'sword', name: 'SWORDFISH', min: 260, max: 600, value: 140, speed: 34,
      look: { body: 'fusi', L: 30, Hh: 11, T: 10, tail: 'lunate', dorsal: [0.6, 0.78, 9], extra: ['bill'], eye: 3 },
      pal: { b: '#4a4a7a', s: '#c0c4dc', f: '#5a5a8a', e: '#0a0a14', g: '#9a9ac0' } },
    { id: 'angler', name: 'ANGLERFISH', min: 380, max: 800, value: 220, speed: 9, glow: '#fff07a',
      look: { body: 'round', L: 18, Hh: 15, T: 5, tail: 'round', dorsal: [0.15, 0.35, 2], extra: ['lure', 'teeth'], eyeT: 0.68 },
      pal: { b: '#5a4040', s: '#7a5a5a', f: '#4a3434', e: '#101010', l: '#8a6a6a' } },
    { id: 'viper', name: 'VIPERFISH', min: 420, max: 900, value: 300, speed: 22, glow: '#7affb0',
      look: { body: 'fusi', L: 20, Hh: 8, T: 6, tail: 'fork', dorsal: [0.65, 0.75, 4], extra: ['fangs'], eye: 3 },
      pal: { b: '#2a3a4a', s: '#3e5262', f: '#3a4a5a', e: '#7affb0' } },
    { id: 'gulper', name: 'GULPER EEL', min: 550, max: 1100, value: 450, speed: 12,
      look: { body: 'eel', L: 44, Hh: 5, T: 0, extra: ['gulp'] },
      pal: { b: '#2a2030', s: '#4a3a50', f: '#3a2a40', e: '#ff5a5a', g: '#ff7ac0' } },
    { id: 'blob', name: 'BLOBFISH', min: 700, max: 1300, value: 650, speed: 6,
      look: { body: 'blob', L: 18, Hh: 13, T: 4, tail: 'round', extra: ['droop'] },
      pal: { b: '#e8a0a8', s: '#f8c8d0', f: '#d08890', e: '#301018' } },
    { id: 'ghost', name: 'GHOST SHARK', min: 800, max: 1500, value: 900, speed: 18, glow: '#c0d0ff',
      look: { body: 'shark', L: 28, Hh: 11, T: 12, tail: 'rat', dorsal: [0.6, 0.72, 7], eye: 3 },
      pal: { b: '#8a90a8', s: '#c8cce0', f: '#7a809a', e: '#0a1420' } },
    { id: 'oar', name: 'OARFISH', min: 1000, max: 1700, value: 1400, speed: 10,
      look: { body: 'eel', L: 56, Hh: 7, T: 0, extra: ['crest'] },
      pal: { b: '#c8d0e0', s: '#ffffff', f: '#e04050', e: '#101018' } },
    { id: 'dragon', name: 'DRAGONFISH', min: 1150, max: 1700, value: 2000, speed: 20, glow: '#ff5ad0',
      look: { body: 'eel', L: 28, Hh: 6, T: 4, tail: 'round', extra: ['fangs', 'barbel'] },
      pal: { b: '#1a1420', s: '#2a2030', f: '#2a2030', e: '#ff5ad0' } },
    { id: 'coela', name: 'COELACANTH', min: 1300, max: 1700, value: 3000, speed: 8,
      look: { body: 'fusi', L: 30, Hh: 15, T: 8, tail: 'lobed', dorsal: [0.5, 0.62, 5], pattern: 'specks', extra: ['lobefins'], eye: 3 },
      pal: { b: '#3a4a6a', s: '#6a7a9a', f: '#4a5a7a', e: '#0a1020' } },
  ];
  const GOLD_PAL = { b: '#e8b400', s: '#fff0a0', f: '#d09a10', e: '#3a2800', g: '#fff7c0', p: '#fff3a0', l: '#c89200', o: '#6a4a00' };
  const CHEST_BONUS = 50000;

  // Tackle. Every level's stats live in these tables.
  const LINE_M = [50, 90, 150, 230, 330, 460, 620, 820, 1060, 1360, 1700];
  const LINE_PRICES = [25, 75, 180, 400, 900, 2000, 4200, 8500, 20000, 50000];
  const HOOK_CAP = [3, 4, 6, 8, 11, 14, 18, 23, 30, 40];
  const HOOK_NAMES = ['RUSTY HOOK', 'IRON HOOK', 'STEEL HOOK', 'DOUBLE HOOK', 'TRIPLE HOOK',
    'BARBED HOOK', 'GANG HOOK', 'SHARK HOOK', 'KRAKEN HOOK', 'NEPTUNE HOOK'];
  const HOOK_PRICES = [20, 60, 150, 350, 800, 1800, 4000, 9000, 25000];
  const POLE_NAMES = ['TWIG ROD', 'BAMBOO ROD', 'FIBERGLASS', 'CARBON ROD', 'TITANIUM ROD', 'DEEPSEA PRO', 'LEGEND ROD'];
  const POLE_COLORS = ['#8a6a3a', '#c8b060', '#3a7a5a', '#2a2a30', '#a0a8b8', '#2a4a8a', '#c8962a'];
  const POLE_PUSH = [0, 1, 1, 2, 3, 4, 6];        // fish you can shove past on the way down
  const POLE_SPEED = [1, 1.1, 1.25, 1.4, 1.55, 1.7, 1.9];
  const POLE_PRICES = [40, 140, 450, 1400, 4500, 14000];
  const BAIT_NAMES = ['WORM', 'CRICKET', 'SHRIMP', 'MINNOW', 'SQUID', 'GLOW LURE', 'GOLD LURE'];
  const BAIT_VALUE = [1, 1.2, 1.45, 1.75, 2.1, 2.6, 3.2];
  const BAIT_PULL = [0, 8, 12, 16, 20, 25, 30];    // how far fish swim to the hook on the way up
  const BAIT_LIGHT = [16, 18, 20, 23, 26, 32, 40]; // how far the hook lights up the dark
  const BAIT_PRICES = [30, 120, 400, 1300, 4000, 12000];

  const UPGRADES = [
    {
      id: 'line', name: 'LINE', icon: 'spool', prices: LINE_PRICES,
      now: (l) => 'REACHES ' + LINE_M[l] + 'M',
      next: (l) => 'NEXT: ' + LINE_M[l + 1] + 'M DEEP',
    },
    {
      id: 'hook', name: 'HOOK', icon: 'hook', prices: HOOK_PRICES,
      now: (l) => HOOK_NAMES[l] + ' (' + HOOK_CAP[l] + ')',
      next: (l) => 'NEXT: HOLDS ' + HOOK_CAP[l + 1] + ' FISH',
    },
    {
      id: 'pole', name: 'POLE', icon: 'rod', prices: POLE_PRICES,
      now: (l) => POLE_NAMES[l],
      next: (l) => 'NEXT: PUSH ' + POLE_PUSH[l + 1] + ' REEL +' + Math.round((POLE_SPEED[l + 1] - 1) * 100) + '%',
    },
    {
      id: 'bait', name: 'BAIT', icon: 'bait', prices: BAIT_PRICES,
      now: (l) => BAIT_NAMES[l] + ' X' + BAIT_VALUE[l],
      next: (l) => 'NEXT: ' + BAIT_NAMES[l + 1] + ' X' + BAIT_VALUE[l + 1],
    },
  ];

  // ---------------------------------------------------------------------------
  // Canvas
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('game');
  canvas.width = W * S;
  canvas.height = H * S;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function resize() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    const scale = s >= 1 ? Math.floor(s) : s;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
  }
  addEventListener('resize', resize);
  resize();

  // Draw a sprite built at detail resolution.
  const spr = (img, x, y) => ctx.drawImage(img, snap(x), snap(y), img.width / S, img.height / S);
  // One detail pixel.
  function dot(x, y, c) {
    ctx.fillStyle = c;
    ctx.fillRect(snap(x), snap(y), 1 / S, 1 / S);
  }

  // ---------------------------------------------------------------------------
  // Storage (cash, tackle and the fish log survive reloads when the browser allows it)
  // ---------------------------------------------------------------------------
  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem('littleLure.' + key);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem('littleLure.' + key, JSON.stringify(value));
      } catch (e) { /* storage unavailable */ }
    },
  };

  const save = Object.assign({
    money: 0,
    lv: { line: 0, hook: 0, pole: 0, bait: 0 },
    caught: {},
    golden: {},
    best: 0,
    zones: 1,
    chest: false,
    dives: 0,
  }, store.get('save', {}));
  const persist = () => store.set('save', save);

  // ---------------------------------------------------------------------------
  // Pixel font (3x5)
  // ---------------------------------------------------------------------------
  const FONT = {
    A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
    E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
    I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
    M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
    Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
    Y: '101101010010010', Z: '111001010100111',
    0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
    4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010',
    8: '111101111101111', 9: '111101111001110',
    '!': '010010010000010', '.': '000000000000010', ':': '000010000010000', '-': '000000111000000',
    '+': '000010111010000', '/': '001001010100100', "'": '010010000000000', '?': '110001010000010',
    '<': '001010100010001', '>': '100010001010100', '=': '000111000111000', ',': '000000000010100',
    '$': '011110010011110', '%': '101001010100101', '(': '010100100100010', ')': '010001001001010',
  };

  const textWidth = (str, scale = 1) => (str.length ? str.length * 4 * scale - scale : 0);

  function drawTextRaw(str, x, y, color, scale) {
    ctx.fillStyle = color;
    for (let i = 0; i < str.length; i++) {
      const glyph = FONT[str[i]];
      if (!glyph) continue;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (glyph[r * 3 + c] === '1') {
            ctx.fillRect(x + i * 4 * scale + c * scale, y + r * scale, scale, scale);
          }
        }
      }
    }
  }

  function drawText(str, x, y, color = '#fff', scale = 1, align = 'left', shadow = '#000') {
    str = String(str).toUpperCase();
    const w = textWidth(str, scale);
    if (align === 'center') x -= Math.floor(w / 2);
    else if (align === 'right') x -= w;
    x = Math.round(x);
    y = Math.round(y);
    if (shadow) drawTextRaw(str, x + 1, y + 1, shadow, scale);
    drawTextRaw(str, x, y, color, scale);
  }

  // Text whose letters bob in a wave.
  function drawWavyText(str, x, y, color, scale, shadow, amp, speed) {
    const w = textWidth(str, scale);
    let cx = Math.round(x - w / 2);
    for (let i = 0; i < str.length; i++) {
      const oy = Math.round(Math.sin(time * speed - i * 0.6) * amp);
      drawText(str[i], cx, y + oy, color, scale, 'left', shadow);
      cx += 4 * scale;
    }
  }

  // ---------------------------------------------------------------------------
  // Fish sprites (generated at detail resolution, four swim frames each)
  // ---------------------------------------------------------------------------
  // Half-height of a body at t (0 = tail joint, 1 = nose), as a 0..1 fraction.
  function profile(body, t) {
    if (body === 'eel') {
      if (t < 0.08) return 0.45 + t / 0.08 * 0.55;
      if (t > 0.93) return Math.sqrt(Math.max(0, 1 - ((t - 0.93) / 0.07) ** 2)) * 0.6 + 0.4;
      return 1;
    }
    const [c, mn] = { round: [0.5, 0.3], deep: [0.55, 0.18], blob: [0.6, 0.38], shark: [0.5, 0.12] }[body] || [0.58, 0.2];
    if (t < c) return mn + (1 - mn) * Math.pow(Math.sin(Math.PI / 2 * t / c), 0.9);
    const u = (t - c) / (1 - c);
    return body === 'shark' ? Math.max(0.15, 1 - Math.pow(u, 1.6)) : Math.sqrt(Math.max(0, 1 - u * u));
  }

  function fishFrame(look, pal, phase) {
    const L = look.L, Hh = look.Hh, T = look.T || 0;
    const ex = look.extra || [];
    const has = (k) => ex.includes(k);
    const eel = look.body === 'eel';
    const A = eel ? 2 : 1.2;
    const dors = look.dorsal;
    const gulp = has('gulp') ? 4 : 0;
    const finTop = Math.max(dors ? dors[2] : 0, has('crest') ? 9 : 0, has('lure') ? 10 : 0, has('spikes') ? 2 : 0) + gulp;
    const bill = has('bill') ? 14 : 0;
    const below = 4 + (has('barbel') ? 9 : 0) + (has('lobefins') ? 3 : 0) + (has('spikes') ? 2 : 0) + gulp;
    const cw = 3 + T + L + bill + 3;
    const ch = Math.ceil(2 + finTop + A + Hh + A + below);
    const x0 = 2 + T;
    const cy = 2 + finTop + A + Hh / 2;
    let grid = new Array(cw * ch).fill(null);
    const set = (x, y, c) => {
      x = Math.round(x);
      y = Math.round(y);
      if (x >= 0 && y >= 0 && x < cw && y < ch) grid[y * cw + x] = c;
    };
    const get = (x, y) => (x >= 0 && y >= 0 && x < cw && y < ch ? grid[y * cw + x] : null);
    const yOff = (xi) => (eel ? A * Math.sin(phase - xi * 0.22) : A * Math.sin(phase) * Math.pow(1 - xi / L, 2));
    const half = (xi) => {
      const t = (xi + 0.5) / L;
      let h = profile(look.body, t) * Hh / 2;
      if (gulp && t > 0.72) h *= 1 + 1.6 * ((t - 0.72) / 0.28);
      return Math.max(0.6, h);
    };
    const glow = [];
